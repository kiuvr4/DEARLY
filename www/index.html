            resetFutureLetter() {
                this.confirmAction('Hapus atau tulis ulang surat ini?', () => {
                    this.state.data.letter = null;
                    this.saveState();
                    this.render();
                    this.toast('Surat direset.');
                });
            }

            renderHabitsView() {
                const habits = this.state.data.habits;
                const todayStr = new Date().toISOString().slice(0, 10);

                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-sage flex items-center justify-center shrink-0">${SPACE_ICONS.habits}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Habit Tracker</h1>
                                <p class="text-sm text-muted">Bangun rutinitas lembut yang konsisten setiap harinya.</p>
                            </div>
                        </div>
                        <button onclick="app.openHabitForm()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md flex items-center gap-2 self-start sm:self-auto">
                            <i class="ph-bold ph-plus"></i> Tambah Kebiasaan
                        </button>
                    </div>

                    ${habits.length === 0 ? this.renderEmptyState('Belum ada kebiasaan yang dipantau.', 'Mulai dengan satu rutinitas kecil yang lembut, seperti minum air putih atau membaca 10 halaman.', 'Tambah Kebiasaan', 'app.openHabitForm()') : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${habits.map((h, idx) => {
                            const history = h.history || [];
                            const isDoneToday = history.includes(todayStr);
                            const activeColor = idx % 2 === 0 ? '#E8A5B0' : '#9EC489';
                            return `
                            <div class="dearly-card p-5 space-y-4 stagger-item" style="animation-delay:${idx * 0.04}s">
                                <div class="flex items-center justify-between gap-3">
                                    <div class="flex items-center gap-3">
                                        <button onclick="app.toggleHabitToday('${h.id}', event)" class="w-9 h-9 rounded-2xl flex items-center justify-center transition-transform active:scale-90 border ${isDoneToday ? 'border-transparent text-white shadow-xs' : 'bg-cream border-borderwarm text-softgray'}" style="${isDoneToday ? 'background-color:' + activeColor : ''}">
                                            <i class="ph-bold ph-check text-base"></i>
                                        </button>
                                        <div>
                                            <h3 class="font-semibold text-base text-charcoal">${this.escapeHtml(h.name)}</h3>
                                            <div class="text-[11px] text-softgray">${history.length} hari tercatat</div>
                                        </div>
                                    </div>
                                    <button onclick="app.deleteHabit('${h.id}')" class="text-softgray hover:text-red-600 text-xs p-2 rounded-full"><i class="ph ph-trash"></i></button>
                                </div>
                                <div class="grid grid-cols-14 gap-1.5 pt-1" style="grid-template-columns: repeat(14, minmax(0, 1fr));">
                                    ${this.renderHabitContributionGrid(history, activeColor)}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`}
                </div>`;
            }

            renderHabitContributionGrid(history, activeColor) {
                let html = '';
                for (let i = 27; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dateStr = d.toISOString().slice(0, 10);
                    const active = history.includes(dateStr);
                    html += `<div class="aspect-square rounded-[4px] border border-borderwarm/70 transition-colors" style="background-color:${active ? activeColor : 'var(--surface-subtle)'}" title="${dateStr}"></div>`;
                }
                return html;
            }

            openHabitForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Buat Kebiasaan Baru</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Nama Kebiasaan *</label>
                            <input id="h-name" type="text" placeholder="Minum 2L air putih / Journaling 10 menit..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveHabit()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveHabit() {
                const name = document.getElementById('h-name').value.trim();
                if (!name) {
                    this.toast('Nama kebiasaan wajib diisi.', 'error');
                    return;
                }
                this.state.data.habits.push({
                    id: 'h_' + Date.now(),
                    name,
                    history: []
                });
                this.logActivity('habits', 'Membuat kebiasaan baru', name);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Kebiasaan ditambahkan.');
            }

            toggleHabitToday(id, event) {
                const h = this.state.data.habits.find(x => x.id === id);
                if (!h) return;
                const todayStr = new Date().toISOString().slice(0, 10);
                if (!h.history) h.history = [];
                if (h.history.includes(todayStr)) {
                    h.history = h.history.filter(d => d !== todayStr);
                } else {
                    h.history.push(todayStr);
                    this.triggerSparkleBurst(event);
                    this.logActivity('habits', 'Menyelesaikan kebiasaan', h.name);
                    this.toast('Hebat! Satu langkah kecil hari ini.');
                }
                this.saveState();
                this.render();
            }

            deleteHabit(id) {
                this.confirmAction('Hapus kebiasaan ini?', () => {
                    this.state.data.habits = this.state.data.habits.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Kebiasaan dihapus.');
                });
            }

            renderGoalsView() {
                const goals = this.state.data.goals;
                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-butter flex items-center justify-center shrink-0">${SPACE_ICONS.goals}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Personal Goals</h1>
                                <p class="text-sm text-muted">Rencanakan impian jangka panjang dan pantau langkah pencapaiannya.</p>
                            </div>
                        </div>
                        <button onclick="app.openGoalForm()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md flex items-center gap-2 self-start sm:self-auto">
                            <i class="ph-bold ph-plus"></i> Tambah Target
                        </button>
                    </div>

                    ${goals.length === 0 ? this.renderEmptyState('Belum ada target pribadi.', 'Tuliskan satu impian yang ingin kamu wujudkan pelan-pelan.', 'Buat Target Pertama', 'app.openGoalForm()') : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${goals.map(g => `
                            <div class="dearly-card p-6 space-y-4 flex flex-col justify-between">
                                <div class="space-y-2.5">
                                    <div class="flex items-start justify-between gap-2">
                                        <div>
                                            <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-butter text-charcoal">${this.escapeHtml(g.category || 'Pengembangan Diri')}</span>
                                            <h3 class="font-serif text-2xl font-medium text-charcoal mt-1.5">${this.escapeHtml(g.title)}</h3>
                                        </div>
                                        <span class="text-xs font-semibold px-3 py-1 rounded-full ${g.progress >= 100 ? 'bg-sage text-charcoal' : 'bg-cream border border-borderwarm text-dusty'}">${g.progress >= 100 ? 'Tercapai' : 'Berjalan'}</span>
                                    </div>
                                    <p class="text-xs text-muted leading-relaxed">${this.escapeHtml(g.description || '')}</p>
                                </div>
                                <div class="space-y-3 pt-3 border-t border-borderwarm">
                                    <div class="flex items-center justify-between text-xs font-medium text-muted">
                                        <span>Progres: ${g.progress || 0}%</span>
                                        ${g.deadline ? `<span>Tenggat: ${this.formatDate(g.deadline)}</span>` : ''}
                                    </div>
                                    <div class="w-full bg-cream h-2.5 rounded-full overflow-hidden border border-borderwarm">
                                        <div class="h-full rounded-full transition-all duration-500 progress-shimmer-bar" style="width: ${g.progress || 0}%; background-color:#9EC489;"></div>
                                    </div>
                                    <div class="flex items-center justify-between pt-1">
                                        <button onclick="app.adjustGoalProgress('${g.id}', 25, event)" class="text-[11px] font-semibold px-3 py-1 rounded-full bg-cream hover:opacity-85 border border-borderwarm text-charcoal">+25% Progres</button>
                                        <button onclick="app.deleteGoal('${g.id}')" class="text-softgray hover:text-red-600 text-xs p-1"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>`}
                </div>`;
            }

            openGoalForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Buat Target Baru</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Judul Target *</label>
                            <input id="g-title" type="text" placeholder="Membaca 24 buku tahun ini..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Kategori</label>
                                <input id="g-cat" type="text" placeholder="Karier, Buku, Kesehatan" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Tenggat Waktu</label>
                                <input id="g-date" type="date" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Deskripsi / Langkah Kecil</label>
                            <textarea id="g-desc" rows="3" placeholder="Detail rencana pencapaian..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm"></textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveGoal()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Target</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveGoal() {
                const title = document.getElementById('g-title').value.trim();
                const category = document.getElementById('g-cat').value.trim();
                const deadline = document.getElementById('g-date').value;
                const description = document.getElementById('g-desc').value.trim();

                if (!title) {
                    this.toast('Judul target wajib diisi.', 'error');
                    return;
                }

                this.state.data.goals.push({
                    id: 'g_' + Date.now(),
                    title,
                    category,
                    deadline,
                    description,
                    progress: 0
                });
                this.logActivity('goals', 'Membuat target baru', title);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Target ditambahkan.');
            }

            adjustGoalProgress(id, add, event) {
                const g = this.state.data.goals.find(x => x.id === id);
                if (!g) return;
                g.progress = Math.min(100, (g.progress || 0) + add);
                if (g.progress >= 100) this.triggerSparkleBurst(event);
                this.saveState();
                this.render();
                this.toast(`Progres "${g.title}" diperbarui menjadi ${g.progress}%.`);
            }

            deleteGoal(id) {
                this.confirmAction('Hapus target ini?', () => {
                    this.state.data.goals = this.state.data.goals.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Target dihapus.');
                });
            }

            renderFinanceView() {
                const fin = this.state.data.finance;
                const totalIncome = fin.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
                const totalExpense = fin.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);
                const balance = totalIncome - totalExpense;
                const totalSavings = fin.savingsGoals.reduce((sum, s) => sum + Number(s.currentAmount), 0);

                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-sage flex items-center justify-center shrink-0">${SPACE_ICONS.finance}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Finance & Savings</h1>
                                <p class="text-sm text-muted">Kelola pemasukan, pengeluaran, dan target tabungan impian.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">

                            <button onclick="app.openSavingsForm()" class="px-4 py-2.5 rounded-full bg-sage text-charcoal text-xs sm:text-sm font-semibold shadow-sm">+ Target Tabungan</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Pemasukan</div>
                            <div class="text-lg sm:text-xl font-bold text-charcoal">${this.formatCurrency(totalIncome)}</div>
                        </div>
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Pengeluaran</div>
                            <div class="text-lg sm:text-xl font-bold text-dusty">${this.formatCurrency(totalExpense)}</div>
                        </div>
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Saldo Utama</div>
                            <div class="text-lg sm:text-xl font-bold text-charcoal">${this.formatCurrency(balance)}</div>
                        </div>
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Total Tabungan</div>
                            <div class="text-lg sm:text-xl font-bold text-dusty">${this.formatCurrency(totalSavings)}</div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h2 class="font-serif text-2xl font-medium text-charcoal">Kantong Tabungan Impian</h2>
                        ${fin.savingsGoals.length === 0 ? `

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            ${fin.savingsGoals.map(sg => {
                                const pct = sg.targetAmount > 0 ? Math.min(100, Math.round((sg.currentAmount / sg.targetAmount) * 100)) : 0;
                                return `
                                <div class="dearly-card p-5 space-y-4">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <h3 class="font-serif text-xl font-medium text-charcoal">${this.escapeHtml(sg.name)}</h3>
                                            <div class="text-xs text-muted mt-0.5">Terkumpul ${this.formatCurrency(sg.currentAmount)} dari ${this.formatCurrency(sg.targetAmount)}</div>
                                        </div>
                                        <span class="text-xs font-bold text-dusty">${pct}%</span>
                                    </div>
                                    <div class="w-full bg-cream h-2.5 rounded-full overflow-hidden border border-borderwarm">
                                        <div class="h-full rounded-full transition-all duration-300" style="width: ${pct}%; background-color:#9EC489;"></div>
                                    </div>
                                    <div class="flex items-center justify-between pt-1">
                                        <button onclick="app.openDepositModal('${sg.id}')" class="px-3.5 py-1.5 rounded-full bg-sage hover:opacity-90 text-charcoal text-xs font-semibold">+ Setor Tabungan</button>
                                        <button onclick="app.deleteSavingsGoal('${sg.id}')" class="text-softgray hover:text-red-600 text-xs p-1"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>`}
                    </div>

                    <div class="space-y-4">
                        <h2 class="font-serif text-2xl font-medium text-charcoal">Riwayat Transaksi</h2>
                        ${fin.transactions.length === 0 ? `
                        <div class="dearly-card p-8 text-center text-sm text-muted">Belum ada riwayat transaksi tercatat.</div>` : `
                        <div class="dearly-card p-4 space-y-2">
                            ${fin.transactions.map(t => `
                                <div class="flex items-center justify-between p-3 rounded-2xl bg-cream border border-borderwarm">
                                    <div class="flex items-center gap-3">
                                        <div class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs ${t.type === 'income' ? 'bg-sage text-charcoal' : 'bg-blush text-dusty'}">
                                            ${t.type === 'income' ? 'IN' : 'EX'}
                                        </div>
                                        <div>
                                            <div class="font-semibold text-sm text-charcoal">${this.escapeHtml(t.description || t.category)}</div>
                                            <div class="text-[11px] text-softgray">${this.formatDate(t.date)} • ${this.escapeHtml(t.category)}</div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="font-bold text-sm ${t.type === 'income' ? 'text-charcoal' : 'text-dusty'}">${t.type === 'income' ? '+' : '-'}${this.formatCurrency(t.amount)}</span>
                                        <button onclick="app.deleteTransaction('${t.id}')" class="text-softgray hover:text-red-600 text-xs p-1"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>`}
                    </div>
                </div>`;
            }

            openTransactionForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Tambah Transaksi Keuangan</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Jenis</label>
                                <select id="t-type" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                                    <option value="expense">Pengeluaran</option>
                                    <option value="income">Pemasukan</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Nominal (Rp) *</label>
                                <input id="t-amount" type="number" placeholder="50000" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Kategori</label>
                            <input id="t-cat" type="text" placeholder="Makanan, Transport, Gaji, Hadiah" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Deskripsi</label>
                            <input id="t-desc" type="text" placeholder="Makan siang bersama sahabat..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveTransaction()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveTransaction() {
                const type = document.getElementById('t-type').value;
                const amount = Number(document.getElementById('t-amount').value);
                const category = document.getElementById('t-cat').value.trim() || 'Umum';
                const description = document.getElementById('t-desc').value.trim();

                if (!amount || amount <= 0) {
                    this.toast('Masukkan nominal transaksi yang valid.', 'error');
                    return;
                }

                this.state.data.finance.transactions.unshift({
                    id: 't_' + Date.now(),
                    type,
                    amount,
                    category,
                    description,
                    date: new Date().toISOString()
                });
                this.logActivity('finance', 'Mencatat transaksi', description || category);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Transaksi berhasil dicatat.');
            }

            deleteTransaction(id) {
                this.confirmAction('Hapus transaksi ini?', () => {
                    this.state.data.finance.transactions = this.state.data.finance.transactions.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Transaksi dihapus.');
                });
            }

            openSavingsForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Buat Kantong Tabungan</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Nama Target / Barang *</label>
                            <input id="sg-name" type="text" placeholder="Kamera baru / Liburan akhir tahun..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Nominal Target (Rp) *</label>
                            <input id="sg-target" type="number" placeholder="1500000" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveSavingsGoal()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveSavingsGoal() {
                const name = document.getElementById('sg-name').value.trim();
                const targetAmount = Number(document.getElementById('sg-target').value);

                if (!name || !targetAmount || targetAmount <= 0) {
                    this.toast('Nama dan nominal target wajib diisi.', 'error');
                    return;
                }

                this.state.data.finance.savingsGoals.push({
                    id: 'sg_' + Date.now(),
                    name,
                    targetAmount,
                    currentAmount: 0
                });
                this.logActivity('finance', 'Membuat kantong tabungan', name);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Kantong tabungan dibuat.');
            }

            openDepositModal(sgId) {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Tambah Setoran Tabungan</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Nominal Setoran (Rp) *</label>
                            <input id="dep-amount" type="number" placeholder="50000" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveDeposit('${sgId}')" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Setor</button>
                        </div>
                    </div>
                `, 'max-w-sm');
            }

            saveDeposit(sgId) {
                const amount = Number(document.getElementById('dep-amount').value);
                if (!amount || amount <= 0) {
                    this.toast('Nominal setoran tidak valid.', 'error');
                    return;
                }
                const sg = this.state.data.finance.savingsGoals.find(x => x.id === sgId);
                if (sg) {
                    sg.currentAmount = Number(sg.currentAmount) + amount;
                    this.logActivity('finance', 'Menyetor tabungan', sg.name);
                    this.saveState();
                    this.closeModal();
                    this.render();
                    this.toast(`Setoran ${this.formatCurrency(amount)} ditambahkan ke ${sg.name}.`);
                }
            }

            deleteSavingsGoal(id) {
                this.confirmAction('Hapus kantong tabungan ini?', () => {
                    this.state.data.finance.savingsGoals = this.state.data.finance.savingsGoals.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Kantong tabungan dihapus.');
                });
            }

            renderWatchlistView() {
                const items = this.state.data.watchlist;
                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-powder flex items-center justify-center shrink-0">${SPACE_ICONS.watchlist}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Watchlist</h1>
                                <p class="text-sm text-muted">Arsip K-Drama, film, anime, serta rating dan ulasan setelah selesai menonton.</p>
                            </div>
                        </div>
                        <button onclick="app.openWatchlistForm()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md flex items-center gap-2 self-start sm:self-auto">
                            <i class="ph-bold ph-plus"></i> Catat Tontonan
                        </button>
                    </div>

                    ${items.length === 0 ? this.renderEmptyState('Belum ada catatan tontonan.', 'Simpan judul film, K-Drama, atau anime yang baru saja selesai kamu tonton beserta skornya.', 'Catat Tontonan Pertama', 'app.openWatchlistForm()') : `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${items.map((w, idx) => `
                            <div class="dearly-card dearly-card-hover p-5 flex flex-col justify-between gap-3 stagger-item" style="animation-delay:${idx * 0.04}s">
                                <div class="space-y-2.5">
                                    <div class="flex items-center justify-between gap-2">
                                        <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-powder text-charcoal">${this.escapeHtml(w.category)}</span>
                                        ${w.rating ? `<span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-butter text-charcoal">★ ${w.rating}/10</span>` : ''}
                                    </div>
                                    <h3 class="font-serif text-2xl font-medium text-charcoal">${this.escapeHtml(w.title)}</h3>
                                    ${w.genre ? `
                                    <div class="flex flex-wrap gap-1.5 pt-0.5">
                                        ${w.genre.split(',').map(g => g.trim()).filter(Boolean).map(g => `
                                            <span class="text-[10px] font-medium px-2.5 py-0.5 rounded-full bg-cream border border-borderwarm text-muted">${this.escapeHtml(g)}</span>
                                        `).join('')}
                                    </div>` : ''}
                                    ${w.review ? `<p class="text-xs text-muted italic mt-1 leading-relaxed">“${this.escapeHtml(w.review)}”</p>` : ''}
                                </div>
                                <div class="flex items-center justify-end gap-1 pt-2 border-t border-borderwarm">
                                    <button onclick="app.openWatchlistForm('${w.id}')" class="p-1.5 rounded-full hover:bg-cream text-muted" title="Edit"><i class="ph ph-pencil-simple"></i></button>
                                    <button onclick="app.deleteWatchlist('${w.id}')" class="p-1.5 rounded-full hover:bg-red-50 text-softgray hover:text-red-600" title="Hapus"><i class="ph ph-trash"></i></button>
                                </div>
                            </div>
                        `).join('')}
                    </div>`}
                </div>`;
            }

            openWatchlistForm(id = null) {
                const existing = id ? this.state.data.watchlist.find(x => x.id === id) : null;
                const selectedGenres = existing && existing.genre
                    ? existing.genre.split(',').map(g => g.trim()).filter(Boolean)
                    : [];
                const initialRating = existing && existing.rating ? existing.rating : '8.5';

                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-serif text-2xl font-medium text-charcoal">${existing ? 'Edit Catatan Tontonan' : 'Catat Tontonan Selesai'}</h3>
                            <button onclick="app.closeModal()" class="p-1.5 rounded-full hover:bg-cream text-muted"><i class="ph ph-x"></i></button>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Judul *</label>
                            <input id="w-title" type="text" value="${existing ? this.escapeHtml(existing.title) : ''}" placeholder="Judul film / K-drama / anime..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1.5">Kategori</label>
                            <div class="flex flex-wrap gap-1.5">
                                ${['K-Drama', 'Movies', 'Anime', 'Series', 'Variety Show'].map(cat => {
                                    const active = existing ? existing.category === cat : cat === 'K-Drama';
                                    return `
                                    <button type="button" onclick="app.selectWatchlistCategory(this, '${cat}')" class="w-cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold border transition-all ${active ? 'bg-dusty text-white border-dusty shadow-xs' : 'bg-cream text-charcoal border-borderwarm hover:bg-blush/40'}">
                                        ${cat}
                                    </button>`;
                                }).join('')}
                            </div>
                            <input id="w-cat" type="hidden" value="${existing ? this.escapeHtml(existing.category) : 'K-Drama'}">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1.5">Pilih Genre (Bisa pilih lebih dari satu)</label>
                            <div class="flex flex-wrap gap-1.5">
                                ${WATCHLIST_GENRES.map(g => {
                                    const active = selectedGenres.includes(g);
                                    return `
                                    <button type="button" onclick="app.toggleWatchlistGenre(this, '${g}')" class="w-genre-pill px-3 py-1 rounded-full text-xs font-medium border transition-all ${active ? 'bg-blush text-charcoal border-dusty font-semibold' : 'bg-cream text-muted border-borderwarm hover:text-charcoal'}">
                                        ${g}
                                    </button>`;
                                }).join('')}
                            </div>
                            <input id="w-genre" type="hidden" value="${this.escapeHtml(selectedGenres.join(', '))}">
                        </div>
                        <div class="p-3.5 rounded-2xl bg-cream border border-borderwarm space-y-2">
                            <div class="flex items-center justify-between">
                                <label for="w-rating" class="text-xs font-semibold text-charcoal">Rating Pribadi</label>
                                <span id="w-rating-display" class="px-3 py-0.5 rounded-full bg-butter text-charcoal text-xs font-bold">★ ${initialRating} / 10</span>
                            </div>
                            <input id="w-rating" type="range" min="1" max="10" step="0.5" value="${initialRating}" oninput="document.getElementById('w-rating-display').textContent = '★ ' + this.value + ' / 10'" class="w-full accent-[#C98288] cursor-pointer">
                            <div class="flex justify-between text-[10px] text-softgray px-0.5">
                                <span>1 (Biasa)</span>
                                <span>5.5 (Lumayan)</span>
                                <span>10 (Favorit!)</span>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Ulasan / Kesan Singkat</label>
                            <textarea id="w-review" rows="3" placeholder="Bagian mana yang paling berkesan dari ceritanya?" class="w-full px-4 py-2 rounded-2xl bg-cream border border-borderwarm text-sm">${existing ? this.escapeHtml(existing.review || '') : ''}</textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveWatchlist('${id || ''}')" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Tontonan</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            selectWatchlistCategory(btnEl, catName) {
                document.querySelectorAll('.w-cat-pill').forEach(b => {
                    b.className = 'w-cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold border transition-all bg-cream text-charcoal border-borderwarm hover:bg-blush/40';
                });
                btnEl.className = 'w-cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold border transition-all bg-dusty text-white border-dusty shadow-xs';
                const hidden = document.getElementById('w-cat');
                if (hidden) hidden.value = catName;
            }

            toggleWatchlistGenre(btnEl, genreName) {
                const hidden = document.getElementById('w-genre');
                if (!hidden) return;
                let list = hidden.value ? hidden.value.split(',').map(x => x.trim()).filter(Boolean) : [];
                if (list.includes(genreName)) {
                    list = list.filter(x => x !== genreName);
                    btnEl.className = 'w-genre-pill px-3 py-1 rounded-full text-xs font-medium border transition-all bg-cream text-muted border-borderwarm hover:text-charcoal';
                } else {
                    list.push(genreName);
                    btnEl.className = 'w-genre-pill px-3 py-1 rounded-full text-xs font-medium border transition-all bg-blush text-charcoal border-dusty font-semibold';
                }
                hidden.value = list.join(', ');
            }

            saveWatchlist(id = '') {
                const title = document.getElementById('w-title').value.trim();
                const category = document.getElementById('w-cat').value;
                const genre = document.getElementById('w-genre').value.trim();
                const rating = document.getElementById('w-rating').value;
                const review = document.getElementById('w-review').value.trim();

                if (!title) {
                    this.toast('Judul tontonan wajib diisi.', 'error');
                    return;
                }

                if (id) {
                    const item = this.state.data.watchlist.find(x => x.id === id);
                    if (item) {
                        item.title = title;
                        item.category = category;
                        item.genre = genre;
                        item.rating = rating;
                        item.review = review;
                        this.logActivity('watchlist', 'Memperbarui tontonan', title);
                    }
                } else {
                    this.state.data.watchlist.unshift({
                        id: 'w_' + Date.now(),
                        title,
                        category,
                        genre,
                        rating,
                        review
                    });
                    this.logActivity('watchlist', 'Menyimpan tontonan', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Tontonan disimpan.');
            }

            deleteWatchlist(id) {
                this.confirmAction('Hapus item tontonan ini?', () => {
                    this.state.data.watchlist = this.state.data.watchlist.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Dihapus.');
                });
            }

            renderWishlistView() {
                const items = this.state.data.wishlist;
                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-blush flex items-center justify-center shrink-0">${SPACE_ICONS.wishlist}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Wishlist</h1>
                                <p class="text-sm text-muted">Simpan barang-barang manis yang ingin kamu miliki suatu hari nanti.</p>
                            </div>
                        </div>
                        <button onclick="app.openWishlistForm()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md flex items-center gap-2 self-start sm:self-auto">
                            <i class="ph-bold ph-plus"></i> Tambah Keinginan
                        </button>
                    </div>

                    ${items.length === 0 ? this.renderEmptyState('Daftar keinginanmu masih kosong.', 'Simpan daftar barang-barang kecil yang memberi kenyamanan atau inspirasi untukmu.', 'Tambah Wishlist', 'app.openWishlistForm()') : `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        ${items.map(w => `
                            <div class="dearly-card p-5 flex flex-col justify-between gap-3 ${w.purchased ? 'opacity-70' : ''}">
                                <div class="space-y-2.5">
                                    ${w.photo ? `<img src="${this.escapeHtml(w.photo)}" onerror="this.style.display='none'" class="w-full h-40 object-cover rounded-2xl border border-borderwarm">` : ''}
                                    <div class="flex items-center justify-between">
                                        <span class="text-[11px] px-2.5 py-0.5 rounded-full bg-cream border border-borderwarm text-muted">${this.escapeHtml(w.category || 'Umum')}</span>
                                        <button onclick="app.toggleWishlistStatus('${w.id}')" class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full ${w.purchased ? 'bg-sage text-charcoal' : 'bg-blush text-charcoal'}">
                                            ${w.purchased ? '✓ Sudah Dibeli' : 'Belum Dibeli'}
                                        </button>
                                    </div>
                                    <h3 class="font-serif text-xl font-medium text-charcoal ${w.purchased ? 'line-through' : ''}">${this.escapeHtml(w.name)}</h3>
                                    ${w.price ? `<div class="text-sm font-bold text-dusty">${this.formatCurrency(w.price)}</div>` : ''}
                                    ${w.notes ? `<p class="text-xs text-muted">${this.escapeHtml(w.notes)}</p>` : ''}
                                </div>
                                <div class="flex items-center justify-between pt-2 border-t border-borderwarm gap-2">

            sendWishlistToSavings(wishlistId) {
                const item = this.state.data.wishlist.find(x => x.id === wishlistId);
                if (!item || !item.price) return;
                const exists = this.state.data.finance.savingsGoals.some(g => g.name.toLowerCase() === item.name.toLowerCase());
                if (exists) {
                    this.toast('Kantong tabungan untuk barang ini sudah ada di Finance & Savings.', 'error');
                    return;
                }
                this.state.data.finance.savingsGoals.push({
                    id: 'sg_' + Date.now(),
                    name: item.name,
                    targetAmount: Number(item.price),
                    currentAmount: 0
                });
                this.logActivity('finance', 'Membuat tabungan dari Wishlist', item.name);

                                    <div class="flex items-center justify-between text-xs text-softgray">
                                        <span>${this.formatDate(n.date)}</span>
                                        ${n.tag ? `<span class="px-2.5 py-0.5 rounded-full bg-powder text-charcoal font-medium">#${this.escapeHtml(n.tag)}</span>` : ''}
                                    </div>
                                    <h3 class="font-serif text-xl font-medium text-charcoal">${this.escapeHtml(n.title)}</h3>
                                    <div class="dearly-rich-content ${fClass} text-xs text-muted line-clamp-4 leading-relaxed" style="${fStyle}">${this.sanitizeRichHtml(n.content)}</div>
                                </div>
                                <div class="flex items-center justify-between pt-2 border-t border-borderwarm">
                                    <button onclick="app.openNoteForm('${n.id}')" class="text-xs font-semibold text-dusty hover:underline">Edit Catatan</button>
                                    <button onclick="app.deleteNote('${n.id}')" class="text-softgray hover:text-red-600 text-xs p-1"><i class="ph ph-trash"></i></button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`}
                </div>`;
            }

            openNoteForm(id = null) {
                const n = id ? this.state.data.notes.find(x => x.id === id) : null;
                const initialFont = n && n.fontStyle ? n.fontStyle : 'sans';
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">${n ? 'Edit Catatan' : 'Catatan Baru'}</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Judul *</label>
                            <input id="n-title" type="text" value="${n ? this.escapeHtml(n.title) : ''}" placeholder="Ide proyek / Daftar belanja..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Tag</label>
                            <input id="n-tag" type="text" value="${n ? this.escapeHtml(n.tag || '') : ''}" placeholder="ide, penting, belanja" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Isi Catatan *</label>
                            ${this.renderRichToolbar('n-content', initialFont)}
                            <div id="n-content" contenteditable="true" data-placeholder="Tulis catatan di sini..." class="dearly-rich-editor ${this.getFontClass(initialFont)} w-full px-4 py-3 rounded-2xl bg-cream border border-borderwarm text-sm leading-relaxed" style="${this.getDynamicFontStyleAttr(initialFont)}">${n ? this.sanitizeRichHtml(n.content) : ''}</div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveNote('${id || ''}')" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Catatan</button>
                        </div>
                    </div>
                `, 'max-w-lg');
            }

            saveNote(id) {
                const title = document.getElementById('n-title').value.trim();
                const tag = document.getElementById('n-tag').value.trim();
                const editorEl = document.getElementById('n-content');
                const rawHtml = editorEl ? editorEl.innerHTML : '';
                const plainText = this.stripHtml(rawHtml).trim();
                const content = this.sanitizeRichHtml(rawHtml);
                const fontStyle = this.activeEditorFonts['n-content'] || 'sans';

                if (!title || !plainText) {
                    this.toast('Judul dan isi catatan wajib diisi.', 'error');
                    return;
                }

                if (id) {
                    const item = this.state.data.notes.find(x => x.id === id);
                    if (item) {
                        item.title = title;
                        item.tag = tag;
                        item.content = content;
                        item.fontStyle = fontStyle;
                        this.logActivity('notes', 'Memperbarui catatan', title);
                    }
                } else {
                    this.state.data.notes.unshift({
                        id: 'n_' + Date.now(),
                        title,
                        tag,
                        content,
                        fontStyle,
                        date: new Date().toISOString()
                    });
                    this.logActivity('notes', 'Membuat catatan baru', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Catatan disimpan.');
            }

            deleteNote(id) {
                this.confirmAction('Hapus catatan ini?', () => {
                    this.state.data.notes = this.state.data.notes.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Catatan dihapus.');
                });
            }

            openGlobalSearch() {
                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex items-center gap-2.5 bg-cream border border-borderwarm rounded-2xl px-4 py-2.5">
                            <i class="ph ph-magnifying-glass text-dusty"></i>
                            <input type="text" id="global-search-input" oninput="app.runGlobalSearch(this.value)" placeholder="Cari apa saja di seluruh ruang Dearly..." class="w-full bg-transparent text-sm focus:outline-none" autofocus>
                        </div>
                        <div id="global-search-results" class="space-y-2 max-h-80 overflow-y-auto">
                            <div class="text-center py-6 text-xs text-softgray">Ketik kata kunci untuk mencari di Daily Journal, Memory Box, Notes & Ideas, dan Recipe Book.</div>
                        </div>
                    </div>
                `, 'max-w-xl');
            }

            runGlobalSearch(query) {
                const container = document.getElementById('global-search-results');
                if (!container) return;
                const q = query.trim().toLowerCase();
                if (!q) {
                    container.innerHTML = `<div class="text-center py-6 text-xs text-softgray">Ketik kata kunci untuk mencari...</div>`;
                    return;
                }

                const results = [];
                this.state.data.journal.forEach(j => {
                    if (j.title.toLowerCase().includes(q) || this.stripHtml(j.content).toLowerCase().includes(q)) {
                        results.push({ type: 'Daily Journal', title: j.title, route: 'journal' });
                    }
                });
                this.state.data.notes.forEach(n => {
                    if (n.title.toLowerCase().includes(q) || this.stripHtml(n.content).toLowerCase().includes(q)) {
                        results.push({ type: 'Notes & Ideas', title: n.title, route: 'notes' });
                    }
                });
                this.state.data.memories.forEach(m => {
                    if (m.title.toLowerCase().includes(q) || this.stripHtml(m.story || '').toLowerCase().includes(q)) {
                        results.push({ type: 'Memory Box', title: m.title, route: 'memories' });
                    }
                });
                this.state.data.recipes.forEach(r => {
                    if (r.name.toLowerCase().includes(q) || r.ingredients.toLowerCase().includes(q)) {
                        results.push({ type: 'Recipe Book', title: r.name, route: 'recipes' });
                    }
                });

                if (results.length === 0) {
                    container.innerHTML = `<div class="text-center py-6 text-xs text-softgray">Tidak ditemukan hasil untuk "${this.escapeHtml(query)}".</div>`;
                    return;
                }

                container.innerHTML = results.map(r => `
                    <button onclick="app.closeModal(); app.navigate('${r.route}')" class="w-full p-3 rounded-2xl bg-cream hover:opacity-85 border border-borderwarm flex items-center justify-between text-left transition-colors">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-dusty">${r.type}</span>
                            <div class="text-sm font-semibold text-charcoal">${this.escapeHtml(r.title)}</div>
                        </div>
                        <i class="ph ph-arrow-right text-softgray"></i>
                    </button>
                `).join('');
            }

                this.openModal(`

                        <div class="flex justify-end gap-2 pt-2">

                    </div>
                `, 'max-w-md');

            saveQuickCapture() {
                const kind = document.getElementById('qc-type').value;
                const title = document.getElementById('qc-title').value.trim();
                const content = document.getElementById('qc-content').value.trim();
                if (!title) {
                    this.toast('Judul wajib diisi.', 'error');
                    return;
                }

                if (kind === 'gratitude') {
                    this.state.data.journal.unshift({
                        id: 'j_' + Date.now(),
                        title,
                        content: content || title,
                        mood: 'Bersyukur',
                        tag: 'syukur',
                        photo: '',
                        paperStyle: 'blank',
                        fontStyle: 'serif',
                        date: new Date().toISOString()
                    });
                    this.logActivity('journal', 'Catat cepat jurnal syukur', title);
                } else if (kind === 'memory') {
                    this.state.data.memories.unshift({
                        id: 'm_' + Date.now(),
                        title,
                        date: new Date().toISOString().slice(0, 10),
                        category: 'Momen Kecil',
                        photo: '',
                        fontStyle: 'sans',
                        story: content || title
                    });
                    this.logActivity('memories', 'Catat cepat kenangan', title);
                } else if (kind === 'task') {
                    this.state.data.activities.unshift({
                        id: 'act_' + Date.now(),
                        name: title,
                        category: 'Rencana',
                        plannedDate: '',
                        description: content,
                        done: false
                    });
                    this.logActivity('activities', 'Catat cepat kegiatan', title);
                } else {
                    this.state.data.notes.unshift({
                        id: 'n_' + Date.now(),
                        title,
                        tag: 'ide',
                        content: content || title,
                        fontStyle: 'sans',
                        date: new Date().toISOString()
                    });
                    this.logActivity('notes', 'Catat cepat catatan', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Tersimpan rapi di Dearly.');
            }

                                    <i class="ph-bold ph-book-open-text text-dusty"></i> Panduan & Update
                                </button>

                                <label class="text-xs font-semibold text-muted block mb-1">Kalimat Sambutan Beranda</label>

                        </div>
                    </div>

            }

            async saveCloudSettingsAndSync(direction) {
                const url = document.getElementById('cloud-url').value.trim();
                const anonKey = document.getElementById('cloud-key').value.trim();
                const syncId = document.getElementById('cloud-sync-id').value.trim();

                if (!url || !anonKey || !syncId) {
                    this.toast('Isi URL, Anon Key, dan Kode Ruang Pribadi terlebih dahulu.', 'error');
                    return;
                }

                this.saveCloudConfig({ enabled: true, url, anonKey, syncId });
                if (direction === 'pull') {
                    await this.pullFromCloud(false);
                } else {
                    await this.pushToCloud(false);
                }
            }

            saveProfile() {
                this.state.profile.userName = document.getElementById('prof-name').value.trim() || 'Sahabat';
                const sub = document.getElementById('prof-sub').value.trim();
                if (sub) this.state.profile.subtitle = sub;

                const pinEnabledEl = document.getElementById('sec-pin-enabled');
                const pinCodeEl = document.getElementById('sec-pin-code');
                if (pinEnabledEl && pinCodeEl) {
                    const code = pinCodeEl.value.trim();
                    if (pinEnabledEl.checked && !/^\d{4}$/.test(code)) {
                        this.toast('PIN harus terdiri dari tepat 4 angka.', 'error');
                        return;
                    }
                    this.state.security = {
                        pinEnabled: pinEnabledEl.checked,
                        pinCode: code
                    };
                }

                const enabledEl = document.getElementById('cloud-enabled');
                if (enabledEl) {
                    this.saveCloudConfig({
                        enabled: enabledEl.checked,
                        url: document.getElementById('cloud-url').value.trim(),
                        anonKey: document.getElementById('cloud-key').value.trim(),
                        syncId: document.getElementById('cloud-sync-id').value.trim()
                    });
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Profil & pengaturan keamanan disimpan.');
            }

            applyThemeVariables() {
                const t = this.state.theme || TEMPLATE_PRESETS[0];
                const root = document.documentElement;
                const icon = document.getElementById('candlelight-icon');

                if (this.state.candlelightMode) {
                    root.classList.add('candlelight-mode');
                    if (icon) icon.className = 'ph-fill ph-sun text-base text-amber-300';
                } else {
                    root.classList.remove('candlelight-mode');
                    root.style.setProperty('--bg-primary', t.bgPrimary);
                    root.style.setProperty('--bg-secondary', t.bgSecondary);
                    root.style.setProperty('--accent-primary', t.accentPrimary);
                    root.style.setProperty('--accent-soft', t.accentSoft);
                    root.style.setProperty('--accent-secondary', t.accentSecondary);
                    root.style.setProperty('--accent-sky', t.accentSky);
                    if (icon) icon.className = 'ph ph-moon-stars text-base text-dusty';
                }
            }

            toast(msg, type = 'success') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const el = document.createElement('div');
                el.className = `dearly-pill px-4 py-2.5 rounded-2xl text-xs font-semibold text-charcoal shadow-lg flex items-center gap-2 animate-enter ${type === 'error' ? 'border-red-300 bg-red-50/95 text-red-700' : ''}`;
                el.innerHTML = `${type === 'error' ? '<i class="ph-bold ph-warning text-red-500"></i>' : '<span class="text-dusty">✦</span>'} <span>${this.escapeHtml(msg)}</span>`;
                container.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }, 3000);
            }

            logActivity(featureId, actionText, itemTitle) {
                const feat = DEARLY_FEATURES.find(f => f.id === featureId);
                this.state.activityLog.unshift({
                    id: 'act_' + Date.now(),
                    featureId,
                    featureTitle: feat ? feat.title : featureId,
                    actionText,
                    itemTitle,
                    timestamp: new Date().toISOString()
                });
                if (this.state.activityLog.length > 25) this.state.activityLog.pop();
            }

            formatDate(isoStr) {
                if (!isoStr) return '';
                try {
                    const d = new Date(isoStr);
                    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                } catch (e) {
                    return isoStr;
                }
            }

            confirmAction(message, onConfirm) {
                this._pendingConfirm = onConfirm;
                this.openModal(`
                    <div class="space-y-4 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-blush/70 text-dusty flex items-center justify-center mx-auto">
                            <i class="ph-bold ph-warning-circle text-2xl"></i>
                        </div>
                        <h3 class="font-serif text-xl font-medium text-charcoal">${this.escapeHtml(message)}</h3>
                        <p class="text-xs text-muted">Tindakan ini tidak dapat dibatalkan setelah dihapus.</p>
                        <div class="flex justify-center gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.executePendingConfirm()" class="px-5 py-2 rounded-full text-xs font-semibold bg-red-600 text-white">Ya, Hapus</button>
                        </div>
                    </div>
                `, 'max-w-sm');
            }

            executePendingConfirm() {
                const fn = this._pendingConfirm;
                this._pendingConfirm = null;
                this.closeModal();
                if (typeof fn === 'function') fn();
            }

            openModal(htmlContent, maxWidthClass = 'max-w-lg') {
                const backdrop = document.getElementById('modal-backdrop');
                const content = document.getElementById('modal-content');
                if (!backdrop || !content) return;
                content.className = `dearly-card w-full ${maxWidthClass} p-6 sm:p-7 shadow-2xl relative animate-enter my-auto`;
                content.innerHTML = htmlContent;
                backdrop.classList.remove('hidden');
                backdrop.classList.add('flex');
            }

            closeModal() {
                const backdrop = document.getElementById('modal-backdrop');
                if (backdrop) {
                    backdrop.classList.remove('flex');
                    backdrop.classList.add('hidden');
                }
            }

            dismissSplash() {
                const splash = document.getElementById('dearly-splash');
                if (splash && !splash.classList.contains('splash-hidden')) {
                    splash.classList.add('splash-hidden');
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 780);
                }
            }

            renderEmptyState(title, description, btnLabel, btnOnclick) {
                return `
                <div class="dearly-card p-10 sm:p-12 text-center max-w-lg mx-auto space-y-4">
                    <div onclick="app.interactWithCompanion(this, event)" title="Sapa Teman Dearly" class="flex justify-center">
                        ${DEARLY_ILLUSTRATIONS.companionPuff}
                    </div>
                    <h3 class="font-serif text-2xl font-medium text-charcoal">${title}</h3>
                    <p class="text-xs sm:text-sm text-muted leading-relaxed">${description}</p>
                    <div class="pt-1">
                        <button onclick="${btnOnclick}" class="px-6 py-2.5 rounded-full bg-dusty hover:opacity-90 text-white text-xs sm:text-sm font-semibold shadow-md transition-transform active:scale-95">
                            + ${btnLabel}
                        </button>
                    </div>
                </div>`;
            }
        }

        function registerDearlyPWA() {
            try {
                const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="48" fill="#F7DDE0"/><path d="M96 36L112 80L156 96L112 112L96 156L80 112L36 96L80 80L96 36Z" fill="#C98288"/></svg>`;
                const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
                const manifest = {
                    name: 'Dearly — Ruang Kecilmu',
                    short_name: 'Dearly',
                    start_url: './',
                    display: 'standalone',
                    background_color: '#FFF7E6',
                    theme_color: '#FFF7E6',
                    icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml' }]
                };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = URL.createObjectURL(blob);
                document.head.appendChild(link);
            } catch (e) {}
        }

        let app;
        window.onload = function() {
            registerDearlyPWA();
            app = new DearlyApp();
            setTimeout(() => {
                if (app) app.dismissSplash();
            }, 1750);
        };
    </script>
</body>
</html>

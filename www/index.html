<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFF7E6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dearly">
    <title>Dearly — Your Little Space</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ivory: 'var(--bg-primary)',
                        cream: 'var(--surface-subtle)',
                        dusty: 'var(--accent-primary)',
                        blush: 'var(--accent-blush)',
                        lavender: 'var(--accent-lavender)',
                        sage: 'var(--accent-sage)',
                        butter: 'var(--accent-butter)',
                        powder: 'var(--accent-powder)',
                        charcoal: 'var(--text-primary)',
                        muted: 'var(--text-secondary)',
                        softgray: 'var(--text-tertiary)',
                        borderwarm: 'var(--border-subtle)'
                    },
                    fontFamily: {
                        serif: ['"Fraunces"', '"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        hand: ['"Caveat"', 'cursive'],
                        mono: ['"JetBrains Mono"', 'monospace']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Indie+Flower&family=JetBrains+Mono:wght@400;500&family=Patrick+Hand&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-primary: #FFF7E6;
            --bg-secondary: #FDF1DC;
            --card-surface: rgba(255, 255, 255, 0.92);
            --surface-subtle: #FCF9F5;
            --pill-surface: rgba(255, 255, 255, 0.98);
            --border-subtle: #EFECE7;
            --card-ring: rgba(255, 255, 255, 0.96);
            --accent-primary: #C98288;
            --accent-soft: #F7C8D3;
            --accent-secondary: #A8B58A;
            --accent-sky: #A9B7C6;
            --accent-blush: #F7DDE0;
            --accent-lavender: #E9E3F5;
            --accent-sage: #E4EFD9;
            --accent-butter: #FFF0C7;
            --accent-powder: #E2EEF8;
            --text-primary: #23201E;
            --text-secondary: #6E6863;
            --text-tertiary: #9E9791;
            --paper-line: rgba(201, 130, 136, 0.16);
        }

        /* Cozy Candlelight Night Mode */
        html.candlelight-mode {
            --bg-primary: #14100E;
            --bg-secondary: #1C1614;
            --card-surface: rgba(34, 28, 25, 0.94);
            --surface-subtle: #241D1A;
            --pill-surface: rgba(38, 31, 28, 0.98);
            --border-subtle: #382E29;
            --card-ring: rgba(68, 56, 50, 0.75);
            --accent-primary: #DC969C;
            --accent-soft: #3B2227;
            --accent-secondary: #263121;
            --accent-sky: #212A36;
            --accent-blush: #462E32;
            --accent-lavender: #383147;
            --accent-sage: #313E2C;
            --accent-butter: #473C26;
            --accent-powder: #2A3846;
            --text-primary: #F5EFEA;
            --text-secondary: #C4B9B0;
            --text-tertiary: #94887E;
            --paper-line: rgba(220, 150, 156, 0.16);
        }

        html.candlelight-mode .dearly-dreamy-bg {
            background: 
                radial-gradient(circle at 12% 15%, #3B2227 0%, transparent 50%),
                radial-gradient(circle at 88% 20%, #1F2937 0%, transparent 48%),
                radial-gradient(circle at 75% 85%, #243020 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, #241C18 0%, transparent 55%),
                #120E0D !important;
            opacity: 1;
        }

        html.candlelight-mode .dreamy-orb { opacity: 0.22; }

        .dearly-rich-editor { min-height: 165px; outline: none; overflow-y: auto; }
        .dearly-rich-editor:empty:before {
            content: attr(data-placeholder);
            color: var(--text-tertiary);
            pointer-events: none;
            display: block;
        }
        .dearly-rich-content h2, .dearly-rich-editor h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.35;
            margin-top: 0.45rem;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }
        .dearly-rich-content h3, .dearly-rich-editor h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 0.35rem;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
        }
        .dearly-rich-content ul, .dearly-rich-editor ul {
            list-style-type: disc;
            padding-left: 1.35rem;
            margin: 0.35rem 0;
        }
        .dearly-rich-content mark, .dearly-rich-editor mark {
            --hl-color: #F7DDE0;
            background: linear-gradient(104deg, transparent 0.9%, var(--hl-color) 2.4%, var(--hl-color) 96%, transparent 98.5%) no-repeat 0 88% / 100% 38% !important;
            background-color: transparent !important;
            padding: 0 3px;
            margin: 0 -1px;
            border-radius: 3px 6px 4px 2px;
            color: inherit !important;
            box-decoration-break: clone;
            -webkit-box-decoration-break: clone;
        }

        .dearly-font-sans { font-family: 'Plus Jakarta Sans', sans-serif !important; }
        .dearly-font-serif { font-family: 'Fraunces', Georgia, serif !important; }
        .dearly-font-hand { font-family: 'Caveat', cursive !important; font-size: 1.28em; line-height: 1.45; }
        .dearly-font-patrick { font-family: 'Patrick Hand', cursive !important; font-size: 1.18em; line-height: 1.48; }
        .dearly-font-indie { font-family: 'Indie Flower', cursive !important; font-size: 1.15em; line-height: 1.48; }
        .dearly-font-script { font-family: 'Dancing Script', cursive !important; font-size: 1.28em; line-height: 1.45; }
        .dearly-font-mono { font-family: 'JetBrains Mono', monospace !important; font-size: 0.92em; }
        .dearly-font-dynamic { font-size: 1.14em; line-height: 1.52; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.6s ease, color 0.4s ease;
        }

        .dearly-dreamy-bg {
            position: fixed;
            inset: 0;
            z-index: -4;
            background: 
                radial-gradient(circle at 12% 15%, var(--accent-soft) 0%, transparent 48%),
                radial-gradient(circle at 88% 20%, var(--accent-sky) 0%, transparent 45%),
                radial-gradient(circle at 75% 85%, var(--accent-secondary) 0%, transparent 48%),
                radial-gradient(circle at 20% 80%, var(--bg-secondary) 0%, transparent 52%),
                var(--bg-primary);
            opacity: 0.94;
            transition: all 0.6s ease;
        }

        .paper-grain-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.032;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .dreamy-orb {
            position: fixed;
            border-radius: 9999px;
            filter: blur(75px);
            z-index: -3;
            pointer-events: none;
            opacity: 0.45;
            animation: orbDrift 18s ease-in-out infinite alternate;
        }

        @keyframes orbDrift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(28px, -22px) scale(1.08); }
            100% { transform: translate(-20px, 18px) scale(0.95); }
        }

        .dearly-card {
            background-color: var(--card-surface);
            backdrop-filter: blur(20px) saturate(145%);
            -webkit-backdrop-filter: blur(20px) saturate(145%);
            border: 1.5px solid var(--card-ring);
            box-shadow: 
                0 16px 38px -8px rgba(25, 20, 18, 0.16),
                0 6px 16px -3px rgba(201, 130, 136, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            border-radius: 1.5rem;
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease, background-color 0.3s ease;
        }

        .dearly-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 24px 48px -8px rgba(25, 20, 18, 0.22),
                0 10px 22px -4px rgba(201, 130, 136, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        .dearly-pill {
            background-color: var(--pill-surface);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            border: 1.5px solid var(--card-ring);
            box-shadow: 
                0 28px 58px -8px rgba(25, 20, 18, 0.32),
                0 14px 28px -6px rgba(201, 130, 136, 0.26),
                0 4px 10px rgba(25, 20, 18, 0.12),
                inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
        }

        .dearly-pill:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 34px 66px -8px rgba(25, 20, 18, 0.36),
                0 18px 34px -6px rgba(201, 130, 136, 0.30),
                0 6px 14px rgba(25, 20, 18, 0.14),
                inset 0 1.5px 0 rgba(255, 255, 255, 0.45);
        }

        .paper-style-dotted {
            background-image: radial-gradient(var(--paper-line) 1.25px, transparent 1.25px);
            background-size: 18px 18px;
        }
        .paper-style-lined {
            background-image: linear-gradient(to bottom, transparent 27px, var(--paper-line) 28px);
            background-size: 100% 28px;
        }

        .polaroid-card {
            background: var(--card-surface);
            padding: 0.85rem 0.85rem 1.25rem 0.85rem;
            border-radius: 1.15rem;
            border: 1.5px solid var(--card-ring);
            box-shadow: 0 16px 34px -8px rgba(25, 20, 18, 0.18), 0 4px 10px rgba(0,0,0,0.06);
            position: relative;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
        }
        .polaroid-card:hover {
            transform: translateY(-5px) rotate(0deg) !important;
            box-shadow: 0 24px 44px -8px rgba(25, 20, 18, 0.24);
        }
        .washi-tape {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%) rotate(-2.5deg);
            width: 74px;
            height: 20px;
            background: linear-gradient(90deg, rgba(247, 200, 211, 0.78), rgba(233, 227, 245, 0.82));
            border-left: 1px dashed rgba(255,255,255,0.6);
            border-right: 1px dashed rgba(255,255,255,0.6);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            z-index: 5;
            pointer-events: none;
        }

        @keyframes enter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter { animation: enter 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .stagger-item { opacity: 0; animation: enter 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        @keyframes pageTurnOpen {
            0% { opacity: 0; transform: perspective(1100px) rotateY(-38deg) translateX(-22px) scale(0.92); transform-origin: left center; }
            60% { opacity: 1; transform: perspective(1100px) rotateY(4deg) translateX(2px) scale(1.01); transform-origin: left center; }
            100% { opacity: 1; transform: perspective(1100px) rotateY(0deg) translateX(0) scale(1); transform-origin: left center; }
        }
        .animate-page-turn { animation: pageTurnOpen 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

        @keyframes gentleIdle {
            0%, 100% { transform: translateY(0px) rotate(-2deg) scale(1); }
            50% { transform: translateY(-9px) rotate(3deg) scale(1.03); }
        }
        .animate-companion {
            animation: gentleIdle 3.2s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .animate-companion:hover { transform: scale(1.08) rotate(3deg); }

        @keyframes companionHop {
            0% { transform: translateY(0) scale(1, 1) rotate(0deg); }
            22% { transform: translateY(6px) scale(1.18, 0.82) rotate(-4deg); }
            52% { transform: translateY(-22px) scale(0.88, 1.15) rotate(6deg); }
            76% { transform: translateY(-4px) scale(1.06, 0.94) rotate(-2deg); }
            100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
        }
        .companion-hop { animation: companionHop 0.68s cubic-bezier(0.34, 1.56, 0.64, 1) !important; }

        @keyframes bubblePopUp {
            0% { opacity: 0; transform: translate(-50%, 8px) scale(0.7); }
            18% { opacity: 1; transform: translate(-50%, -6px) scale(1.05); }
            82% { opacity: 1; transform: translate(-50%, -10px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -18px) scale(0.9); }
        }
        .companion-speech-bubble {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            background: var(--pill-surface);
            color: var(--text-primary);
            border: 1.5px solid var(--accent-primary);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 12px 26px rgba(201, 130, 136, 0.28);
            animation: bubblePopUp 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes eqDance1 { 0%, 100% { height: 4px; } 50% { height: 15px; } }
        @keyframes eqDance2 { 0%, 100% { height: 14px; } 50% { height: 4px; } }
        @keyframes eqDance3 { 0%, 100% { height: 6px; } 50% { height: 16px; } }
        .eq-bar-1 { animation: eqDance1 0.75s ease-in-out infinite; }
        .eq-bar-2 { animation: eqDance2 0.6s ease-in-out infinite; }
        .eq-bar-3 { animation: eqDance3 0.85s ease-in-out infinite; }

        @keyframes ambientRipple {
            0% { box-shadow: 0 0 0 0 rgba(201, 130, 136, 0.55), 0 28px 58px -8px rgba(25, 20, 18, 0.32); }
            70% { box-shadow: 0 0 0 16px rgba(201, 130, 136, 0), 0 28px 58px -8px rgba(25, 20, 18, 0.32); }
            100% { box-shadow: 0 0 0 0 rgba(201, 130, 136, 0), 0 28px 58px -8px rgba(25, 20, 18, 0.32); }
        }
        .ambient-playing-pulse { animation: ambientRipple 2s infinite; }

        @keyframes progressShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(220%); }
        }
        .progress-shimmer-bar { position: relative; overflow: hidden; }
        .progress-shimmer-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 55%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
            animation: progressShimmer 2.1s ease-in-out infinite;
        }

        .dearly-jelly-btn { transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease; }
        .dearly-jelly-btn:hover { transform: translateY(-2px) scale(1.03); }
        .dearly-jelly-btn:active { transform: scale(0.93); }

        .envelope-stage { perspective: 900px; }
        .envelope-flap { transform-origin: top center; transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .envelope-open .envelope-flap { transform: rotateX(180deg); }
        .envelope-letter-sheet { transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease; }
        .envelope-open .envelope-letter-sheet { transform: translateY(-28px); }

        @keyframes sparklePop {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.25); }
        }
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            color: var(--accent-primary);
            font-size: 14px;
            animation: sparklePop 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes splashFadeOut {
            0% { opacity: 1; transform: scale(1); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.03); filter: blur(6px); pointer-events: none; visibility: hidden; }
        }
        @keyframes splashContentRise {
            0% { opacity: 0; transform: translateY(16px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes splashShimmer {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        #dearly-splash {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 20% 25%, var(--accent-soft) 0%, transparent 52%),
                radial-gradient(circle at 80% 75%, var(--accent-sky) 0%, transparent 52%),
                var(--bg-primary);
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.7s ease;
        }
        #dearly-splash.splash-hidden {
            animation: splashFadeOut 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .splash-card-inner { animation: splashContentRise 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .splash-progress-fill { animation: splashShimmer 1.65s cubic-bezier(0.4, 0, 0.2, 1) forwards; }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(201, 130, 136, 0.35); border-radius: 9999px; }
    </style>
</head>
<body class="antialiased selection:bg-blush selection:text-charcoal pb-28 md:pb-12">

    <div id="ambient-bg" class="dearly-dreamy-bg"></div>
    <div class="paper-grain-overlay"></div>
    <div class="dreamy-orb w-80 h-80 top-12 -left-16" style="background: var(--accent-soft);"></div>
    <div class="dreamy-orb w-96 h-96 bottom-16 -right-20" style="background: var(--accent-sky); animation-delay: -7s;"></div>

    <!-- Optional 4-Digit PIN Lock Screen Overlay -->
    <div id="dearly-pin-lock" class="fixed inset-0 z-[9995] hidden items-center justify-center p-4" style="background: radial-gradient(circle at 20% 25%, var(--accent-soft) 0%, transparent 52%), radial-gradient(circle at 80% 75%, var(--accent-sky) 0%, transparent 52%), var(--bg-primary);">
        <div class="dearly-card p-7 sm:p-8 w-full max-w-xs text-center space-y-5 animate-enter">
            <div class="w-16 h-16 mx-auto flex items-center justify-center">
                <svg viewBox="0 0 110 110" fill="none" class="w-16 h-16 animate-companion">
                    <circle cx="55" cy="54" r="32" fill="#F7DDE0"/>
                    <circle cx="46" cy="51" r="3" fill="#23201E"/>
                    <circle cx="64" cy="51" r="3" fill="#23201E"/>
                    <path d="M51 57 Q55 61 59 57" stroke="#23201E" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="space-y-1">
                <h2 class="font-serif text-2xl font-semibold text-charcoal">Ruang Terkunci ✦</h2>
                <p class="text-xs text-muted">Masukkan 4-digit PIN Dearly milikmu</p>
            </div>
            <div id="pin-dots-display" class="flex items-center justify-center gap-3 py-1">
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
            </div>
            <div class="grid grid-cols-3 gap-2.5 max-w-[220px] mx-auto pt-1">
                <button type="button" onclick="app.enterPinDigit('1')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">1</button>
                <button type="button" onclick="app.enterPinDigit('2')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">2</button>
                <button type="button" onclick="app.enterPinDigit('3')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">3</button>
                <button type="button" onclick="app.enterPinDigit('4')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">4</button>
                <button type="button" onclick="app.enterPinDigit('5')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">5</button>
                <button type="button" onclick="app.enterPinDigit('6')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">6</button>
                <button type="button" onclick="app.enterPinDigit('7')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">7</button>
                <button type="button" onclick="app.enterPinDigit('8')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">8</button>

        const DearlyIDB = {
            dbName: 'DearlyPersonalDB',
            storeName: 'workspace',
            open() {
                return new Promise((resolve, reject) => {
                    if (!window.indexedDB) return reject('No IDB');
                    const req = indexedDB.open(this.dbName, 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName);
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            async get(key) {
                try {
                    const db = await this.open();
                    return await new Promise((resolve, reject) => {
                        const tx = db.transaction(this.storeName, 'readonly');
                        const req = tx.objectStore(this.storeName).get(key);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    return null;
                }
            },
            async set(key, val) {
                try {
                    const db = await this.open();
                    return await new Promise((resolve, reject) => {
                        const tx = db.transaction(this.storeName, 'readwrite');
                        const req = tx.objectStore(this.storeName).put(val, key);
                        req.onsuccess = () => resolve(true);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    return false;
                }
            }
        };

            // =================================================================
            // CUTE SCRAPBOOK PNG IMAGE EXPORT (HTML5 CANVAS)
            // =================================================================
            downloadCutePngCard({ badge, title, date, mood, tag, photo, htmlContent, fontStyle, paperStyle }) {
                this.toast('Sedang merangkai kartu gambar lucu...');
                const W = 1080;
                const PAD = 72;
                const CARD_X = PAD;
                const CARD_Y = 76;
                const CARD_W = W - PAD * 2;
                const INNER_X = CARD_X + 64;
                const INNER_W = CARD_W - 128;

                // Resolve font family for Canvas
                let bodyFontFamily = '"Plus Jakarta Sans", sans-serif';
                let bodyFontSize = 30;
                let lineHeight = 48;
                if (fontStyle === 'serif') {
                    bodyFontFamily = '"Fraunces", Georgia, serif';
                    bodyFontSize = 32;
                    lineHeight = 52;
                } else if (fontStyle === 'hand' || fontStyle === 'patrick' || fontStyle === 'indie' || fontStyle === 'script') {
                    bodyFontFamily = '"Caveat", cursive';
                    bodyFontSize = 42;
                    lineHeight = 56;
                } else if (fontStyle === 'mono') {
                    bodyFontFamily = '"JetBrains Mono", monospace';
                    bodyFontSize = 27;
                    lineHeight = 46;
                } else if (fontStyle && fontStyle !== 'sans') {
                    bodyFontFamily = `"${fontStyle.replace(/["']/g, '')}", "Fraunces", sans-serif`;
                    bodyFontSize = 34;
                    lineHeight = 52;
                }

                // Extract clean paragraphs from HTML
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = this.sanitizeRichHtml(htmlContent)
                    .replace(/<br\s*\/?>/gi, '\n')
                    .replace(/<\/(p|div|h2|h3|li)>/gi, '\n');
                const rawText = (tempDiv.textContent || tempDiv.innerText || '').trim();
                const paragraphs = rawText.split(/\n+/).map(p => p.trim()).filter(Boolean);

                const measureCanvas = document.createElement('canvas');
                const mCtx = measureCanvas.getContext('2d');

                const wrapLines = (ctx, text, maxW, fontStr) => {
                    ctx.font = fontStr;
                    const words = text.split(/\s+/);
                    const lines = [];
                    let cur = '';
                    for (const w of words) {
                        const test = cur ? cur + ' ' + w : w;
                        if (ctx.measureText(test).width > maxW && cur) {
                            lines.push(cur);
                            cur = w;
                        } else {
                            cur = test;
                        }
                    }
                    if (cur) lines.push(cur);
                    return lines;
                };

                const titleLines = wrapLines(mCtx, title, INNER_W, '600 48px "Fraunces", Georgia, serif');
                const bodyLines = [];
                paragraphs.forEach((p, pIdx) => {
                    const wrapped = wrapLines(mCtx, p, INNER_W, `400 ${bodyFontSize}px ${bodyFontFamily}`);
                    wrapped.forEach(l => bodyLines.push(l));
                    if (pIdx < paragraphs.length - 1) bodyLines.push('');
                });

                const renderCanvasAndSave = (loadedImg = null) => {
                    let photoBlockH = 0;
                    let drawImgW = 0;
                    let drawImgH = 0;
                    if (loadedImg && loadedImg.width && loadedImg.height) {
                        const maxPhotoW = INNER_W - 36;
                        const maxPhotoH = 520;
                        const ratio = Math.min(maxPhotoW / loadedImg.width, maxPhotoH / loadedImg.height, 1);
                        drawImgW = Math.round(loadedImg.width * ratio);
                        drawImgH = Math.round(loadedImg.height * ratio);
                        photoBlockH = drawImgH + 92;
                    }

                    const headerH = 95;
                    const titleH = titleLines.length * 62 + 24;
                    const bodyH = Math.max(120, bodyLines.length * lineHeight) + 36;
                    const footerH = 96;
                    const CARD_H = headerH + titleH + photoBlockH + bodyH + footerH + 64;
                    const H = CARD_H + 152;

                    const canvas = document.createElement('canvas');
                    canvas.width = W;
                    canvas.height = H;
                    const ctx = canvas.getContext('2d');

                    // 1. Dreamy Pastel Gradient Background
                    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
                    bgGrad.addColorStop(0, '#FFF7E6');
                    bgGrad.addColorStop(0.5, '#FDECEF');
                    bgGrad.addColorStop(1, '#EEF2FA');
                    ctx.fillStyle = bgGrad;
                    ctx.fillRect(0, 0, W, H);

                    // Soft decorative pastel circles
                    ctx.save();
                    ctx.globalAlpha = 0.38;
                    ctx.fillStyle = '#F7C8D3';
                    ctx.beginPath();
                    ctx.arc(110, 140, 210, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#C9D9F0';
                    ctx.beginPath();
                    ctx.arc(W - 90, H - 140, 240, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();

                    // Helper: Rounded Rectangle
                    const roundRect = (x, y, w, h, r) => {
                        ctx.beginPath();
                        ctx.moveTo(x + r, y);
                        ctx.lineTo(x + w - r, y);
                        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
                        ctx.lineTo(x + w, y + h - r);
                        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
                        ctx.lineTo(x + r, y + h);
                        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
                        ctx.lineTo(x, y + r);
                        ctx.quadraticCurveTo(x, y, x + r, y);
                        ctx.closePath();
                    };

                    // 2. Main Scrapbook Paper Card with Soft Shadow
                    ctx.save();
                    ctx.shadowColor = 'rgba(201, 130, 136, 0.22)';
                    ctx.shadowBlur = 38;
                    ctx.shadowOffsetY = 16;
                    roundRect(CARD_X, CARD_Y, CARD_W, CARD_H, 42);
                    ctx.fillStyle = '#FFFDF9';
                    ctx.fill();
                    ctx.restore();

                    roundRect(CARD_X, CARD_Y, CARD_W, CARD_H, 42);
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = '#F4D7DC';
                    ctx.stroke();

                    // Paper texture lines/dots
                    ctx.save();
                    roundRect(CARD_X, CARD_Y, CARD_W, CARD_H, 42);
                    ctx.clip();
                    if (paperStyle === 'lined') {
                        ctx.strokeStyle = 'rgba(201, 130, 136, 0.14)';
                        ctx.lineWidth = 2;
                        for (let ly = CARD_Y + 180; ly < CARD_Y + CARD_H - 90; ly += 48) {
                            ctx.beginPath();
                            ctx.moveTo(CARD_X + 44, ly);
                            ctx.lineTo(CARD_X + CARD_W - 44, ly);
                            ctx.stroke();
                        }
                    } else if (paperStyle === 'dotted') {
                        ctx.fillStyle = 'rgba(201, 130, 136, 0.22)';
                        for (let dx = CARD_X + 54; dx < CARD_X + CARD_W - 44; dx += 32) {
                            for (let dy = CARD_Y + 160; dy < CARD_Y + CARD_H - 90; dy += 32) {
                                ctx.beginPath();
                                ctx.arc(dx, dy, 2, 0, Math.PI * 2);
                                ctx.fill();
                            }
                        }
                    }
                    ctx.restore();

                    // 3. Cute Washi Tape at Top Center
                    ctx.save();
                    ctx.translate(W / 2, CARD_Y);
                    ctx.rotate(-0.035);
                    const tapeGrad = ctx.createLinearGradient(-115, 0, 115, 0);
                    tapeGrad.addColorStop(0, 'rgba(247, 200, 211, 0.88)');
                    tapeGrad.addColorStop(1, 'rgba(233, 227, 245, 0.92)');
                    ctx.fillStyle = tapeGrad;
                    ctx.fillRect(-115, -18, 230, 36);
                    ctx.restore();

                    // 4. Header Badge, Mood, Tag & Date
                    let curY = CARD_Y + 62;
                    ctx.font = '700 18px "Plus Jakarta Sans", sans-serif';
                    const badgeLabel = `✦  ${badge.toUpperCase()}`;
                    const badgeW = ctx.measureText(badgeLabel).width + 36;
                    roundRect(INNER_X, curY, badgeW, 40, 20);
                    ctx.fillStyle = '#F7DDE0';
                    ctx.fill();
                    ctx.fillStyle = '#23201E';
                    ctx.fillText(badgeLabel, INNER_X + 18, curY + 26);

                    let pillOffsetX = INNER_X + badgeW + 14;
                    if (mood) {
                        const moodLabel = `♡ ${mood}`;
                        const moodW = ctx.measureText(moodLabel).width + 30;
                        roundRect(pillOffsetX, curY, moodW, 40, 20);
                        ctx.fillStyle = '#FFF0C7';
                        ctx.fill();
                        ctx.fillStyle = '#23201E';
                        ctx.fillText(moodLabel, pillOffsetX + 15, curY + 26);
                    }

                    ctx.font = '600 19px "Plus Jakarta Sans", sans-serif';
                    ctx.fillStyle = '#8C827D';
                    const dateW = ctx.measureText(date).width;
                    ctx.fillText(date, INNER_X + INNER_W - dateW, curY + 26);

                    // Dashed divider
                    curY += 64;
                    ctx.save();
                    ctx.setLineDash([8, 8]);
                    ctx.strokeStyle = '#EAD5D9';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(INNER_X, curY);
                    ctx.lineTo(INNER_X + INNER_W, curY);
                    ctx.stroke();
                    ctx.restore();

                    // 5. Title
                    curY += 54;
                    ctx.font = '600 48px "Fraunces", Georgia, serif';
                    ctx.fillStyle = '#23201E';
                    titleLines.forEach(line => {
                        ctx.fillText(line, INNER_X, curY);
                        curY += 62;
                    });
                    if (tag) {
                        ctx.font = '600 20px "Plus Jakarta Sans", sans-serif';
                        ctx.fillStyle = '#C98288';
                        ctx.fillText('#' + tag, INNER_X, curY - 12);
                        curY += 20;
                    }

                    // 6. Polaroid Photo Frame (if available)
                    if (loadedImg && drawImgW > 0) {
                        curY += 12;
                        const frameW = drawImgW + 36;
                        const frameH = drawImgH + 74;
                        const frameX = INNER_X + (INNER_W - frameW) / 2;

                        ctx.save();
                        ctx.shadowColor = 'rgba(35, 32, 30, 0.14)';
                        ctx.shadowBlur = 22;
                        ctx.shadowOffsetY = 8;
                        roundRect(frameX, curY, frameW, frameH, 22);
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fill();
                        ctx.restore();

                        roundRect(frameX, curY, frameW, frameH, 22);
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#EFECE7';
                        ctx.stroke();

                        ctx.save();
                        roundRect(frameX + 18, curY + 18, drawImgW, drawImgH, 12);
                        ctx.clip();
                        ctx.drawImage(loadedImg, frameX + 18, curY + 18, drawImgW, drawImgH);
                        ctx.restore();

                        // Mini Washi Tape on Polaroid
                        ctx.save();
                        ctx.translate(W / 2, curY);
                        ctx.rotate(0.03);
                        ctx.fillStyle = 'rgba(247, 200, 211, 0.85)';
                        ctx.fillRect(-65, -10, 130, 20);
                        ctx.restore();

                        ctx.font = '600 24px "Caveat", cursive';
                        ctx.fillStyle = '#C98288';
                        const caption = `✦ ${date}`;
                        const capW = ctx.measureText(caption).width;
                        ctx.fillText(caption, W / 2 - capW / 2, curY + drawImgH + 54);

                        curY += frameH + 38;
                    } else {
                        curY += 14;
                    }

                    // 7. Body Paragraphs
                    ctx.font = `400 ${bodyFontSize}px ${bodyFontFamily}`;
                    ctx.fillStyle = '#383330';
                    bodyLines.forEach(line => {
                        if (line === '') {
                            curY += Math.round(lineHeight * 0.55);
                        } else {
                            ctx.fillText(line, INNER_X, curY);
                            curY += lineHeight;
                        }
                    });

                    // 8. Cute Footer Stamp
                    const footY = CARD_Y + CARD_H - 44;
                    ctx.save();
                    ctx.setLineDash([6, 6]);
                    ctx.strokeStyle = '#EFECE7';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(INNER_X, footY - 28);
                    ctx.lineTo(INNER_X + INNER_W, footY - 28);
                    ctx.stroke();
                    ctx.restore();

                    ctx.font = '600 20px "Fraunces", Georgia, serif';
                    ctx.fillStyle = '#C98288';
                    ctx.fillText('Dearly ✦ Ruang Kecilmu', INNER_X, footY);

                    const authorStamp = `Ditulis oleh ${this.state.profile.userName || 'Sahabat'}`;
                    ctx.font = '500 18px "Plus Jakarta Sans", sans-serif';
                    ctx.fillStyle = '#9E9791';
                    const authW = ctx.measureText(authorStamp).width;
                    ctx.fillText(authorStamp, INNER_X + INNER_W - authW, footY);

                    // Download / Share / Preview PNG for Mobile & PWA Gallery
                    canvas.toBlob((blob) => {
                        if (!blob) {
                            this.toast('Gagal membuat file gambar PNG.', 'error');
                            return;
                        }
                        const safeSlug = (title || 'dearly-card').toLowerCase().replace(/[^a-z0-9]+/g, '-').slice(0, 30);
                        const fileName = `dearly-${safeSlug}.png`;
                        const blobUrl = URL.createObjectURL(blob);

                        // Trigger automatic download attempt first
                        try {
                            const link = document.createElement('a');
                            link.download = fileName;
                            link.href = blobUrl;
                            document.body.appendChild(link);
                            link.click();
                            link.remove();
                        } catch (e) {}

                        // Show cute PNG preview modal so mobile/PWA users can Share or Long-Press Save to Gallery
                        this._lastPngBlob = blob;
                        this._lastPngFileName = fileName;
                        this._lastPngUrl = blobUrl;

                        this.triggerSparkleBurst();
                        this.openModal(`
                            <div class="space-y-4 text-center">
                                <div class="flex items-center justify-between border-b border-borderwarm pb-2.5">
                                    <span class="text-[11px] font-bold uppercase tracking-[0.16em] text-dusty">Kartu Gambar PNG Siap ✦</span>
                                    <button onclick="app.closeModal()" class="p-1.5 rounded-full hover:bg-cream text-muted"><i class="ph ph-x"></i></button>
                                </div>
                                <div class="max-h-[55vh] overflow-y-auto rounded-2xl border border-borderwarm bg-cream p-2">
                                    <img src="${blobUrl}" alt="${this.escapeHtml(fileName)}" class="w-full h-auto rounded-xl shadow-sm mx-auto">
                                </div>
                                <p class="text-[11px] text-muted leading-relaxed">
                                    Jika belum otomatis masuk ke galeri HP, ketuk <strong>Simpan / Bagikan</strong> di bawah atau <strong>tahan gambar di atas → Simpan Foto</strong>.
                                </p>
                                <div class="flex flex-wrap items-center justify-center gap-2 pt-1">
                                    <button type="button" onclick="app.shareOrSaveLastPng()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs font-semibold shadow-md inline-flex items-center gap-1.5 hover:opacity-95">
                                        <i class="ph-bold ph-export"></i> Simpan / Bagikan ke Galeri
                                    </button>
                                    <a href="${blobUrl}" download="${this.escapeHtml(fileName)}" class="px-4 py-2.5 rounded-full bg-cream border border-borderwarm text-charcoal text-xs font-semibold inline-flex items-center gap-1.5 hover:opacity-85">
                                        <i class="ph-bold ph-download-simple text-dusty"></i> Unduh Ulang
                                    </a>
                                </div>
                            </div>
                        `, 'max-w-md');
                    }, 'image/png');
                };

                if (photo) {

            // =================================================================
            // PERSONAL LOCAL MP3 PLAYER & GUIDE ("HOW?")
            // =================================================================
            async initMp3Player() {
                const audioEl = document.getElementById('dearly-mp3-audio');
                if (audioEl) {
                    audioEl.addEventListener('timeupdate', () => this.updateMp3ProgressUI());
                    audioEl.addEventListener('loadedmetadata', () => this.updateMp3ProgressUI());
                    audioEl.addEventListener('ended', () => {
                        if (this.mp3Tracks.length === 0) return;
                        if (this.currentMp3Index + 1 < this.mp3Tracks.length) {
                            this.playMp3AtIndex(this.currentMp3Index + 1);
                        } else if (this.isMp3Loop) {
                            this.playMp3AtIndex(0);
                        } else {
                            this.isMp3Playing = false;
                            this.updateMp3ControlsUI();
                        }
                    });
                }
                const savedTracks = await DearlyIDB.get('dearly_mp3_tracks');
                if (Array.isArray(savedTracks) && savedTracks.length > 0) {
                    this.mp3Tracks = savedTracks;
                    this.currentMp3Index = 0;
                    const titleEl = document.getElementById('mp3-current-title');
                    if (titleEl) titleEl.textContent = this.mp3Tracks[0].name;
                }
                this.renderMp3Playlist();
            }

            async handleMp3Upload(inputEl) {
                const files = Array.from(inputEl.files || []);
                if (files.length === 0) return;
                let addedCount = 0;
                for (const file of files) {
                    if (!file.type.startsWith('audio/') && !/\.(mp3|m4a|wav|ogg|aac)$/i.test(file.name)) {
                        continue;
                    }
                    const cleanName = file.name.replace(/\.[^/.]+$/, '');
                    this.mp3Tracks.push({
                        id: 'mp3_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
                        name: cleanName,
                        blob: file
                    });
                    addedCount++;
                }
                inputEl.value = '';
                if (addedCount === 0) {
                    this.toast('Pilih file audio berformat MP3, M4A, atau WAV.', 'error');
                    return;
                }
                await DearlyIDB.set('dearly_mp3_tracks', this.mp3Tracks);
                this.renderMp3Playlist();
                this.toast(`${addedCount} lagu ditambahkan ke Playlist Pribadimu ✦`);
                if (this.currentMp3Index === -1 || !this.isMp3Playing) {
                    this.playMp3AtIndex(this.mp3Tracks.length - addedCount);
                }
            }

            playMp3AtIndex(index) {
                if (index < 0 || index >= this.mp3Tracks.length) return;
                const audioEl = document.getElementById('dearly-mp3-audio');
                if (!audioEl) return;
                const track = this.mp3Tracks[index];
                if (!track || !track.blob) return;

                if (this.currentMp3ObjectUrl) {
                    URL.revokeObjectURL(this.currentMp3ObjectUrl);
                }
                this.currentMp3ObjectUrl = URL.createObjectURL(track.blob);
                this.currentMp3Index = index;
                audioEl.src = this.currentMp3ObjectUrl;
                audioEl.play().then(() => {
                    this.isMp3Playing = true;
                    this.updateMp3ControlsUI();
                    this.renderMp3Playlist();
                }).catch(() => {
                    this.isMp3Playing = false;
                    this.updateMp3ControlsUI();
                });
            }

            toggleMp3Play() {
                const audioEl = document.getElementById('dearly-mp3-audio');
                if (!audioEl) return;
                if (this.mp3Tracks.length === 0) {
                    this.toast('Tambahkan lagu MP3 dulu lewat tombol "+ Lagu" ya!');
                    return;
                }
                if (!audioEl.src || this.currentMp3Index === -1) {
                    this.playMp3AtIndex(0);
                    return;
                }
                if (audioEl.paused) {
                    audioEl.play();
                    this.isMp3Playing = true;
                } else {
                    audioEl.pause();
                    this.isMp3Playing = false;
                }
                this.updateMp3ControlsUI();
                this.renderMp3Playlist();
            }

            prevMp3Track() {
                if (this.mp3Tracks.length === 0) return;
                const prevIdx = (this.currentMp3Index - 1 + this.mp3Tracks.length) % this.mp3Tracks.length;
                this.playMp3AtIndex(prevIdx);
            }

            nextMp3Track() {
                if (this.mp3Tracks.length === 0) return;
                const nextIdx = (this.currentMp3Index + 1) % this.mp3Tracks.length;
                this.playMp3AtIndex(nextIdx);
            }

            toggleMp3Loop() {
                this.isMp3Loop = !this.isMp3Loop;
                const btn = document.getElementById('mp3-loop-btn');
                if (btn) {
                    btn.className = this.isMp3Loop
                        ? 'p-1.5 rounded-lg bg-blush/70 text-dusty text-xs transition-colors'
                        : 'p-1.5 rounded-lg bg-cream text-softgray text-xs transition-colors';
                }
                this.toast(this.isMp3Loop ? 'Ulangi playlist aktif' : 'Ulangi playlist dimatikan');
            }

            seekMp3(val) {
                const audioEl = document.getElementById('dearly-mp3-audio');
                if (!audioEl || !audioEl.duration) return;
                audioEl.currentTime = (Number(val) / 100) * audioEl.duration;
            }

            formatSeconds(sec) {
                if (!sec || isNaN(sec)) return '00:00';
                const m = Math.floor(sec / 60);
                const s = Math.floor(sec % 60);
                return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
            }

            updateMp3ProgressUI() {
                const audioEl = document.getElementById('dearly-mp3-audio');
                const seekEl = document.getElementById('mp3-seek-bar');
                const timeEl = document.getElementById('mp3-current-time');
                if (!audioEl) return;
                const dur = audioEl.duration || 0;
                const cur = audioEl.currentTime || 0;
                if (seekEl && dur > 0) {
                    seekEl.value = Math.round((cur / dur) * 100);
                }
                if (timeEl) {
                    timeEl.textContent = `${this.formatSeconds(cur)} / ${this.formatSeconds(dur)}`;
                }
            }

            updateMp3ControlsUI() {
                const iconEl = document.getElementById('mp3-play-icon');
                const titleEl = document.getElementById('mp3-current-title');
                const btnPill = document.getElementById('ambient-sound-btn');
                const dot = document.getElementById('ambient-sound-dot');
                const eqBars = document.getElementById('ambient-eq-bars');
                const waveIcon = document.getElementById('ambient-wave-icon');
                const label = document.getElementById('ambient-sound-label');

                const currentTrack = this.mp3Tracks[this.currentMp3Index];
                if (titleEl) {
                    titleEl.textContent = currentTrack ? currentTrack.name : 'Belum ada lagu diputar';
                }
                if (iconEl) {
                    iconEl.className = this.isMp3Playing ? 'ph-fill ph-pause text-sm' : 'ph-fill ph-play text-sm';
                }

                const anyAudioActive = this.isMp3Playing || this.currentTrack !== 'off';
                const ambientLabels = {
                    off: 'Suasana',
                    rain: 'Hujan Lembut',
                    piano: 'Felt Piano',
                    cafe: 'Kafe Pagi',
                    nature: 'Alam Pagi'
                };
                if (label) {
                    if (this.isMp3Playing && currentTrack) {
                        label.textContent = currentTrack.name.slice(0, 14) + (currentTrack.name.length > 14 ? '…' : '');
                    } else {
                        label.textContent = ambientLabels[this.currentTrack] || 'Suasana';
                    }
                }
                if (dot) dot.className = anyAudioActive ? 'w-2 h-2 rounded-full bg-dusty animate-ping' : 'w-2 h-2 rounded-full bg-softgray/40';
                if (eqBars) {
                    if (anyAudioActive) { eqBars.classList.remove('hidden'); eqBars.classList.add('flex'); }
                    else { eqBars.classList.add('hidden'); eqBars.classList.remove('flex'); }
                }
                if (waveIcon) {
                    if (anyAudioActive) waveIcon.classList.add('hidden');
                    else waveIcon.classList.remove('hidden');
                }
                if (btnPill) {
                    if (anyAudioActive) btnPill.classList.add('ambient-playing-pulse');
                    else btnPill.classList.remove('ambient-playing-pulse');
                }
            }

            async deleteMp3Track(index) {
                if (index < 0 || index >= this.mp3Tracks.length) return;
                const audioEl = document.getElementById('dearly-mp3-audio');
                const wasCurrent = index === this.currentMp3Index;
                this.mp3Tracks.splice(index, 1);
                await DearlyIDB.set('dearly_mp3_tracks', this.mp3Tracks);

                if (this.mp3Tracks.length === 0) {
                    if (audioEl) { audioEl.pause(); audioEl.removeAttribute('src'); }
                    this.currentMp3Index = -1;
                    this.isMp3Playing = false;
                } else if (wasCurrent) {
                    const nextIdx = Math.min(index, this.mp3Tracks.length - 1);
                    this.playMp3AtIndex(nextIdx);
                } else if (index < this.currentMp3Index) {
                    this.currentMp3Index--;
                }
                this.updateMp3ControlsUI();
                this.renderMp3Playlist();
                this.toast('Lagu dihapus dari playlist.');
            }

            renderMp3Playlist() {
                const listEl = document.getElementById('mp3-playlist-list');
                if (!listEl) return;
                if (this.mp3Tracks.length === 0) {
                    listEl.innerHTML = `
                    <div class="text-center py-2.5 px-2 rounded-xl bg-ivory/70 border border-dashed border-borderwarm text-[11px] text-muted">
                        Belum ada lagu. Ketuk <strong>+ Lagu</strong> atau <strong>How?</strong> untuk panduan MP3.
                    </div>`;
                    return;
                }
                listEl.innerHTML = this.mp3Tracks.map((t, idx) => {

            checkPinLockOnStart() {
                if (this.state.security && this.state.security.pinEnabled && this.state.security.pinCode && this.state.security.pinCode.length === 4) {

            enterPinDigit(digit) {
                if (this.pinBuffer.length >= 4) return;
                this.pinBuffer += digit;
                this.updatePinDots();
                if (this.pinBuffer.length === 4) {
                    const expected = this.state.security && this.state.security.pinCode;
                    if (this.pinBuffer === expected) {
                        const lockEl = document.getElementById('dearly-pin-lock');
                        if (lockEl) {
                            lockEl.classList.add('hidden');
                            lockEl.classList.remove('flex');
                        }
                        this.pinBuffer = '';
                        this.updatePinDots();
                        this.toast('Selamat datang kembali di Dearly ✦');
                    } else {
                        this.toast('PIN kurang tepat, coba lagi ya.', 'error');
                        setTimeout(() => {
                            this.pinBuffer = '';
                            this.updatePinDots();
                        }, 300);
                    }
                }
            }

            backspacePinDigit() {
                this.pinBuffer = this.pinBuffer.slice(0, -1);
                this.updatePinDots();
            }

            clearPinInput() {
                this.pinBuffer = '';

            updatePinDots() {

            updateCloudBadge(status) {
                const dot = document.getElementById('cloud-status-dot');
                const txt = document.getElementById('cloud-status-text');

            mergeWithDefault(parsed) {
                const def = createDefaultState();
                const mergedData = { ...def.data, ...(parsed.data || {}) };
                if (!Array.isArray(mergedData.miniLetters)) mergedData.miniLetters = [];
                return {
                    ...def,
                    ...parsed,
                    profile: { ...def.profile, ...(parsed.profile || {}) },
                    theme: parsed.theme || def.theme,
                    homeConfig: { ...def.homeConfig, ...(parsed.homeConfig || {}) },
                    savedGoogleFonts: Array.isArray(parsed.savedGoogleFonts) ? parsed.savedGoogleFonts : [],
                    data: mergedData
                };
            }

            loadStateSync() {
                try {
                    const raw = localStorage.getItem('dearly_workspace_state_v2');
                    if (raw) return this.mergeWithDefault(JSON.parse(raw));
                } catch (e) {}
                return createDefaultState();
            }

            async initStorageAndCloud() {
                if (navigator.storage && navigator.storage.persist) {
                    try { await navigator.storage.persist(); } catch (e) {}
                }

                const idbState = await DearlyIDB.get('dearly_state');
                if (idbState && idbState.data) {
                    const localTime = new Date(this.state.updatedAt || 0).getTime();
                    const idbTime = new Date(idbState.updatedAt || 0).getTime();
                    if (idbTime > localTime) {
                        this.state = this.mergeWithDefault(idbState);
                        this.applyThemeVariables();
                        this.render();
                    }
                }

                if (this.cloudConfig && this.cloudConfig.enabled && this.cloudConfig.url && this.cloudConfig.anonKey && this.cloudConfig.syncId) {
                    await this.pullFromCloud(true);
                } else {
                    this.updateCloudBadge('idle');
                }
            }

            saveState() {
                this.state.updatedAt = new Date().toISOString();
                DearlyIDB.set('dearly_state', this.state);
                try {
                    localStorage.setItem('dearly_workspace_state_v2', JSON.stringify(this.state));
                } catch (e) {}
                if (this.cloudConfig && this.cloudConfig.enabled && this.cloudConfig.url && this.cloudConfig.anonKey && this.cloudConfig.syncId) {
                    clearTimeout(this.syncTimeout);
                    this.updateCloudBadge('syncing');
                    this.syncTimeout = setTimeout(() => this.pushToCloud(true), 1200);
                }
            }

            async pushToCloud(silent = false) {
                const { url, anonKey, syncId } = this.cloudConfig;
                if (!url || !anonKey || !syncId) return;
                this.updateCloudBadge('syncing');
                try {
                    const cleanUrl = url.replace(/\/+$/, '');
                    const res = await fetch(`${cleanUrl}/rest/v1/dearly_spaces?on_conflict=sync_id`, {
                        method: 'POST',
                        headers: {
                            'apikey': anonKey,
                            'Authorization': `Bearer ${anonKey}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'resolution=merge-duplicates,return=minimal'
                        },
                        body: JSON.stringify({
                            sync_id: syncId,
                            payload: this.state,
                            updated_at: new Date().toISOString()
                        })
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.updateCloudBadge('synced');
                    if (!silent) this.toast('Data berhasil tersinkron ke Cloud!');
                } catch (err) {
                    this.updateCloudBadge('error');
                    if (!silent) this.toast('Gagal menyinkron ke Supabase. Periksa URL/Key/Tabel.', 'error');
                }
            }

            async pullFromCloud(silent = false) {
                const { url, anonKey, syncId } = this.cloudConfig;
                if (!url || !anonKey || !syncId) return;
                this.updateCloudBadge('syncing');
                try {
                    const cleanUrl = url.replace(/\/+$/, '');
                    const res = await fetch(`${cleanUrl}/rest/v1/dearly_spaces?sync_id=eq.${encodeURIComponent(syncId)}&select=payload,updated_at`, {
                        method: 'GET',
                        headers: {
                            'apikey': anonKey,
                            'Authorization': `Bearer ${anonKey}`
                        }
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const rows = await res.json();
                    if (rows && rows.length > 0 && rows[0].payload) {
                        const cloudPayload = rows[0].payload;
                        const cloudTime = new Date(cloudPayload.updatedAt || rows[0].updated_at || 0).getTime();
                        const localTime = new Date(this.state.updatedAt || 0).getTime();
                        if (!silent || cloudTime > localTime) {
                            this.state = this.mergeWithDefault(cloudPayload);
                            DearlyIDB.set('dearly_state', this.state);
                            try { localStorage.setItem('dearly_workspace_state_v2', JSON.stringify(this.state)); } catch (e) {}
                            this.applyThemeVariables();
                            this.render();
                        }
                        this.updateCloudBadge('synced');
                        if (!silent) this.toast('Data berhasil dimuat dari Cloud!');
                    } else {
                        await this.pushToCloud(silent);
                    }
                } catch (err) {
                    this.updateCloudBadge('error');
                    if (!silent) this.toast('Gagal mengambil data dari Cloud.', 'error');
                }
            }

            formatCurrency(num) {
                return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', maximumFractionDigits: 0 }).format(num || 0);
            }

            escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            stripHtml(html) {
                if (!html) return '';
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            sanitizeRichHtml(html) {
                if (!html) return '';
                const allowedTags = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'H2', 'H3', 'MARK', 'SPAN', 'P', 'BR', 'DIV', 'UL', 'OL', 'LI']);
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const cleanNode = (node) => {
                    Array.from(node.childNodes).forEach(child => {
                        if (child.nodeType === 1) {
                            if (!allowedTags.has(child.tagName)) {
                                const text = document.createTextNode(child.textContent || '');
                                node.replaceChild(text, child);
                            } else {
                                const hlVar = child.style && child.style.getPropertyValue('--hl-color') ? child.style.getPropertyValue('--hl-color').trim() : '';
                                const bg = child.style && child.style.backgroundColor ? child.style.backgroundColor : '';
                                const fg = child.style && child.style.color ? child.style.color : '';
                                Array.from(child.attributes).forEach(attr => child.removeAttribute(attr.name));
                                if ((hlVar || bg) && (child.tagName === 'MARK' || child.tagName === 'SPAN')) {
                                    const chosenHl = hlVar || bg;
                                    child.style.setProperty('--hl-color', chosenHl);
                                } else if (fg && child.tagName === 'SPAN') {
                                    child.style.color = fg;
                                }
                                cleanNode(child);
                            }
                        }
                    });
                };
                cleanNode(doc.body);
                return doc.body.innerHTML;
            }

            getFontClass(fontKey) {
                if (fontKey === 'serif') return 'dearly-font-serif';
                if (fontKey === 'hand') return 'dearly-font-hand';
                if (fontKey === 'patrick') return 'dearly-font-patrick';
                if (fontKey === 'indie') return 'dearly-font-indie';
                if (fontKey === 'script') return 'dearly-font-script';
                if (fontKey === 'mono') return 'dearly-font-mono';
                if (fontKey && fontKey !== 'sans') return 'dearly-font-dynamic';
                return 'dearly-font-sans';
            }

            ensureGoogleFontLoaded(fontName) {
                if (!fontName || ['sans', 'serif', 'hand', 'patrick', 'indie', 'script', 'mono'].includes(fontName)) return;
                const cleanName = String(fontName).trim();
                if (!cleanName) return;
                const slug = 'gf-' + cleanName.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                if (!document.getElementById(slug)) {
                    const link = document.createElement('link');
                    link.id = slug;
                    link.rel = 'stylesheet';
                    link.href = `https://fonts.googleapis.com/css2?family=${encodeURIComponent(cleanName).replace(/%20/g, '+')}:ital,wght@0,400;0,600;0,700;1,400&display=swap`;
                    document.head.appendChild(link);
                }
            }

            getDynamicFontStyleAttr(fontKey) {
                if (!fontKey || ['sans', 'serif', 'hand', 'patrick', 'indie', 'script', 'mono'].includes(fontKey)) return '';
                this.ensureGoogleFontLoaded(fontKey);
                const safeFont = String(fontKey).replace(/['"<>]/g, '');
                return `font-family: '${safeFont}', cursive, sans-serif !important;`;
            }

            setEditorFont(editorId, fontKey) {
                const chosen = (fontKey || 'sans').trim();
                this.activeEditorFonts[editorId] = chosen;
                const el = document.getElementById(editorId);
                if (el) {
                    el.classList.remove('dearly-font-sans', 'dearly-font-serif', 'dearly-font-hand', 'dearly-font-patrick', 'dearly-font-indie', 'dearly-font-script', 'dearly-font-mono', 'dearly-font-dynamic');
                    el.classList.add(this.getFontClass(chosen));
                    if (['sans', 'serif', 'hand', 'patrick', 'indie', 'script', 'mono'].includes(chosen)) {
                        el.style.fontFamily = '';
                    } else {
                        this.ensureGoogleFontLoaded(chosen);
                        el.style.fontFamily = `'${chosen.replace(/['"<>]/g, '')}', cursive, sans-serif`;
                    }
                }
                const selectEl = document.getElementById(`${editorId}-font-select`);
                if (selectEl && Array.from(selectEl.options).some(o => o.value === chosen)) {
                    selectEl.value = chosen;
                }
                const customInputEl = document.getElementById(`${editorId}-custom-font`);
                if (customInputEl && !['sans', 'serif', 'hand', 'patrick', 'indie', 'script', 'mono'].includes(chosen)) {
                    customInputEl.value = chosen;
                }
            }

            applyCustomGoogleFont(editorId) {
                const inp = document.getElementById(`${editorId}-custom-font`);
                if (!inp) return;
                const raw = inp.value.trim();
                if (!raw) {
                    this.toast('Ketik nama font dari Google Fonts terlebih dahulu.', 'error');
                    return;
                }
                const formatted = raw.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                inp.value = formatted;
                this.setEditorFont(editorId, formatted);
                this.toast(`Font Google "${formatted}" diterapkan ✦`);
            }

            saveFavoriteGoogleFont(editorId) {
                const inp = document.getElementById(`${editorId}-custom-font`);
                const raw = (inp && inp.value.trim()) ? inp.value.trim() : (this.activeEditorFonts[editorId] || '');
                if (!raw || ['sans', 'serif', 'hand', 'patrick', 'indie', 'script', 'mono'].includes(raw)) {
                    this.toast('Ketik atau pilih nama font Google terlebih dahulu untuk disimpan.', 'error');
                    return;
                }
                const formatted = raw.split(/\s+/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                if (!Array.isArray(this.state.savedGoogleFonts)) {
                    this.state.savedGoogleFonts = [];
                }
                if (!this.state.savedGoogleFonts.some(f => f.toLowerCase() === formatted.toLowerCase())) {
                    this.state.savedGoogleFonts.push(formatted);
                    this.saveState();
                }
                if (inp) inp.value = formatted;
                this.setEditorFont(editorId, formatted);
                const selectEl = document.getElementById(`${editorId}-font-select`);
                if (selectEl) {
                    let favGroup = selectEl.querySelector('optgroup[label="★ Font Favorit Tersimpan"]');
                    if (!favGroup) {
                        favGroup = document.createElement('optgroup');
                        favGroup.label = '★ Font Favorit Tersimpan';
                        selectEl.insertBefore(favGroup, selectEl.firstChild);
                    }
                    if (!Array.from(favGroup.options).some(o => o.value.toLowerCase() === formatted.toLowerCase())) {
                        const opt = document.createElement('option');
                        opt.value = formatted;
                        opt.textContent = `★ ${formatted}`;
                        favGroup.appendChild(opt);
                    }
                    selectEl.value = formatted;
                }
                this.toast(`Font "${formatted}" disimpan ke daftar favoritmu ✦`);
            }

                const order = ['blank', 'dotted', 'lined'];
                const labels = { blank: 'Kertas: Polos', dotted: 'Kertas: Titik', lined: 'Kertas: Bergaris' };
                const next = order[(order.indexOf(current) + 1) % order.length];
                this.activeEditorPapers[editorId] = next;
                if (editorId === 'j-content') this.focusPaperStyle = next;
                el.classList.remove('paper-style-dotted', 'paper-style-lined');
                if (next === 'dotted') el.classList.add('paper-style-dotted');
                if (next === 'lined') el.classList.add('paper-style-lined');
                btn.textContent = labels[next];
            }

            execRichFormat(editorId, cmd, value = null) {
                const el = document.getElementById(editorId);
                if (!el) return;
                el.focus();
                document.execCommand(cmd, false, value);
            }

            applyTextColor(editorId, hexColor) {
                const el = document.getElementById(editorId);
                if (!el) return;
                el.focus();
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
                    this.toast('Blok/pilih dulu teks yang ingin diubah warnanya.');
                    return;
                }
                if (hexColor === 'default') {
                    document.execCommand('removeFormat', false, null);
                    return;
                }
                const range = sel.getRangeAt(0);
                const span = document.createElement('span');
                span.style.color = hexColor;
                try {
                    const extracted = range.extractContents();
                    span.appendChild(extracted);
                    range.insertNode(span);
                    sel.removeAllRanges();
                } catch (e) {
                    document.execCommand('foreColor', false, hexColor);
                }
            }

            applyPastelHighlight(editorId, hexColor) {
                const el = document.getElementById(editorId);
                if (!el) return;
                el.focus();
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
                    this.toast('Blok/pilih dulu teks yang ingin diberi garis stabilo.');
                    return;
                }
                if (hexColor === 'transparent') {
                    document.execCommand('removeFormat', false, null);
                    return;
                }
                const range = sel.getRangeAt(0);
                const mark = document.createElement('mark');
                mark.style.setProperty('--hl-color', hexColor);
                try {
                    const extracted = range.extractContents();
                    mark.appendChild(extracted);
                    range.insertNode(mark);
                    sel.removeAllRanges();
                } catch (e) {
                    document.execCommand('hiliteColor', false, hexColor);
                }
            }

            triggerSparkleBurst(event) {
                const x = event && event.clientX ? event.clientX : window.innerWidth / 2;
                const y = event && event.clientY ? event.clientY : window.innerHeight / 2;
                const symbols = ['✦', '✧', '♡', '✿', '★'];
                const colors = ['#C98288', '#8A78B8', '#6E8F5B', '#D4A037', '#5A82A6'];
                for (let i = 0; i < 14; i++) {
                    const el = document.createElement('span');
                    el.className = 'sparkle-particle';
                    el.textContent = symbols[i % symbols.length];
                    el.style.color = colors[i % colors.length];
                    const angle = (Math.PI * 2 * i) / 14 + (Math.random() * 0.3);
                    const dist = 48 + Math.random() * 52;
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    el.style.setProperty('--ty', Math.sin(angle) * dist - 14 + 'px');
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 980);
                }
            }

            }

            handlePhotoFileSelect(inputEl, previewImgId, hiddenInputId) {
                const file = inputEl.files && inputEl.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    this.toast('Pilih berkas gambar yang valid.', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_DIM = 900;
                        let w = img.width;
                        let h = img.height;
                        if (w > MAX_DIM || h > MAX_DIM) {
                            if (w > h) {
                                h = Math.round((h * MAX_DIM) / w);
                                w = MAX_DIM;
                            } else {
                                w = Math.round((w * MAX_DIM) / h);
                                h = MAX_DIM;
                            }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        const hiddenEl = document.getElementById(hiddenInputId);
                        const prevEl = document.getElementById(previewImgId);
                        if (hiddenEl) hiddenEl.value = compressedDataUrl;
                        if (prevEl) {
                            prevEl.src = compressedDataUrl;
                            prevEl.classList.remove('hidden');
                        }
                        this.toast('Foto berhasil dimuat dari galeri.');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            toggleAmbientMenu() {
                const menu = document.getElementById('ambient-menu');
                if (menu) menu.classList.toggle('hidden');

            openGlobalSearch() {
                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex items-center gap-2.5 bg-cream border border-borderwarm rounded-2xl px-4 py-2.5">
                            <i class="ph ph-magnifying-glass text-dusty"></i>
                            <input type="text" id="global-search-input" oninput="app.runGlobalSearch(this.value)" placeholder="Cari apa saja di seluruh ruang Dearly..." class="w-full bg-transparent text-sm focus:outline-none" autofocus>
                        </div>
                        <div id="global-search-results" class="space-y-2 max-h-80 overflow-y-auto">
                            <div class="text-center py-6 text-xs text-softgray">Ketik kata kunci untuk mencari di Jurnal, Kenangan, Catatan, dan Resep.</div>
                        </div>
                    </div>
                `, 'max-w-xl');
            }

            runGlobalSearch(query) {
                const container = document.getElementById('global-search-results');
                if (!container) return;
                const q = query.trim().toLowerCase();
                if (!q) {
                    container.innerHTML = `<div class="text-center py-6 text-xs text-softgray">Ketik kata kunci untuk mencari...</div>`;
                    return;
                }

                const results = [];
                this.state.data.journal.forEach(j => {
                    if (j.title.toLowerCase().includes(q) || this.stripHtml(j.content).toLowerCase().includes(q)) {
                        results.push({ type: 'Jurnal', title: j.title, route: 'journal' });
                    }
                });
                this.state.data.notes.forEach(n => {
                    if (n.title.toLowerCase().includes(q) || this.stripHtml(n.content).toLowerCase().includes(q)) {
                        results.push({ type: 'Catatan', title: n.title, route: 'notes' });
                    }
                });
                this.state.data.memories.forEach(m => {
                    if (m.title.toLowerCase().includes(q) || m.story.toLowerCase().includes(q)) {
                        results.push({ type: 'Kenangan', title: m.title, route: 'memories' });
                    }
                });
                this.state.data.recipes.forEach(r => {
                    if (r.name.toLowerCase().includes(q) || r.ingredients.toLowerCase().includes(q)) {
                        results.push({ type: 'Resep', title: r.name, route: 'recipes' });
                    }
                });

                if (results.length === 0) {
                    container.innerHTML = `<div class="text-center py-6 text-xs text-softgray">Tidak ditemukan hasil untuk "${this.escapeHtml(query)}".</div>`;
                    return;
                }

                container.innerHTML = results.map(r => `
                    <button onclick="app.closeModal(); app.navigate('${r.route}')" class="w-full p-3 rounded-2xl bg-cream hover:opacity-85 border border-borderwarm flex items-center justify-between text-left transition-colors">
                        <div>
                            <span class="text-[10px] font-bold uppercase tracking-wider text-dusty">${r.type}</span>
                            <div class="text-sm font-semibold text-charcoal">${this.escapeHtml(r.title)}</div>
                        </div>
                        <i class="ph ph-arrow-right text-softgray"></i>
                    </button>
                `).join('');
            }

            openQuickCapture() {
                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-serif text-2xl font-medium text-charcoal">Quick Capture</h3>
                            <button onclick="app.closeModal()" class="p-1.5 rounded-full hover:bg-cream text-muted"><i class="ph ph-x"></i></button>

                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1.5">Simpan sebagai</label>
                            <select id="qc-type" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                                <option value="note">Catatan & Ide (Thought / Idea)</option>
                                <option value="gratitude">Jurnal Rasa Syukur (Gratitude / Mood)</option>
                                <option value="memory">Kenangan Singkat (Memory)</option>
                                <option value="task">Rencana Kegiatan (Task)</option>
                            </select>
                        </div>
                        <div class="space-y-3">
                            <input id="qc-title" type="text" placeholder="Judul singkat..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            <textarea id="qc-content" rows="4" placeholder="Tuliskan pikiran, rasa syukur, atau ide kilatmu..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm"></textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveQuickCapture()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveQuickCapture() {
                const kind = document.getElementById('qc-type').value;
                const title = document.getElementById('qc-title').value.trim();
                const content = document.getElementById('qc-content').value.trim();
                if (!title) {
                    this.toast('Judul wajib diisi.', 'error');
                    return;
                }

                if (kind === 'gratitude') {
                    this.state.data.journal.unshift({
                        id: 'j_' + Date.now(),
                        title,
                        content: content || title,
                        mood: 'Bersyukur',
                        tag: 'syukur',
                        photo: '',
                        paperStyle: 'blank',
                        date: new Date().toISOString()
                    });
                    this.logActivity('journal', 'Quick Capture jurnal syukur', title);
                } else if (kind === 'memory') {
                    this.state.data.memories.unshift({
                        id: 'm_' + Date.now(),
                        title,
                        date: new Date().toISOString().slice(0, 10),
                        category: 'Momen Kecil',
                        photo: '',
                        story: content || title
                    });
                    this.logActivity('memories', 'Quick Capture kenangan', title);
                } else if (kind === 'task') {
                    this.state.data.activities.unshift({
                        id: 'act_' + Date.now(),
                        name: title,
                        category: 'Rencana',
                        plannedDate: '',
                        description: content,
                        done: false
                    });
                    this.logActivity('activities', 'Quick Capture kegiatan', title);
                } else {
                    this.state.data.notes.unshift({
                        id: 'n_' + Date.now(),
                        title,
                        tag: 'ide',
                        content: content || title,
                        date: new Date().toISOString()
                    });
                    this.logActivity('notes', 'Quick Capture catatan', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Tersimpan rapi di Dearly.');
            }

            openProfileModal() {
                const cfg = this.cloudConfig || { enabled: false, url: '', anonKey: '', syncId: '' };
                const sec = this.state.security || { pinEnabled: false, pinCode: '' };
                const sqlSnippet = `create table if not exists dearly_spaces (\n  sync_id text primary key,\n  payload jsonb not null,\n  updated_at timestamptz default now()\n);\nalter table dearly_spaces disable row level security;`;

                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-serif text-2xl font-medium text-charcoal">Profil, PIN & Cloud Sync</h3>
                            <button onclick="app.closeModal()" class="p-1.5 rounded-full hover:bg-cream text-muted"><i class="ph ph-x"></i></button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Nama Panggilanmu</label>
                                <input id="prof-name" type="text" value="${this.escapeHtml(this.state.profile.userName)}" class="w-full px-4 py-2 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Kalimat Sambutan Home</label>
                                <input id="prof-sub" type="text" value="${this.escapeHtml(this.state.profile.subtitle)}" class="w-full px-4 py-2 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                        </div>

                        <div class="p-3.5 rounded-2xl bg-cream border border-borderwarm text-xs text-muted space-y-2.5">
                            <div class="flex items-center justify-between">
                                <div class="font-semibold text-charcoal flex items-center gap-1.5">
                                    <i class="ph-fill ph-lock-key text-dusty text-base"></i> Kunci PIN 4-Digit Pribadi
                                </div>
                                <label class="inline-flex items-center gap-1.5 cursor-pointer font-semibold text-charcoal">
                                    <input id="sec-pin-enabled" type="checkbox" ${sec.pinEnabled ? 'checked' : ''} class="accent-[#C98288] w-4 h-4">
                                    <span>Kunci saat dibuka</span>
                                </label>
                            </div>
                            <input id="sec-pin-code" type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" value="${this.escapeHtml(sec.pinCode || '')}" placeholder="Masukkan 4 angka PIN rahasia (misal: 1234)" class="w-full px-3.5 py-2 rounded-xl bg-ivory border border-borderwarm text-xs text-charcoal tracking-widest">
                        </div>

                        <div class="p-4 rounded-2xl bg-cream border border-borderwarm text-xs text-muted space-y-3">
                            <div class="flex items-center justify-between">
                                <div class="font-semibold text-charcoal flex items-center gap-1.5">
                                    <i class="ph-fill ph-cloud-check text-dusty text-base"></i> Otomatis Cloud Sync (Supabase Gratis)
                                </div>
                                <label class="inline-flex items-center gap-1.5 cursor-pointer font-semibold text-charcoal">
                                    <input id="cloud-enabled" type="checkbox" ${cfg.enabled ? 'checked' : ''} class="accent-[#C98288] w-4 h-4">
                                    <span>Aktifkan</span>
                                </label>
                            </div>
                            <p class="leading-relaxed">Hubungkan ke proyek gratis <strong>Supabase</strong> agar seluruh jurnal, foto, dan tabungan otomatis tersimpan & sinkron lintas perangkat saat diinstal dari GitHub Pages.</p>
                            
                            <div class="space-y-2">
                                <input id="cloud-url" type="url" value="${this.escapeHtml(cfg.url || '')}" placeholder="Supabase Project URL (https://xxx.supabase.co)" class="w-full px-3.5 py-2 rounded-xl bg-ivory border border-borderwarm text-xs text-charcoal">
                                <input id="cloud-key" type="password" value="${this.escapeHtml(cfg.anonKey || '')}" placeholder="Supabase Anon Public Key" class="w-full px-3.5 py-2 rounded-xl bg-ivory border border-borderwarm text-xs text-charcoal">
                                <input id="cloud-sync-id" type="text" value="${this.escapeHtml(cfg.syncId || '')}" placeholder="Kode Ruang Pribadi Rahasia (misal: dearly-ruangku-2026)" class="w-full px-3.5 py-2 rounded-xl bg-ivory border border-borderwarm text-xs text-charcoal">
                            </div>

                            <details class="bg-ivory/80 rounded-xl p-2.5 border border-borderwarm">
                                <summary class="cursor-pointer font-semibold text-charcoal text-[11px]">Lihat 1x Perintah SQL Setup di Supabase</summary>
                                <pre class="mt-2 p-2 rounded-lg bg-cream text-[10px] overflow-x-auto text-charcoal select-all">${sqlSnippet}</pre>
                            </details>

                            <div class="flex flex-wrap gap-2 pt-1">
                                <button type="button" onclick="app.saveCloudSettingsAndSync('push')" class="px-3.5 py-1.5 rounded-full bg-dusty text-white font-semibold inline-flex items-center gap-1">
                                    <i class="ph ph-cloud-arrow-up"></i> Simpan & Unggah ke Cloud
                                </button>
                                <button type="button" onclick="app.saveCloudSettingsAndSync('pull')" class="px-3.5 py-1.5 rounded-full bg-ivory border border-borderwarm text-charcoal font-semibold inline-flex items-center gap-1 hover:opacity-85">
                                    <i class="ph ph-cloud-arrow-down"></i> Tarik Data dari Cloud
                                </button>
                            </div>
                        </div>

                        <div class="p-3.5 rounded-2xl bg-cream/60 border border-borderwarm text-xs text-muted flex flex-wrap items-center justify-between gap-2">
                            <span class="font-medium text-charcoal">Cadangan Offline Manual (.JSON)</span>
                            <div class="flex items-center gap-2">
                                <button type="button" onclick="app.exportBackupData()" class="px-3 py-1.5 rounded-full bg-ivory border border-borderwarm text-charcoal font-semibold inline-flex items-center gap-1">
                                    <i class="ph ph-download-simple"></i> Unduh
                                </button>
                                <label class="px-3 py-1.5 rounded-full bg-ivory border border-borderwarm text-charcoal font-semibold cursor-pointer inline-flex items-center gap-1 hover:opacity-85">
                                    <i class="ph ph-upload-simple"></i> Pulihkan
                                    <input type="file" accept=".json,application/json" class="hidden" onchange="app.importBackupData(this)">
                                </label>
                            </div>
                        </div>

                        <div class="flex justify-end gap-2 pt-1">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Tutup</button>
                            <button onclick="app.saveProfile()" class="px-5 py-2 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Profil</button>
                        </div>
                    </div>
                `, 'max-w-lg');
            }

            async saveCloudSettingsAndSync(direction) {
                const url = document.getElementById('cloud-url').value.trim();
                const anonKey = document.getElementById('cloud-key').value.trim();
                const syncId = document.getElementById('cloud-sync-id').value.trim();

                if (!url || !anonKey || !syncId) {
                    this.toast('Isi URL, Anon Key, dan Kode Ruang Pribadi terlebih dahulu.', 'error');
                    return;
                }

                this.saveCloudConfig({ enabled: true, url, anonKey, syncId });
                if (direction === 'pull') {
                    await this.pullFromCloud(false);
                } else {
                    await this.pushToCloud(false);
                }
            }

            saveProfile() {
                this.state.profile.userName = document.getElementById('prof-name').value.trim() || 'Sahabat';
                const sub = document.getElementById('prof-sub').value.trim();
                if (sub) this.state.profile.subtitle = sub;

                const pinEnabledEl = document.getElementById('sec-pin-enabled');
                const pinCodeEl = document.getElementById('sec-pin-code');
                if (pinEnabledEl && pinCodeEl) {
                    const code = pinCodeEl.value.trim();
                    if (pinEnabledEl.checked && !/^\d{4}$/.test(code)) {
                        this.toast('PIN harus terdiri dari tepat 4 angka.', 'error');
                        return;
                    }
                    this.state.security = {
                        pinEnabled: pinEnabledEl.checked,
                        pinCode: code
                    };
                }

                const enabledEl = document.getElementById('cloud-enabled');
                if (enabledEl) {
                    this.saveCloudConfig({
                        enabled: enabledEl.checked,
                        url: document.getElementById('cloud-url').value.trim(),
                        anonKey: document.getElementById('cloud-key').value.trim(),
                        syncId: document.getElementById('cloud-sync-id').value.trim()
                    });
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Profil & pengaturan keamanan disimpan.');
            }

            applyThemeVariables() {
                const t = this.state.theme || TEMPLATE_PRESETS[0];
                const root = document.documentElement;
                const icon = document.getElementById('candlelight-icon');

                if (this.state.candlelightMode) {
                    root.classList.add('candlelight-mode');
                    if (icon) icon.className = 'ph-fill ph-sun text-base text-amber-300';
                } else {
                    root.classList.remove('candlelight-mode');
                    root.style.setProperty('--bg-primary', t.bgPrimary);
                    root.style.setProperty('--bg-secondary', t.bgSecondary);
                    root.style.setProperty('--accent-primary', t.accentPrimary);
                    root.style.setProperty('--accent-soft', t.accentSoft);
                    root.style.setProperty('--accent-secondary', t.accentSecondary);
                    root.style.setProperty('--accent-sky', t.accentSky);
                    if (icon) icon.className = 'ph ph-moon-stars text-base text-dusty';
                }
            }

            toast(msg, type = 'success') {
                const container = document.getElementById('toast-container');
                if (!container) return;
                const el = document.createElement('div');
                el.className = `dearly-pill px-4 py-2.5 rounded-2xl text-xs font-semibold text-charcoal shadow-lg flex items-center gap-2 animate-enter ${type === 'error' ? 'border-red-300 bg-red-50/95 text-red-700' : ''}`;
                el.innerHTML = `${type === 'error' ? '<i class="ph-bold ph-warning text-red-500"></i>' : '<span class="text-dusty">✦</span>'} <span>${this.escapeHtml(msg)}</span>`;
                container.appendChild(el);
                setTimeout(() => {
                    el.style.opacity = '0';
                    setTimeout(() => el.remove(), 300);
                }, 3000);
            }

            logActivity(featureId, actionText, itemTitle) {
                const feat = DEARLY_FEATURES.find(f => f.id === featureId);
                this.state.activityLog.unshift({
                    id: 'act_' + Date.now(),
                    featureId,
                    featureTitle: feat ? feat.title : featureId,
                    actionText,
                    itemTitle,
                    timestamp: new Date().toISOString()
                });
                if (this.state.activityLog.length > 25) this.state.activityLog.pop();
            }

            formatDate(isoStr) {
                if (!isoStr) return '';
                try {
                    const d = new Date(isoStr);
                    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                } catch (e) {
                    return isoStr;
                }
            }

            confirmAction(message, onConfirm) {
                this._pendingConfirm = onConfirm;
                this.openModal(`
                    <div class="space-y-4 text-center">
                        <div class="w-12 h-12 rounded-2xl bg-blush/70 text-dusty flex items-center justify-center mx-auto">
                            <i class="ph-bold ph-warning-circle text-2xl"></i>
                        </div>
                        <h3 class="font-serif text-xl font-medium text-charcoal">${this.escapeHtml(message)}</h3>
                        <p class="text-xs text-muted">Tindakan ini tidak dapat dibatalkan setelah dihapus.</p>
                        <div class="flex justify-center gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.executePendingConfirm()" class="px-5 py-2 rounded-full text-xs font-semibold bg-red-600 text-white">Ya, Hapus</button>
                        </div>
                    </div>
                `, 'max-w-sm');
            }

            executePendingConfirm() {
                const fn = this._pendingConfirm;
                this._pendingConfirm = null;
                this.closeModal();
                if (typeof fn === 'function') fn();
            }

            openModal(htmlContent, maxWidthClass = 'max-w-lg') {
                const backdrop = document.getElementById('modal-backdrop');
                const content = document.getElementById('modal-content');
                if (!backdrop || !content) return;
                content.className = `dearly-card w-full ${maxWidthClass} p-6 sm:p-7 shadow-2xl relative animate-enter my-auto`;
                content.innerHTML = htmlContent;
                backdrop.classList.remove('hidden');
                backdrop.classList.add('flex');
            }

            closeModal() {
                const backdrop = document.getElementById('modal-backdrop');
                if (backdrop) {
                    backdrop.classList.remove('flex');
                    backdrop.classList.add('hidden');
                }
            }

            dismissSplash() {
                const splash = document.getElementById('dearly-splash');
                if (splash && !splash.classList.contains('splash-hidden')) {
                    splash.classList.add('splash-hidden');
                    setTimeout(() => {
                        splash.style.display = 'none';
                    }, 780);
                }
            }

            renderEmptyState(title, description, btnLabel, btnOnclick) {
                return `
                <div class="dearly-card p-10 sm:p-12 text-center max-w-lg mx-auto space-y-4">
                    <div onclick="app.interactWithCompanion(this, event)" title="Sapa Teman Dearly" class="flex justify-center">
                        ${DEARLY_ILLUSTRATIONS.companionPuff}
                    </div>
                    <h3 class="font-serif text-2xl font-medium text-charcoal">${title}</h3>
                    <p class="text-xs sm:text-sm text-muted leading-relaxed">${description}</p>
                    <div class="pt-1">
                        <button onclick="${btnOnclick}" class="px-6 py-2.5 rounded-full bg-dusty hover:opacity-90 text-white text-xs sm:text-sm font-semibold shadow-md transition-transform active:scale-95">
                            + ${btnLabel}
                        </button>
                    </div>
                </div>`;
            }
        }

        function registerDearlyPWA() {
            try {
                const iconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192"><rect width="192" height="192" rx="48" fill="#F7DDE0"/><path d="M96 36L112 80L156 96L112 112L96 156L80 112L36 96L80 80L96 36Z" fill="#C98288"/></svg>`;
                const iconUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(iconSvg);
                const manifest = {
                    name: 'Dearly — Your Little Space',
                    short_name: 'Dearly',
                    start_url: './',
                    display: 'standalone',
                    background_color: '#FFF7E6',
                    theme_color: '#FFF7E6',
                    icons: [{ src: iconUrl, sizes: '192x192', type: 'image/svg+xml' }]
                };
                const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
                const link = document.createElement('link');
                link.rel = 'manifest';
                link.href = URL.createObjectURL(blob);
                document.head.appendChild(link);
            } catch (e) {}
        }

        let app;
        window.onload = function() {
            registerDearlyPWA();
            app = new DearlyApp();
            setTimeout(() => {
                if (app) app.dismissSplash();
            }, 1750);
        };
    </script>
</body>
</html>

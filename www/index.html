            renderWidgetShortcuts() {
                const ids = this.state.homeConfig.shortcuts || ['journal', 'notes', 'memories', 'habits'];
                const items = ids.map(id => DEARLY_FEATURES.find(f => f.id === id)).filter(Boolean);
                return `
                <div class="grid grid-cols-2 sm:grid-cols-4 gap-3.5">
                    ${items.map((item, idx) => `
                        <button onclick="app.navigate('${item.id}')" class="dearly-card dearly-card-hover p-4 text-left flex flex-col justify-between gap-3.5 group stagger-item" style="animation-delay:${idx * 0.05}s">
                            <div class="w-11 h-11 rounded-2xl flex items-center justify-center transition-transform group-hover:scale-105 shadow-xs" style="background:${item.pastel}">
                                ${item.icon}
                            </div>
                            <div>
                                <div class="font-semibold text-sm text-charcoal group-hover:text-dusty transition-colors">${item.short}</div>
                                <div class="text-[11px] text-softgray line-clamp-1 mt-0.5">${item.title}</div>
                            </div>
                        </button>
                    `).join('')}
                </div>`;
            }

            renderWidgetActivity() {
                const logs = this.state.activityLog;
                if (logs.length === 0) {
                    return `
                    <div class="p-6 rounded-2xl bg-cream border border-borderwarm text-center space-y-1">
                        <p class="text-xs font-semibold text-charcoal">Belum ada aktivitas tercatat</p>
                        <p class="text-[11px] text-muted">Setiap catatan, jurnal, atau kebiasaan yang kamu selesaikan akan muncul di sini.</p>
                    </div>`;
                }
                return `
                <div class="space-y-2 max-h-[200px] overflow-y-auto pr-1">
                    ${logs.slice(0, 5).map(item => {
                        const feat = DEARLY_FEATURES.find(f => f.id === item.featureId);
                        return `
                        <button onclick="app.navigate('${item.featureId}')" class="w-full p-2.5 rounded-2xl bg-cream hover:opacity-90 border border-borderwarm flex items-center justify-between gap-2.5 text-left transition-all">
                            <div class="flex items-center gap-2.5 min-w-0">
                                <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${feat ? feat.pastel : '#F7DDE0'}">
                                    ${feat ? feat.icon : DEARLY_ILLUSTRATIONS.sparkleMark}
                                </div>
                                <div class="truncate">
                                    <div class="text-xs font-semibold text-charcoal truncate">${this.escapeHtml(item.actionText)}: <span class="font-normal text-muted">${this.escapeHtml(item.itemTitle)}</span></div>
                                    <div class="text-[10px] text-softgray">${this.escapeHtml(item.featureTitle)}</div>
                                </div>
                            </div>
                            <span class="text-[10px] text-softgray shrink-0">${this.formatDate(item.timestamp)}</span>
                        </button>`;
                    }).join('')}
                </div>`;
            }

            // =================================================================
            // ALL SPACES ("SEMUA RUANG PRIBADI")
            // =================================================================
            renderAllFeaturesView() {
                return `
                <div class="space-y-7 animate-enter">
                    <div class="space-y-1.5 border-b border-borderwarm pb-6">
                        <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-dusty">SEMUA RUANG PRIBADI</span>
                        <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Jelajahi Dearly</h1>
                        <p class="text-sm text-muted">11 ruang untuk merawat cerita, kenangan, kebiasaan, dan impianmu.</p>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${DEARLY_FEATURES.map((f, idx) => {
                            const count = this.getFeatureItemCount(f.id);
                            return `
                            <button onclick="app.navigate('${f.id}')" class="dearly-card dearly-card-hover p-5 text-left flex items-start gap-4 group stagger-item" style="animation-delay:${idx * 0.035}s">
                                <div class="w-12 h-12 rounded-2xl flex items-center justify-center shrink-0 transition-transform group-hover:scale-105 shadow-xs" style="background:${f.pastel}">
                                    ${f.icon}
                                </div>
                                <div class="flex-1 min-w-0">
                                    <div class="flex items-center justify-between gap-2">
                                        <h3 class="font-serif text-lg font-semibold text-charcoal group-hover:text-dusty transition-colors truncate">${f.title}</h3>
                                        <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-cream border border-borderwarm text-muted shrink-0">${count}</span>
                                    </div>
                                    <p class="text-xs text-muted mt-1 line-clamp-2 leading-relaxed">${f.desc}</p>
                                </div>
                            </button>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            getFeatureItemCount(id) {
                const d = this.state.data;
                switch(id) {
                    case 'journal': return d.journal.length;
                    case 'memories': return d.memories.length;
                    case 'letter': return d.letter && d.letter.content ? 1 : 0;
                    case 'habits': return d.habits.length;
                    case 'goals': return d.goals.length;
                    case 'finance': return d.finance.transactions.length + d.finance.savingsGoals.length;
                    case 'watchlist': return d.watchlist.length;
                    case 'wishlist': return d.wishlist.length;
                    case 'recipes': return d.recipes.length;
                    case 'activities': return d.activities.length;
                    case 'notes': return d.notes.length;
                    default: return 0;
                }
            }

            // =================================================================
            // NUANSA KERTAS & HOME CUSTOMIZER
            // =================================================================
            renderTemplateGalleryView() {
                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div>
                            <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-dusty">PERSONALISASI</span>
                            <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal mt-1">Nuansa Kertas Dearly</h1>
                            <p class="text-sm text-muted mt-1">Pilih warna latar kertas yang paling nyaman untuk menemanimu menulis.</p>
                        </div>
                        <button onclick="app.navigate('home')" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs font-semibold shadow-md">Kembali ke Home</button>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        ${TEMPLATE_PRESETS.map(tpl => `
                            <div class="dearly-card dearly-card-hover p-6 flex flex-col justify-between gap-4" style="background: radial-gradient(circle at 85% 20%, ${tpl.accentSoft}, transparent 60%), radial-gradient(circle at 15% 85%, ${tpl.accentSky}, transparent 60%), ${tpl.bgPrimary};">
                                <div class="space-y-2">
                                    <div class="flex items-center justify-between">
                                        <h3 class="font-serif text-xl font-semibold text-[#23201E]">${tpl.name}</h3>
                                        <span class="w-5 h-5 rounded-full border border-white shadow-xs" style="background-color:${tpl.accentPrimary}"></span>
                                    </div>
                                    <p class="text-xs text-[#6E6863]">Perpaduan gradien dreamy lembut dengan kartu baca yang bersih.</p>
                                    <div class="flex items-center gap-1.5 pt-1">
                                        <span class="w-4 h-4 rounded-full border border-white" style="background:${tpl.accentSoft}"></span>
                                        <span class="w-4 h-4 rounded-full border border-white" style="background:${tpl.accentSky}"></span>
                                        <span class="w-4 h-4 rounded-full border border-white" style="background:${tpl.accentSecondary}"></span>
                                    </div>
                                </div>
                                <button onclick="app.applyTemplate('${tpl.id}')" class="w-full py-2.5 rounded-full text-xs font-semibold text-white transition-transform active:scale-95 shadow-sm" style="background-color:${tpl.accentPrimary}">
                                    Gunakan Nuansa Ini
                                </button>
                            </div>
                        `).join('')}
                    </div>
                </div>`;
            }

            applyTemplate(tplId) {
                const tpl = TEMPLATE_PRESETS.find(x => x.id === tplId);
                if (!tpl) return;
                this.state.theme = tpl;
                this.state.candlelightMode = false;
                this.saveState();
                this.applyThemeVariables();
                this.toast(`Nuansa "${tpl.name}" diterapkan.`);
                this.navigate('home');
            }

            openHomeCustomizerModal() {
                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="font-serif text-2xl font-medium text-charcoal">Atur Ruang Utama Home</h3>
                            <button onclick="app.closeModal()" class="p-1.5 rounded-full hover:bg-cream text-muted"><i class="ph ph-x"></i></button>
                        </div>
                        <p class="text-xs text-muted leading-relaxed">Pilih maksimal 4 ruang yang tampil langsung di beranda utama.</p>
                        <div class="grid grid-cols-2 sm:grid-cols-3 gap-2.5 max-h-64 overflow-y-auto p-1">
                            ${DEARLY_FEATURES.map(f => {
                                const selected = this.state.homeConfig.shortcuts.includes(f.id);
                                return `
                                <button type="button" onclick="app.toggleShortcutSelection('${f.id}')" class="p-3 rounded-2xl border text-left flex items-center gap-2.5 transition-all ${selected ? 'bg-ivory border-dusty' : 'bg-cream border-borderwarm opacity-65'}">
                                    <div class="w-9 h-9 rounded-xl flex items-center justify-center shrink-0" style="background:${f.pastel}">${f.icon}</div>
                                    <div class="min-w-0">
                                        <div class="text-xs font-semibold text-charcoal truncate">${f.short}</div>
                                    </div>
                                </button>`;
                            }).join('')}
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-borderwarm">
                            <button onclick="app.restoreDefaultHome()" class="text-xs text-dusty font-semibold hover:underline">Reset Default</button>
                            <button onclick="app.closeModal()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Selesai</button>
                        </div>
                    </div>
                `, 'max-w-xl');
            }

            toggleShortcutSelection(id) {
                let sc = this.state.homeConfig.shortcuts;
                if (sc.includes(id)) {
                    if (sc.length <= 1) {
                        this.toast('Minimal harus ada 1 pintasan aktif.', 'error');
                        return;
                    }
                    sc = sc.filter(x => x !== id);
                } else {
                    if (sc.length >= 4) {
                        this.toast('Maksimal 4 pintasan untuk tata letak rapi.', 'error');
                        return;
                    }
                    sc.push(id);
                }
                this.state.homeConfig.shortcuts = sc;
                this.saveState();
                this.openHomeCustomizerModal();
            }

            restoreDefaultHome() {
                this.state.homeConfig.shortcuts = ['journal', 'notes', 'memories', 'habits'];
                this.state.theme = TEMPLATE_PRESETS[0];
                this.saveState();
                this.applyThemeVariables();
                this.closeModal();
                this.render();
                this.toast('Pengaturan Home dikembalikan ke awal.');
            }

            // =================================================================
            // 6A. JURNAL HARIAN (WITH PAPER TEXTURES: BLANK, DOTTED, LINED)
            // =================================================================
            renderJournalView() {
                const q = (this.routeParams.search || '').toLowerCase();
                const items = this.state.data.journal.filter(j =>
                    j.title.toLowerCase().includes(q) ||
                    this.stripHtml(j.content).toLowerCase().includes(q) ||
                    (j.tag || '').toLowerCase().includes(q)
                );

                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-blush flex items-center justify-center shrink-0">${SPACE_ICONS.journal}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Jurnal Harian</h1>
                                <p class="text-sm text-muted">Ruang tenang untuk merekam cerita dan perasaan setiap harinya.</p>
                            </div>
                        </div>
                        <button onclick="app.openJournalForm()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md flex items-center gap-2 self-start sm:self-auto">
                            <i class="ph-bold ph-pen-nib"></i> Tulis Jurnal Baru
                        </button>
                    </div>

                    <div class="dearly-card px-4 py-2.5 flex items-center gap-2.5">
                        <i class="ph ph-magnifying-glass text-softgray"></i>
                        <input type="text" value="${this.escapeHtml(this.routeParams.search || '')}" oninput="app.routeParams.search=this.value; app.render()" placeholder="Cari judul, isi tulisan, atau tag jurnal..." class="w-full bg-transparent text-sm focus:outline-none">
                    </div>

                    ${items.length === 0 ? this.renderEmptyState('No journal entries yet.', 'Take a little moment for yourself and write down what is on your mind today.', 'Tulis Jurnal Pertama', 'app.openJournalForm()') : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${items.map((j, idx) => {
                            const pClass = j.paperStyle === 'dotted' ? 'paper-style-dotted' : (j.paperStyle === 'lined' ? 'paper-style-lined' : '');
                            return `
                            <article class="dearly-card dearly-card-hover ${pClass} p-6 flex flex-col justify-between gap-4 stagger-item" style="animation-delay:${idx * 0.04}s">
                                <div class="space-y-2.5">
                                    <div class="flex items-center justify-between text-xs text-softgray">
                                        <span>${this.formatDate(j.date)}</span>
                                        <div class="flex items-center gap-1.5">
                                            ${j.mood ? `<span class="px-2.5 py-0.5 rounded-full bg-blush/80 text-charcoal font-medium">✦ ${this.escapeHtml(j.mood)}</span>` : ''}
                                            ${j.tag ? `<span class="px-2.5 py-0.5 rounded-full bg-cream border border-borderwarm text-dusty font-medium">#${this.escapeHtml(j.tag)}</span>` : ''}
                                        </div>
                                    </div>
                                    <h3 class="font-serif text-2xl font-medium text-charcoal cursor-pointer hover:text-dusty transition-colors" onclick="app.openJournalDetail('${j.id}')">${this.escapeHtml(j.title)}</h3>
                                    ${j.photo ? `<img src="${this.escapeHtml(j.photo)}" onerror="this.style.display='none'" alt="Foto Jurnal" class="w-full h-44 object-cover rounded-2xl border border-borderwarm">` : ''}
                                    <div class="dearly-rich-content text-sm text-muted line-clamp-3 leading-relaxed">${this.sanitizeRichHtml(j.content)}</div>
                                </div>
                                <div class="flex items-center justify-between pt-3 border-t border-borderwarm">
                                    <button onclick="app.openJournalDetail('${j.id}')" class="text-xs font-semibold text-dusty hover:underline">Baca selengkapnya →</button>
                                    <div class="flex items-center gap-1">
                                        <button onclick="app.openJournalForm('${j.id}')" class="p-2 rounded-full hover:bg-cream text-muted"><i class="ph ph-pencil-simple"></i></button>
                                        <button onclick="app.deleteJournal('${j.id}')" class="p-2 rounded-full hover:bg-red-50 text-red-600"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>
                            </article>`;
                        }).join('')}
                    </div>`}
                </div>`;
            }

            openJournalForm(id = null) {
                const existing = id ? this.state.data.journal.find(x => x.id === id) : null;
                this.isFocusMode = false;
                this.focusEditorFont = 'serif';
                this.focusPaperStyle = existing && existing.paperStyle ? existing.paperStyle : 'blank';

                const pLabels = { blank: 'Kertas: Polos', dotted: 'Kertas: Titik', lined: 'Kertas: Bergaris' };
                const initialPaperClass = this.focusPaperStyle === 'dotted' ? 'paper-style-dotted' : (this.focusPaperStyle === 'lined' ? 'paper-style-lined' : '');

                this.openModal(`
                    <div id="journal-editor-shell" class="space-y-4 transition-all">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <h3 class="font-serif text-2xl font-medium text-charcoal">${existing ? 'Edit Jurnal' : 'Tulis Jurnal Harian'}</h3>
                            <div class="flex flex-wrap items-center gap-1.5">
                                <button type="button" onclick="app.cycleJournalPaper()" id="j-paper-btn" class="px-3 py-1 rounded-full bg-cream border border-borderwarm text-xs font-medium text-charcoal">
                                    ${pLabels[this.focusPaperStyle]}
                                </button>
                                <button type="button" onclick="app.toggleJournalFont()" id="j-font-btn" class="px-3 py-1 rounded-full bg-cream border border-borderwarm text-xs font-medium text-charcoal">
                                    Huruf: Editorial
                                </button>
                                <button type="button" onclick="app.toggleJournalFocusMode()" id="j-focus-btn" class="px-3 py-1 rounded-full bg-blush/70 text-xs font-semibold text-charcoal flex items-center gap-1">
                                    <i class="ph ph-arrows-out-simple"></i> Fokus
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Judul Jurnal *</label>
                            <input id="j-title" type="text" value="${existing ? this.escapeHtml(existing.title) : ''}" placeholder="Cerita hari ini..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm focus:outline-none focus:border-dusty">
                        </div>
                        <div id="j-meta-row" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Suasana Hati</label>
                                <select id="j-mood" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm focus:outline-none">
                                    <option value="">Pilih suasana hati...</option>
                                    ${MOOD_OPTIONS.map(m => `<option value="${m.display}" ${existing && existing.mood === m.display ? 'selected' : ''}>${m.display}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Tag</label>
                                <input id="j-tag" type="text" value="${existing ? this.escapeHtml(existing.tag || '') : ''}" placeholder="refleksi, harian, syukur" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm focus:outline-none">
                            </div>
                        </div>
                        <div id="j-photo-row" class="space-y-2">
                            <label class="text-xs font-semibold text-muted block">Foto Jurnal (Galeri Perangkat)</label>
                            <div class="flex items-center gap-3">
                                <label class="px-4 py-2 rounded-full bg-cream hover:opacity-85 border border-borderwarm text-xs font-semibold text-charcoal cursor-pointer inline-flex items-center gap-1.5">
                                    <i class="ph ph-image text-dusty"></i> Pilih Foto
                                    <input type="file" accept="image/*" class="hidden" onchange="app.handlePhotoFileSelect(this, 'j-photo-preview', 'j-photo')">
                                </label>
                                <button type="button" onclick="document.getElementById('j-photo').value=''; document.getElementById('j-photo-preview').classList.add('hidden')" class="text-xs text-softgray hover:text-red-600">Hapus Foto</button>
                            </div>
                            <input id="j-photo" type="hidden" value="${existing ? this.escapeHtml(existing.photo || '') : ''}">
                            <img id="j-photo-preview" src="${existing && existing.photo ? this.escapeHtml(existing.photo) : ''}" class="${existing && existing.photo ? '' : 'hidden'} w-full max-h-40 object-cover rounded-2xl border border-borderwarm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Isi Tulisan *</label>
                            ${this.renderRichToolbar('j-content')}
                            <div id="j-content" contenteditable="true" data-placeholder="Tuliskan apa saja yang ada di hatimu..." class="dearly-rich-editor w-full px-4 py-3 rounded-2xl bg-cream border border-borderwarm font-serif text-lg leading-[28px] focus:outline-none focus:border-dusty ${initialPaperClass}">${existing ? this.sanitizeRichHtml(existing.content) : ''}</div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveJournal('${id || ''}')" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Jurnal</button>
                        </div>
                    </div>
                `, 'max-w-2xl');
            }

            cycleJournalPaper() {
                const ta = document.getElementById('j-content');
                const btn = document.getElementById('j-paper-btn');
                if (!ta || !btn) return;
                const order = ['blank', 'dotted', 'lined'];
                const labels = { blank: 'Kertas: Polos', dotted: 'Kertas: Titik', lined: 'Kertas: Bergaris' };
                const next = order[(order.indexOf(this.focusPaperStyle) + 1) % order.length];
                this.focusPaperStyle = next;
                ta.classList.remove('paper-style-dotted', 'paper-style-lined');
                if (next === 'dotted') ta.classList.add('paper-style-dotted');
                if (next === 'lined') ta.classList.add('paper-style-lined');
                btn.textContent = labels[next];
            }

            toggleJournalFont() {
                const ta = document.getElementById('j-content');
                const btn = document.getElementById('j-font-btn');
                if (!ta || !btn) return;
                if (this.focusEditorFont === 'serif') {
                    this.focusEditorFont = 'hand';
                    ta.classList.remove('font-serif', 'text-lg');
                    ta.classList.add('font-hand', 'text-2xl');
                    btn.textContent = 'Huruf: Tulisan Tangan';
                } else {
                    this.focusEditorFont = 'serif';
                    ta.classList.remove('font-hand', 'text-2xl');
                    ta.classList.add('font-serif', 'text-lg');
                    btn.textContent = 'Huruf: Editorial';
                }
            }

            toggleJournalFocusMode() {
                const modal = document.getElementById('modal-content');
                const meta = document.getElementById('j-meta-row');
                const photo = document.getElementById('j-photo-row');
                const ta = document.getElementById('j-content');
                const btn = document.getElementById('j-focus-btn');
                if (!modal || !ta) return;

                this.isFocusMode = !this.isFocusMode;
                if (this.isFocusMode) {
                    modal.classList.remove('max-w-2xl');
                    modal.classList.add('max-w-4xl', 'min-h-[85vh]');
                    if (meta) meta.classList.add('hidden');
                    if (photo) photo.classList.add('hidden');
                    ta.style.minHeight = '360px';
                    if (btn) btn.innerHTML = '<i class="ph ph-arrows-in-simple"></i> Keluar Fokus';
                } else {
                    modal.classList.remove('max-w-4xl', 'min-h-[85vh]');
                    modal.classList.add('max-w-2xl');
                    if (meta) meta.classList.remove('hidden');
                    if (photo) photo.classList.remove('hidden');
                    ta.style.minHeight = '185px';
                    if (btn) btn.innerHTML = '<i class="ph ph-arrows-out-simple"></i> Fokus';
                }
            }

            saveJournal(id) {
                const title = document.getElementById('j-title').value.trim();
                const editorEl = document.getElementById('j-content');
                const rawHtml = editorEl ? editorEl.innerHTML : '';
                const plainText = this.stripHtml(rawHtml).trim();
                const content = this.sanitizeRichHtml(rawHtml);
                const mood = document.getElementById('j-mood').value;
                const tag = document.getElementById('j-tag').value.trim();
                const photo = document.getElementById('j-photo').value;
                const paperStyle = this.focusPaperStyle || 'blank';

                if (!title || !plainText) {
                    this.toast('Judul dan isi jurnal wajib diisi.', 'error');
                    return;
                }

                if (id) {
                    const item = this.state.data.journal.find(x => x.id === id);
                    if (item) {
                        item.title = title;
                        item.content = content;
                        item.mood = mood;
                        item.tag = tag;
                        item.photo = photo;
                        item.paperStyle = paperStyle;
                        this.logActivity('journal', 'Memperbarui jurnal', title);
                    }
                } else {
                    this.state.data.journal.unshift({
                        id: 'j_' + Date.now(),
                        title,
                        content,
                        mood,
                        tag,
                        photo,
                        paperStyle,
                        date: new Date().toISOString()
                    });
                    this.logActivity('journal', 'Menulis jurnal baru', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Jurnal berhasil disimpan.');
            }

            deleteJournal(id) {
                this.confirmAction('Hapus lembar jurnal ini?', () => {
                    this.state.data.journal = this.state.data.journal.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Jurnal dihapus.');
                });
            }

            openJournalDetail(id) {
                const j = this.state.data.journal.find(x => x.id === id);
                if (!j) return;
                const pClass = j.paperStyle === 'dotted' ? 'paper-style-dotted' : (j.paperStyle === 'lined' ? 'paper-style-lined' : '');
                this.openModal(`
                    <div class="space-y-4 ${pClass} rounded-2xl p-2 animate-page-turn">
                        <div class="flex items-center justify-between text-xs text-softgray">
                            <span>${this.formatDate(j.date)}</span>
                            <div class="flex items-center gap-1.5">
                                ${j.mood ? `<span class="px-2.5 py-0.5 rounded-full bg-blush/80 text-charcoal font-medium">✦ ${this.escapeHtml(j.mood)}</span>` : ''}
                                ${j.tag ? `<span class="px-2.5 py-0.5 rounded-full bg-cream border border-borderwarm text-dusty font-medium">#${this.escapeHtml(j.tag)}</span>` : ''}
                            </div>
                        </div>
                        <h2 class="font-serif text-3xl font-medium text-charcoal">${this.escapeHtml(j.title)}</h2>
                        ${j.photo ? `<img src="${this.escapeHtml(j.photo)}" class="w-full max-h-72 object-cover rounded-2xl border border-borderwarm">` : ''}
                        <div class="dearly-rich-content font-serif text-lg leading-[28px] text-charcoal/90 pt-2">${this.sanitizeRichHtml(j.content)}</div>
                        <div class="flex justify-end pt-4 border-t border-borderwarm">
                            <button onclick="app.closeModal()" class="px-5 py-2 rounded-full text-xs font-semibold bg-dusty text-white">Tutup</button>
                        </div>
                    </div>
                `, 'max-w-2xl');
            }

            // =================================================================
            // 6B. KOTAK KENANGAN (POLAROID & WASHI TAPE GALLERY + TIMELINE)
            // =================================================================

                                            ${m.photo ? `<img src="${this.escapeHtml(m.photo)}" onerror="this.src='https://placehold.co/600x450/FFF7E6/C98288?text=Kenangan+Dearly'" class="w-full h-full object-cover">` : `<div class="text-center p-4 text-dusty flex flex-col items-center">${SPACE_ICONS.memories}<div class="font-hand text-base mt-1">Momen Tersimpan</div></div>`}

                                        <div class="px-1">

                                            </div>
                                            <h3 class="font-serif text-xl font-medium text-charcoal mt-0.5">${this.escapeHtml(m.title)}</h3>
                                            <p class="text-xs text-muted mt-1 line-clamp-3 leading-relaxed">${this.escapeHtml(m.story)}</p>

                                        <button onclick="app.deleteMemory('${m.id}')" class="p-1.5 rounded-full hover:bg-red-50 text-softgray hover:text-red-600"><i class="ph ph-trash"></i></button>

                                        <div class="flex-1 space-y-1.5">
                                            <div class="font-hand text-lg font-semibold text-dusty">${this.formatDate(m.date)} ${m.category ? '• ' + this.escapeHtml(m.category) : ''}</div>
                                            <h3 class="font-serif text-2xl font-medium text-charcoal">${this.escapeHtml(m.title)}</h3>

                            <img id="m-photo-preview" src="${m && m.photo ? this.escapeHtml(m.photo) : ''}" class="${m && m.photo ? '' : 'hidden'} w-full max-h-44 object-cover rounded-2xl border border-borderwarm">

                            <textarea id="m-story" rows="4" placeholder="Apa yang membuat momen ini begitu berkesan?" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">${m ? this.escapeHtml(m.story) : ''}</textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveMemory('${id || ''}')" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Kenangan</button>
                        </div>
                    </div>
                `);

            saveMemory(id) {
                const title = document.getElementById('m-title').value.trim();
                const date = document.getElementById('m-date').value;
                const category = document.getElementById('m-cat').value.trim();
                const photo = document.getElementById('m-photo').value;
                const story = document.getElementById('m-story').value.trim();

                if (!title || !story) {
                    this.toast('Judul dan cerita kenangan wajib diisi.', 'error');
                    return;
                }

                if (id) {
                    const item = this.state.data.memories.find(x => x.id === id);
                    if (item) {
                        item.title = title;
                        item.date = date;
                        item.category = category;
                        item.photo = photo;
                        item.story = story;
                        this.logActivity('memories', 'Memperbarui kenangan', title);
                    }
                } else {
                    this.state.data.memories.unshift({
                        id: 'm_' + Date.now(),
                        title,
                        date,
                        category,
                        photo,
                        story
                    });
                    this.logActivity('memories', 'Menyimpan kenangan baru', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.triggerSparkleBurst();
                this.toast('Kenangan berhasil disimpan.');
            }

            deleteMemory(id) {
                this.confirmAction('Hapus kenangan ini?', () => {
                    this.state.data.memories = this.state.data.memories.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Kenangan dihapus.');
                });
            }

            // =================================================================
            // 6C. SURAT MASA DEPAN (WITH 3D ENVELOPE UNFOLD ANIMATION)
            // =================================================================
            unfoldFutureEnvelope() {
                const env = document.getElementById('future-envelope-box');

                this.triggerSparkleBurst();
                setTimeout(() => {
                    if (this.state.data.letter) {
                        this.state.data.letter.isOpened = true;
                        this.saveState();
                        this.render();
                    }
                }, 850);
            }

            renderLetterView() {
                const letter = this.state.data.letter;
                const todayStr = new Date().toISOString().slice(0, 10);
                const minDate = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
                const canOpen = letter && letter.openDate && letter.openDate <= todayStr;

                return `
                <div class="space-y-6 animate-enter max-w-3xl mx-auto">

                    <div class="dearly-card p-7 sm:p-9 space-y-5">
                        <div class="text-center space-y-2">

                            <p class="text-sm text-muted max-w-lg mx-auto">Tuliskan surat penuh makna. Setelah dikunci, isi surat hanya dapat dibaca ketika tanggal pembukaan telah tiba.</p>

                                <div class="envelope-letter-sheet w-48 h-28 bg-ivory rounded-xl border border-borderwarm p-3 text-left shadow-xs">

                                    <div class="w-32 h-1.5 rounded-full bg-borderwarm mb-1.5"></div>
                                    <div class="w-28 h-1.5 rounded-full bg-borderwarm"></div>

                                    <span class="w-7 h-7 rounded-full bg-dusty text-white text-xs flex items-center justify-center shadow-sm">✦</span>
                                </div>
                            </div>
                            <div class="space-y-2">
                                <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-dusty">${canOpen ? 'WAKTUNYA TELAH TIBA' : 'KAPSUL WAKTU TERKUNCI'}</span>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">${this.escapeHtml(letter.subject || 'Surat Masa Depan')}</h1>
                                <p class="text-sm text-muted">${canOpen ? 'Amplop kapsul waktumu sudah siap dibuka!' : 'Surat ini sedang dijaga dengan tenang hingga waktunya tiba.'}</p>
                            </div>
                            ${canOpen ? `
                            <div>
                                <button onclick="app.unfoldFutureEnvelope()" class="px-6 py-3 rounded-full bg-dusty text-white text-sm font-semibold shadow-md hover:opacity-95 transition-transform active:scale-95">

                    )}
                </div>`;

            saveFutureLetter() {
                const subject = document.getElementById('fl-subject').value.trim();
                const openDate = document.getElementById('fl-date').value;
                const content = document.getElementById('fl-content').value.trim();

                if (!content || !openDate) {
                    this.toast('Tanggal pembukaan dan isi surat wajib diisi.', 'error');
                    return;
                }

                this.state.data.letter = {
                    subject: subject || 'Surat untuk Diriku',
                    openDate,
                    content,
                    isOpened: false
                };
                this.logActivity('letter', 'Mengunci surat masa depan', subject || 'Surat Masa Depan');
                this.saveState();
                this.render();
                this.toast('Surat berhasil dikunci dalam kapsul waktu.');
            }

            resetFutureLetter() {
                this.confirmAction('Hapus atau tulis ulang surat ini?', () => {
                    this.state.data.letter = null;
                    this.saveState();
                    this.render();
                    this.toast('Surat direset.');
                });
            }

            // =================================================================
            // 6D. PELACAK KEBIASAAN (WITH SPARKLE BURST CELEBRATION)
            // =================================================================
            renderHabitsView() {
                const habits = this.state.data.habits;
                const todayStr = new Date().toISOString().slice(0, 10);

                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-sage flex items-center justify-center shrink-0">${SPACE_ICONS.habits}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Pelacak Kebiasaan</h1>
                                <p class="text-sm text-muted">Bangun rutinitas lembut yang konsisten setiap harinya.</p>
                            </div>
                        </div>
                        <button onclick="app.openHabitForm()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md flex items-center gap-2 self-start sm:self-auto">
                            <i class="ph-bold ph-plus"></i> Tambah Kebiasaan
                        </button>
                    </div>

                    ${habits.length === 0 ? this.renderEmptyState('No habits tracked yet.', 'Start with one gentle daily ritual, like drinking water or reading 10 pages.', 'Tambah Kebiasaan', 'app.openHabitForm()') : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${habits.map((h, idx) => {
                            const history = h.history || [];
                            const isDoneToday = history.includes(todayStr);
                            const activeColor = idx % 2 === 0 ? '#E8A5B0' : '#9EC489';
                            return `
                            <div class="dearly-card p-5 space-y-4 stagger-item" style="animation-delay:${idx * 0.04}s">
                                <div class="flex items-center justify-between gap-3">
                                    <div class="flex items-center gap-3">
                                        <button onclick="app.toggleHabitToday('${h.id}', event)" class="w-9 h-9 rounded-2xl flex items-center justify-center transition-transform active:scale-90 border ${isDoneToday ? 'border-transparent text-white shadow-xs' : 'bg-cream border-borderwarm text-softgray'}" style="${isDoneToday ? 'background-color:' + activeColor : ''}">
                                            <i class="ph-bold ph-check text-base"></i>
                                        </button>
                                        <div>
                                            <h3 class="font-semibold text-base text-charcoal">${this.escapeHtml(h.name)}</h3>
                                            <div class="text-[11px] text-softgray">${history.length} hari tercatat</div>
                                        </div>
                                    </div>
                                    <button onclick="app.deleteHabit('${h.id}')" class="text-softgray hover:text-red-600 text-xs p-2 rounded-full"><i class="ph ph-trash"></i></button>
                                </div>
                                <div class="grid grid-cols-14 gap-1.5 pt-1" style="grid-template-columns: repeat(14, minmax(0, 1fr));">
                                    ${this.renderHabitContributionGrid(history, activeColor)}
                                </div>
                            </div>`;
                        }).join('')}
                    </div>`}
                </div>`;
            }

            renderHabitContributionGrid(history, activeColor) {
                let html = '';
                for (let i = 27; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const dateStr = d.toISOString().slice(0, 10);
                    const active = history.includes(dateStr);
                    html += `<div class="aspect-square rounded-[4px] border border-borderwarm/70 transition-colors" style="background-color:${active ? activeColor : 'var(--surface-subtle)'}" title="${dateStr}"></div>`;
                }
                return html;
            }

            openHabitForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Buat Kebiasaan Baru</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Nama Kebiasaan *</label>
                            <input id="h-name" type="text" placeholder="Minum 2L air putih / Journaling 10 menit..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveHabit()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveHabit() {
                const name = document.getElementById('h-name').value.trim();
                if (!name) {
                    this.toast('Nama kebiasaan wajib diisi.', 'error');
                    return;
                }
                this.state.data.habits.push({
                    id: 'h_' + Date.now(),
                    name,
                    history: []
                });
                this.logActivity('habits', 'Membuat kebiasaan baru', name);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Kebiasaan ditambahkan.');
            }

            toggleHabitToday(id, event) {
                const h = this.state.data.habits.find(x => x.id === id);
                if (!h) return;
                const todayStr = new Date().toISOString().slice(0, 10);
                if (!h.history) h.history = [];
                if (h.history.includes(todayStr)) {
                    h.history = h.history.filter(d => d !== todayStr);
                } else {
                    h.history.push(todayStr);
                    this.triggerSparkleBurst(event);
                    this.logActivity('habits', 'Menyelesaikan kebiasaan', h.name);
                    this.toast('Good job! Satu langkah kecil hari ini.');
                }
                this.saveState();
                this.render();
            }

            deleteHabit(id) {
                this.confirmAction('Hapus kebiasaan ini?', () => {
                    this.state.data.habits = this.state.data.habits.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Kebiasaan dihapus.');
                });
            }

            // =================================================================
            // 6E. PELACAK TARGET PRIBADI
            // =================================================================
            renderGoalsView() {
                const goals = this.state.data.goals;
                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-butter flex items-center justify-center shrink-0">${SPACE_ICONS.goals}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Pelacak Target Pribadi</h1>
                                <p class="text-sm text-muted">Rencanakan impian jangka panjang dan pantau langkah pencapaiannya.</p>
                            </div>
                        </div>
                        <button onclick="app.openGoalForm()" class="px-5 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md flex items-center gap-2 self-start sm:self-auto">
                            <i class="ph-bold ph-plus"></i> Tambah Target
                        </button>
                    </div>

                    ${goals.length === 0 ? this.renderEmptyState('No personal goals yet.', 'Write down one dream you would love to nurture this season.', 'Buat Target Pertama', 'app.openGoalForm()') : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${goals.map(g => `
                            <div class="dearly-card p-6 space-y-4 flex flex-col justify-between">
                                <div class="space-y-2.5">
                                    <div class="flex items-start justify-between gap-2">
                                        <div>
                                            <span class="text-[11px] font-semibold px-2.5 py-0.5 rounded-full bg-butter text-charcoal">${this.escapeHtml(g.category || 'Pengembangan Diri')}</span>
                                            <h3 class="font-serif text-2xl font-medium text-charcoal mt-1.5">${this.escapeHtml(g.title)}</h3>
                                        </div>
                                        <span class="text-xs font-semibold px-3 py-1 rounded-full ${g.progress >= 100 ? 'bg-sage text-charcoal' : 'bg-cream border border-borderwarm text-dusty'}">${g.progress >= 100 ? 'Tercapai' : 'Berjalan'}</span>
                                    </div>
                                    <p class="text-xs text-muted leading-relaxed">${this.escapeHtml(g.description || '')}</p>
                                </div>
                                <div class="space-y-3 pt-3 border-t border-borderwarm">
                                    <div class="flex items-center justify-between text-xs font-medium text-muted">
                                        <span>Progress: ${g.progress || 0}%</span>
                                        ${g.deadline ? `<span>Tenggat: ${this.formatDate(g.deadline)}</span>` : ''}
                                    </div>
                                    <div class="w-full bg-cream h-2.5 rounded-full overflow-hidden border border-borderwarm">
                                        <div class="h-full rounded-full transition-all duration-500 progress-shimmer-bar" style="width: ${g.progress || 0}%; background-color:#9EC489;"></div>
                                    </div>
                                    <div class="flex items-center justify-between pt-1">
                                        <button onclick="app.adjustGoalProgress('${g.id}', 25, event)" class="text-[11px] font-semibold px-3 py-1 rounded-full bg-cream hover:opacity-85 border border-borderwarm text-charcoal">+25% Progres</button>
                                        <button onclick="app.deleteGoal('${g.id}')" class="text-softgray hover:text-red-600 text-xs p-1"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>`}
                </div>`;
            }

            openGoalForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Buat Target Baru</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Judul Target *</label>
                            <input id="g-title" type="text" placeholder="Membaca 24 buku tahun ini..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Kategori</label>
                                <input id="g-cat" type="text" placeholder="Karier, Buku, Kesehatan" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Tenggat Waktu</label>
                                <input id="g-date" type="date" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Deskripsi / Langkah Kecil</label>
                            <textarea id="g-desc" rows="3" placeholder="Detail rencana pencapaian..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm"></textarea>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveGoal()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Target</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveGoal() {
                const title = document.getElementById('g-title').value.trim();
                const category = document.getElementById('g-cat').value.trim();
                const deadline = document.getElementById('g-date').value;
                const description = document.getElementById('g-desc').value.trim();

                if (!title) {
                    this.toast('Judul target wajib diisi.', 'error');
                    return;
                }

                this.state.data.goals.push({
                    id: 'g_' + Date.now(),
                    title,
                    category,
                    deadline,
                    description,
                    progress: 0
                });
                this.logActivity('goals', 'Membuat target baru', title);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Target ditambahkan.');
            }

            adjustGoalProgress(id, add, event) {
                const g = this.state.data.goals.find(x => x.id === id);
                if (!g) return;
                g.progress = Math.min(100, (g.progress || 0) + add);
                if (g.progress >= 100) this.triggerSparkleBurst(event);
                this.saveState();
                this.render();
                this.toast(`Progres "${g.title}" diperbarui menjadi ${g.progress}%.`);
            }

            deleteGoal(id) {
                this.confirmAction('Hapus target ini?', () => {
                    this.state.data.goals = this.state.data.goals.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Target dihapus.');
                });
            }

            // =================================================================
            // 6F. KEUANGAN & TABUNGAN
            // =================================================================
            renderFinanceView() {
                const fin = this.state.data.finance;
                const totalIncome = fin.transactions.filter(t => t.type === 'income').reduce((sum, t) => sum + Number(t.amount), 0);
                const totalExpense = fin.transactions.filter(t => t.type === 'expense').reduce((sum, t) => sum + Number(t.amount), 0);
                const balance = totalIncome - totalExpense;
                const totalSavings = fin.savingsGoals.reduce((sum, s) => sum + Number(s.currentAmount), 0);

                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-sage flex items-center justify-center shrink-0">${SPACE_ICONS.finance}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Keuangan & Tabungan</h1>
                                <p class="text-sm text-muted">Kelola pemasukan, pengeluaran, dan target tabungan impian.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="app.openTransactionForm()" class="px-4 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md">+ Transaksi</button>
                            <button onclick="app.openSavingsForm()" class="px-4 py-2.5 rounded-full bg-sage text-charcoal text-xs sm:text-sm font-semibold shadow-sm">+ Target Tabungan</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Pemasukan</div>
                            <div class="text-lg sm:text-xl font-bold text-charcoal">${this.formatCurrency(totalIncome)}</div>
                        </div>
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Pengeluaran</div>
                            <div class="text-lg sm:text-xl font-bold text-dusty">${this.formatCurrency(totalExpense)}</div>
                        </div>
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Saldo Utama</div>
                            <div class="text-lg sm:text-xl font-bold text-charcoal">${this.formatCurrency(balance)}</div>
                        </div>
                        <div class="dearly-card p-4 space-y-1">
                            <div class="text-xs text-muted font-medium">Total Tabungan</div>
                            <div class="text-lg sm:text-xl font-bold text-dusty">${this.formatCurrency(totalSavings)}</div>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <h2 class="font-serif text-2xl font-medium text-charcoal">Kantong Tabungan Impian</h2>
                        ${fin.savingsGoals.length === 0 ? `
                        <div class="dearly-card p-8 text-center text-sm text-muted">Belum ada kantong tabungan. Klik "+ Target Tabungan" di atas untuk memulai.</div>` : `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                            ${fin.savingsGoals.map(sg => {
                                const pct = sg.targetAmount > 0 ? Math.min(100, Math.round((sg.currentAmount / sg.targetAmount) * 100)) : 0;
                                return `
                                <div class="dearly-card p-5 space-y-4">
                                    <div class="flex items-start justify-between">
                                        <div>
                                            <h3 class="font-serif text-xl font-medium text-charcoal">${this.escapeHtml(sg.name)}</h3>
                                            <div class="text-xs text-muted mt-0.5">Terkumpul ${this.formatCurrency(sg.currentAmount)} dari ${this.formatCurrency(sg.targetAmount)}</div>
                                        </div>
                                        <span class="text-xs font-bold text-dusty">${pct}%</span>
                                    </div>
                                    <div class="w-full bg-cream h-2.5 rounded-full overflow-hidden border border-borderwarm">
                                        <div class="h-full rounded-full transition-all duration-300" style="width: ${pct}%; background-color:#9EC489;"></div>
                                    </div>
                                    <div class="flex items-center justify-between pt-1">
                                        <button onclick="app.openDepositModal('${sg.id}')" class="px-3.5 py-1.5 rounded-full bg-sage hover:opacity-90 text-charcoal text-xs font-semibold">+ Setor Tabungan</button>
                                        <button onclick="app.deleteSavingsGoal('${sg.id}')" class="text-softgray hover:text-red-600 text-xs p-1"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>`}
                    </div>

                    <div class="space-y-4">
                        <h2 class="font-serif text-2xl font-medium text-charcoal">Riwayat Transaksi</h2>
                        ${fin.transactions.length === 0 ? `
                        <div class="dearly-card p-8 text-center text-sm text-muted">Belum ada riwayat transaksi tercatat.</div>` : `
                        <div class="dearly-card p-4 space-y-2">
                            ${fin.transactions.map(t => `
                                <div class="flex items-center justify-between p-3 rounded-2xl bg-cream border border-borderwarm">
                                    <div class="flex items-center gap-3">
                                        <div class="w-9 h-9 rounded-xl flex items-center justify-center font-bold text-xs ${t.type === 'income' ? 'bg-sage text-charcoal' : 'bg-blush text-dusty'}">
                                            ${t.type === 'income' ? 'IN' : 'EX'}
                                        </div>
                                        <div>
                                            <div class="font-semibold text-sm text-charcoal">${this.escapeHtml(t.description || t.category)}</div>
                                            <div class="text-[11px] text-softgray">${this.formatDate(t.date)} • ${this.escapeHtml(t.category)}</div>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-3">
                                        <span class="font-bold text-sm ${t.type === 'income' ? 'text-charcoal' : 'text-dusty'}">${t.type === 'income' ? '+' : '-'}${this.formatCurrency(t.amount)}</span>
                                        <button onclick="app.deleteTransaction('${t.id}')" class="text-softgray hover:text-red-600 text-xs p-1"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>`}
                    </div>
                </div>`;
            }

            openTransactionForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Tambah Transaksi Keuangan</h3>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Jenis</label>
                                <select id="t-type" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                                    <option value="expense">Pengeluaran</option>
                                    <option value="income">Pemasukan</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Nominal (Rp) *</label>
                                <input id="t-amount" type="number" placeholder="50000" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Kategori</label>
                            <input id="t-cat" type="text" placeholder="Makanan, Transport, Gaji, Hadiah" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Deskripsi</label>
                            <input id="t-desc" type="text" placeholder="Makan siang bersama sahabat..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveTransaction()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan</button>
                        </div>
                    </div>
                `, 'max-w-md');
            }

            saveTransaction() {
                const type = document.getElementById('t-type').value;
                const amount = Number(document.getElementById('t-amount').value);
                const category = document.getElementById('t-cat').value.trim() || 'Umum';
                const description = document.getElementById('t-desc').value.trim();

                if (!amount || amount <= 0) {
                    this.toast('Masukkan nominal transaksi yang valid.', 'error');
                    return;
                }

                this.state.data.finance.transactions.unshift({
                    id: 't_' + Date.now(),
                    type,
                    amount,
                    category,
                    description,
                    date: new Date().toISOString()
                });
                this.logActivity('finance', 'Mencatat transaksi', description || category);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Transaksi berhasil dicatat.');
            }

            deleteTransaction(id) {
                this.confirmAction('Hapus transaksi ini?', () => {
                    this.state.data.finance.transactions = this.state.data.finance.transactions.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Transaksi dihapus.');
                });
            }

            openSavingsForm() {
                this.openModal(`
                    <div class="space-y-4">
                        <h3 class="font-serif text-2xl font-medium text-charcoal">Buat Kantong Tabungan</h3>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Nama Target / Barang *</label>
                            <input id="sg-name" type="text" placeholder="Kamera baru / Liburan akhir tahun..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Nominal Target (Rp) *</label>
                            <input id="sg-target" type="number" placeholder="1500000" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveSavingsGoal()" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan</button>
                        </div>
                    </div>

                                    const active = selectedGenres.includes(g);
                                    return `
                                    <button type="button" onclick="app.toggleWatchlistGenre(this, '${g}')" class="w-genre-pill px-3 py-1 rounded-full text-xs font-medium border transition-all ${active ? 'bg-blush text-charcoal border-dusty font-semibold' : 'bg-cream text-muted border-borderwarm hover:text-charcoal'}">

            selectWatchlistCategory(btnEl, catName) {
                document.querySelectorAll('.w-cat-pill').forEach(b => {
                    b.className = 'w-cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold border transition-all bg-cream text-charcoal border-borderwarm hover:bg-blush/40';
                });
                btnEl.className = 'w-cat-pill px-3.5 py-1.5 rounded-full text-xs font-semibold border transition-all bg-dusty text-white border-dusty shadow-xs';
                const hidden = document.getElementById('w-cat');
                if (hidden) hidden.value = catName;
            }

            toggleWatchlistGenre(btnEl, genreName) {
                const hidden = document.getElementById('w-genre');
                if (!hidden) return;
                let list = hidden.value ? hidden.value.split(',').map(x => x.trim()).filter(Boolean) : [];
                if (list.includes(genreName)) {
                    list = list.filter(x => x !== genreName);
                    btnEl.className = 'w-genre-pill px-3 py-1 rounded-full text-xs font-medium border transition-all bg-cream text-muted border-borderwarm hover:text-charcoal';
                } else {
                    list.push(genreName);
                    btnEl.className = 'w-genre-pill px-3 py-1 rounded-full text-xs font-medium border transition-all bg-blush text-charcoal border-dusty font-semibold';
                }
                hidden.value = list.join(', ');
            }

            saveWatchlist(id = '') {
                const title = document.getElementById('w-title').value.trim();
                const category = document.getElementById('w-cat').value;
                const genre = document.getElementById('w-genre').value.trim();
                const rating = document.getElementById('w-rating').value;
                const review = document.getElementById('w-review').value.trim();

                if (!title) {
                    this.toast('Judul tontonan wajib diisi.', 'error');
                    return;
                }

                if (id) {
                    const item = this.state.data.watchlist.find(x => x.id === id);
                    if (item) {
                        item.title = title;
                        item.category = category;
                        item.genre = genre;
                        item.rating = rating;
                        item.review = review;
                        this.logActivity('watchlist', 'Memperbarui tontonan', title);
                    }
                } else {
                    this.state.data.watchlist.unshift({
                        id: 'w_' + Date.now(),
                        title,
                        category,
                        genre,
                        rating,
                        review
                    });
                    this.logActivity('watchlist', 'Menyimpan tontonan', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Tontonan disimpan.');
            }

            deleteWatchlist(id) {
                this.confirmAction('Hapus item tontonan ini?', () => {
                    this.state.data.watchlist = this.state.data.watchlist.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Dihapus.');

                            <i class="ph-bold ph-plus"></i> Tambah Keinginan

                    this.render();

            sendWishlistToSavings(wishlistId) {
                const item = this.state.data.wishlist.find(x => x.id === wishlistId);

                const exists = this.state.data.finance.savingsGoals.some(g => g.name.toLowerCase() === item.name.toLowerCase());

                    this.toast('Kantong tabungan untuk barang ini sudah ada di Keuangan.', 'error');
                    return;
                }
                this.state.data.finance.savingsGoals.push({
                    id: 'sg_' + Date.now(),
                    name: item.name,
                    targetAmount: Number(item.price),
                    currentAmount: 0
                });

                this.saveState();
                this.toast(`Kantong tabungan "${item.name}" dibuat di Keuangan.`);

                const category = document.getElementById('wi-cat').value.trim();
                const link = document.getElementById('wi-link').value.trim();

            saveActivity() {

                const plannedDate = document.getElementById('act-date').value;
                const description = document.getElementById('act-desc').value.trim();

                if (!name) {
                    this.toast('Nama kegiatan wajib diisi.', 'error');
                    return;
                }

                this.state.data.activities.unshift({
                    id: 'act_' + Date.now(),
                    name,
                    category,
                    plannedDate,
                    description,
                    done: false
                });
                this.logActivity('activities', 'Menambah kegiatan', name);
                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Kegiatan ditambahkan.');
            }

            toggleActivityDone(id, event) {
                const a = this.state.data.activities.find(x => x.id === id);
                if (a) {
                    a.done = !a.done;
                    if (a.done) {
                        this.triggerSparkleBurst(event);
                        this.logActivity('activities', 'Menyelesaikan kegiatan', a.name);
                    }
                    this.saveState();
                    this.render();
                }
            }

            convertActivityToMemory(activityId) {
                const act = this.state.data.activities.find(x => x.id === activityId);
                if (!act) return;
                this.state.data.memories.unshift({
                    id: 'm_' + Date.now(),
                    title: act.name,
                    date: new Date().toISOString().slice(0, 10),
                    category: act.category || 'Kegiatan',
                    photo: '',
                    story: act.description || `Menyelesaikan rencana kegiatan: ${act.name}.`
                });
                this.logActivity('memories', 'Menyimpan momen dari Daftar Kegiatan', act.name);
                this.saveState();
                this.toast(`"${act.name}" disimpan ke Kotak Kenangan.`);
            }

                    this.render();

            openNoteForm(id = null) {
                const n = id ? this.state.data.notes.find(x => x.id === id) : null;

                    <div class="space-y-4">

                            <label class="text-xs font-semibold text-muted block mb-1">Judul *</label>

                        <div class="flex justify-end gap-2 pt-2">

            saveNote(id) {
                const title = document.getElementById('n-title').value.trim();
                const tag = document.getElementById('n-tag').value.trim();
                const editorEl = document.getElementById('n-content');
                const rawHtml = editorEl ? editorEl.innerHTML : '';

                const content = this.sanitizeRichHtml(rawHtml);

                if (!title || !plainText) {
                    this.toast('Judul dan isi catatan wajib diisi.', 'error');
                    return;

                if (id) {
                    const item = this.state.data.notes.find(x => x.id === id);

                        item.tag = tag;

                        tag,
                        content,
                        date: new Date().toISOString()

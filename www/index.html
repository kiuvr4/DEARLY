            stopAmbientEngine() {
                if (this.ambientEngine) {
                    if (this.ambientEngine.intervals) {
                        this.ambientEngine.intervals.forEach(id => clearInterval(id));
                    }
                    if (this.ambientEngine.nodes) {
                        this.ambientEngine.nodes.forEach(n => {
                            try { n.stop(); } catch (e) {}
                            try { n.disconnect(); } catch (e) {}
                        });
                    }
                    if (this.ambientEngine.ctx) {
                        try { this.ambientEngine.ctx.close(); } catch (e) {}
                    }
                    this.ambientEngine = null;
                }
            }

            createStereoSpace(ctx, masterGain) {
                const delayL = ctx.createDelay(1.0);
                const delayR = ctx.createDelay(1.0);
                delayL.delayTime.value = 0.34;
                delayR.delayTime.value = 0.48;

                const fbL = ctx.createGain();
                const fbR = ctx.createGain();
                fbL.gain.value = 0.32;
                fbR.gain.value = 0.32;

                const dampL = ctx.createBiquadFilter();
                const dampR = ctx.createBiquadFilter();
                dampL.type = 'lowpass';
                dampR.type = 'lowpass';
                dampL.frequency.value = 1750;
                dampR.frequency.value = 1550;

                const merger = ctx.createChannelMerger(2);

                delayL.connect(dampL);
                dampL.connect(fbL);
                fbL.connect(delayR);
                dampL.connect(merger, 0, 0);

                delayR.connect(dampR);
                dampR.connect(fbR);
                fbR.connect(delayL);
                dampR.connect(merger, 0, 1);

                const wetGain = ctx.createGain();
                wetGain.gain.value = 0.36;
                merger.connect(wetGain);
                wetGain.connect(masterGain);

                const sendBus = ctx.createGain();
                sendBus.connect(delayL);
                sendBus.connect(delayR);
                return sendBus;
            }

            selectAmbientTrack(track) {
                this.stopAmbientEngine();
                this.currentTrack = track;

                ['off', 'rain', 'piano', 'cafe', 'nature'].forEach(t => {
                    const btn = document.getElementById('track-btn-' + t);
                    if (btn) {
                        btn.className = t === track
                            ? 'w-full text-left px-3 py-1.5 rounded-xl text-xs font-bold bg-blush/60 flex items-center justify-between text-charcoal'
                            : 'w-full text-left px-3 py-1.5 rounded-xl text-xs font-medium hover:bg-cream flex items-center justify-between text-charcoal';
                    }
                });

                if (track === 'off') {
                    this.updateMp3ControlsUI();
                    return;
                }

                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioContext();
                    const masterGain = ctx.createGain();
                    masterGain.gain.setValueAtTime(0.001, ctx.currentTime);
                    masterGain.gain.exponentialRampToValueAtTime(0.75, ctx.currentTime + 1.1);
                    masterGain.connect(ctx.destination);

                    const spaceSend = this.createStereoSpace(ctx, masterGain);
                    const engine = { ctx, nodes: [masterGain], intervals: [] };

                    if (track === 'rain' || track === 'cafe' || track === 'nature') {
                        const bufferSize = 3 * ctx.sampleRate;
                        const noiseBuffer = ctx.createBuffer(2, bufferSize, ctx.sampleRate);
                        for (let ch = 0; ch < 2; ch++) {
                            const out = noiseBuffer.getChannelData(ch);
                            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                            for (let i = 0; i < bufferSize; i++) {
                                const white = Math.random() * 2 - 1;
                                b0 = 0.99886 * b0 + white * 0.0555179;
                                b1 = 0.99332 * b1 + white * 0.0750759;
                                b2 = 0.96900 * b2 + white * 0.1538520;
                                b3 = 0.86650 * b3 + white * 0.3104856;
                                b4 = 0.55000 * b4 + white * 0.5329522;
                                b5 = -0.7616 * b5 - white * 0.0168980;
                                const scale = track === 'rain' ? 0.024 : (track === 'cafe' ? 0.015 : 0.018);
                                out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * scale;
                                b6 = white * 0.115926;
                            }
                        }
                        const src = ctx.createBufferSource();
                        src.buffer = noiseBuffer;
                        src.loop = true;

                        const filter = ctx.createBiquadFilter();
                        filter.type = track === 'cafe' ? 'bandpass' : 'lowpass';
                        filter.frequency.value = track === 'rain' ? 840 : (track === 'cafe' ? 420 : 620);

                        const lfo = ctx.createOscillator();
                        lfo.frequency.value = track === 'nature' ? 0.18 : 0.11;
                        const lfoGain = ctx.createGain();
                        lfoGain.gain.value = 240;
                        lfo.connect(lfoGain);
                        lfoGain.connect(filter.frequency);

                        src.connect(filter);
                        filter.connect(masterGain);
                        src.start(0);
                        lfo.start(0);
                        engine.nodes.push(src, filter, lfo);

                        if (track === 'cafe') {
                            const cafeChords = [[261.63, 329.63, 392.00, 493.88], [220.00, 261.63, 329.63, 392.00]];
                            let cIdx = 0;
                            const playCafeChord = () => {
                                if (!this.ambientEngine) return;
                                const chord = cafeChords[cIdx % cafeChords.length];
                                const t = ctx.currentTime;
                                chord.forEach(f => {
                                    const osc = ctx.createOscillator();
                                    osc.type = 'sine';
                                    osc.frequency.setValueAtTime(f, t);
                                    const env = ctx.createGain();
                                    env.gain.setValueAtTime(0.0001, t);
                                    env.gain.linearRampToValueAtTime(0.022, t + 0.4);
                                    env.gain.exponentialRampToValueAtTime(0.0001, t + 3.8);
                                    osc.connect(env);
                                    env.connect(masterGain);
                                    env.connect(spaceSend);
                                    osc.start(t);
                                    osc.stop(t + 4.0);
                                });
                                cIdx++;
                            };
                            playCafeChord();
                            engine.intervals.push(setInterval(playCafeChord, 4200));
                        }
                    } else if (track === 'piano') {
                        const chords = [
                            { bass: 87.31, arp: [174.61, 220.00, 261.63, 329.63], mel: [523.25, 493.88, 440.00, 392.00] },
                            { bass: 82.41, arp: [164.81, 196.00, 246.94, 293.66], mel: [493.88, 440.00, 392.00, 329.63] },
                            { bass: 73.42, arp: [146.83, 174.61, 220.00, 261.63], mel: [440.00, 392.00, 349.23, 329.63] },
                            { bass: 65.41, arp: [130.81, 196.00, 246.94, 293.66], mel: [392.00, 440.00, 493.88, 523.25] }
                        ];

                        const triggerFeltNote = (freq, vel, dur, isMelody = false) => {
                            if (!this.ambientEngine) return;
                            const t = ctx.currentTime;
                            const osc1 = ctx.createOscillator();
                            const osc2 = ctx.createOscillator();
                            osc1.type = 'triangle';
                            osc2.type = 'sine';
                            osc1.frequency.setValueAtTime(freq, t);
                            osc2.frequency.setValueAtTime(freq * 1.0015, t);

                            const lp = ctx.createBiquadFilter();
                            lp.type = 'lowpass';
                            lp.frequency.setValueAtTime(isMelody ? 1400 : 760, t);
                            lp.frequency.exponentialRampToValueAtTime(260, t + dur);

                            const env = ctx.createGain();
                            env.gain.setValueAtTime(0.0001, t);
                            env.gain.linearRampToValueAtTime(vel, t + 0.035);
                            env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

                            osc1.connect(lp);
                            osc2.connect(lp);
                            lp.connect(env);
                            env.connect(masterGain);
                            env.connect(spaceSend);

                            osc1.start(t);
                            osc2.start(t);
                            osc1.stop(t + dur + 0.05);
                            osc2.stop(t + dur + 0.05);
                        };

                        let step = 0;
                        const playStep = () => {
                            const bar = Math.floor(step / 8) % chords.length;
                            const beatInBar = step % 8;
                            const c = chords[bar];
                            if (beatInBar === 0) triggerFeltNote(c.bass, 0.08, 4.4, false);
                            triggerFeltNote(c.arp[beatInBar % c.arp.length], 0.04, 2.4, false);
                            if (beatInBar === 1 || beatInBar === 4 || beatInBar === 6) {
                                triggerFeltNote(c.mel[Math.floor(Math.random() * c.mel.length)], 0.06, 3.2, true);
                            }
                            step++;
                        };

                        playStep();
                        engine.intervals.push(setInterval(playStep, 560));
                    }

                    this.ambientEngine = engine;
                    this.updateMp3ControlsUI();
                } catch (e) {
                    this.toast('Perangkat tidak mendukung pemutaran audio.', 'error');
                }
            }

            exportBackupData() {
                try {
                    const payload = JSON.stringify(this.state, null, 2);
                    const blob = new Blob([payload], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const dateStr = new Date().toISOString().slice(0, 10);
                    a.href = url;
                    a.download = `dearly-backup-${dateStr}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    this.toast('Cadangan data Dearly (.json) berhasil diunduh.');
                } catch (e) {
                    this.toast('Gagal mengunduh cadangan data.', 'error');
                }
            }

            importBackupData(inputEl) {
                const file = inputEl.files && inputEl.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed || !parsed.data) {
                            this.toast('Format berkas cadangan Dearly tidak valid.', 'error');
                            return;
                        }
                        this.state = this.mergeWithDefault(parsed);
                        this.applyThemeVariables();
                        this.saveState();
                        this.closeModal();
                        this.render();
                        this.toast('Data Dearly berhasil dipulihkan!');
                    } catch (err) {
                        this.toast('Berkas cadangan rusak.', 'error');
                    }
                };
                reader.readAsText(file);
            }

                document.querySelectorAll('[data-nav]').forEach(btn => {

                    const isActive = r === this.currentRoute || (r === 'all' && ['journal','memories','letter','habits','goals','finance','watchlist','wishlist','recipes','notes'].includes(this.currentRoute));
                    btn.className = isActive

                        : 'nav-btn px-4 py-1.5 rounded-full text-muted hover:text-charcoal transition-all';

                document.querySelectorAll('[data-nav-mobile]').forEach(btn => {
                    const r = btn.getAttribute('data-nav-mobile');
                    const isActive = r === this.currentRoute;
                    btn.className = isActive
                        ? 'mobile-nav-btn flex flex-col items-center gap-0.5 px-3.5 py-1.5 rounded-full bg-blush/60 text-dusty text-[11px] font-semibold transition-all'
                        : 'mobile-nav-btn flex flex-col items-center gap-0.5 px-3.5 py-1.5 rounded-full text-muted text-[11px] font-medium transition-all';
                });

                const root = document.getElementById('app-root');
                if (!root) return;

                switch (this.currentRoute) {
                    case 'home': root.innerHTML = this.renderHomeView(); break;
                    case 'all': root.innerHTML = this.renderAllFeaturesView(); break;
                    case 'templates': root.innerHTML = this.renderTemplateGalleryView(); break;
                    case 'journal': root.innerHTML = this.renderJournalView(); break;

                    case 'letter': root.innerHTML = this.renderLetterView(); break;

                    case 'watchlist': root.innerHTML = this.renderWatchlistView(); break;

                    case 'recipes': root.innerHTML = this.renderRecipesView(); break;

                const counts = { TENANG: 0, BAHAGIA: 0, BERSYUKUR: 0, MELANKOLIS: 0, LELAH: 0, BERSEMANGAT: 0 };
                journals.slice(0, 14).forEach(j => {
                    if (j.mood) {

                        if (counts[key] !== undefined) counts[key]++;
                    }

                const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

                return { topMood, counts };

                    case 'letter': return (d.letter && d.letter.content ? 1 : 0) + (Array.isArray(d.miniLetters) ? d.miniLetters.length : 0);
                    case 'habits': return d.habits.length;
                    case 'goals': return d.goals.length;
                    case 'finance': return d.finance.transactions.length + d.finance.savingsGoals.length;
                    case 'watchlist': return d.watchlist.length;
                    case 'wishlist': return d.wishlist.length;
                    case 'recipes': return d.recipes.length;
                    case 'activities': return d.activities.length;
                    case 'notes': return d.notes.length;
                    default: return 0;
                }
            }

            applyTemplate(tplId) {

            openHomeCustomizerModal() {
                this.openModal(`

                                return `
                                <button type="button" onclick="app.toggleShortcutSelection('${f.id}')" class="p-3 rounded-2xl border text-left flex items-center gap-2.5 transition-all ${selected ? 'bg-ivory border-dusty' : 'bg-cream border-borderwarm opacity-65'}">

            toggleShortcutSelection(id) {
                let sc = this.state.homeConfig.shortcuts;
                if (sc.includes(id)) {
                    if (sc.length <= 1) {
                        this.toast('Minimal harus ada 1 pintasan aktif.', 'error');
                        return;
                    }
                    sc = sc.filter(x => x !== id);
                } else {
                    if (sc.length >= 4) {
                        this.toast('Maksimal 4 pintasan untuk tata letak rapi.', 'error');
                        return;
                    }
                    sc.push(id);
                }
                this.state.homeConfig.shortcuts = sc;
                this.saveState();
                this.openHomeCustomizerModal();
            }

                this.state.homeConfig.shortcuts = ['journal', 'notes', 'memories', 'habits'];

                this.saveState();
                this.applyThemeVariables();
                this.closeModal();
                this.render();
                this.toast('Pengaturan Beranda dikembalikan ke awal.');

            renderJournalView() {

                const items = this.state.data.journal.filter(j =>
                    j.title.toLowerCase().includes(q) ||
                    this.stripHtml(j.content).toLowerCase().includes(q) ||

                return `
                <div class="space-y-6 animate-enter">

                    </div>

                    ${items.length === 0 ? this.renderEmptyState('Belum ada lembar jurnal.', 'Ambil waktu sejenak untuk dirimu sendiri dan tuliskan apa yang sedang ada di pikiranmu hari ini.', 'Tulis Jurnal Pertama', 'app.openJournalForm()') : `
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        ${items.map((j, idx) => {
                            const pClass = j.paperStyle === 'dotted' ? 'paper-style-dotted' : (j.paperStyle === 'lined' ? 'paper-style-lined' : '');
                            const fClass = this.getFontClass(j.fontStyle || 'serif');
                            const fStyle = this.getDynamicFontStyleAttr(j.fontStyle);
                            const moodMascot = j.mood && DEARLY_ILLUSTRATIONS.moodMascots[j.mood] ? DEARLY_ILLUSTRATIONS.moodMascots[j.mood] : '';

                                            ${j.tag ? `<span class="px-2.5 py-0.5 rounded-full bg-cream border border-borderwarm text-dusty font-medium">#${this.escapeHtml(j.tag)}</span>` : ''}
                                        </div>
                                    </div>
                                    <h3 class="font-serif text-2xl font-medium text-charcoal cursor-pointer hover:text-dusty transition-colors" onclick="app.openJournalDetail('${j.id}')">${this.escapeHtml(j.title)}</h3>
                                    ${j.photo ? `<img src="${this.escapeHtml(j.photo)}" onerror="this.style.display='none'" alt="Foto Jurnal" class="w-full h-44 object-cover rounded-2xl border border-borderwarm">` : ''}
                                    <div class="dearly-rich-content ${fClass} text-sm text-muted line-clamp-3 leading-relaxed" style="${fStyle}">${this.sanitizeRichHtml(j.content)}</div>
                                </div>
                                <div class="flex items-center justify-between pt-3 border-t border-borderwarm">
                                    <button onclick="app.openJournalDetail('${j.id}')" class="text-xs font-semibold text-dusty hover:underline">Baca selengkapnya →</button>
                                    <div class="flex items-center gap-1">
                                        <button onclick="app.exportJournalPng('${j.id}')" title="Simpan Kartu Gambar PNG" class="p-2 rounded-full hover:bg-cream text-dusty"><i class="ph ph-image"></i></button>
                                        <button onclick="app.openJournalForm('${j.id}')" class="p-2 rounded-full hover:bg-cream text-muted"><i class="ph ph-pencil-simple"></i></button>
                                        <button onclick="app.deleteJournal('${j.id}')" class="p-2 rounded-full hover:bg-red-50 text-red-600"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>
                            </article>`;
                        }).join('')}
                    </div>`}
                </div>`;

            openJournalForm(id = null) {
                const existing = id ? this.state.data.journal.find(x => x.id === id) : null;
                this.isFocusMode = false;
                const initialFont = existing && existing.fontStyle ? existing.fontStyle : 'serif';
                this.focusPaperStyle = existing && existing.paperStyle ? existing.paperStyle : 'blank';
                this.activeEditorPapers['j-content'] = this.focusPaperStyle;
                const initialMood = existing && existing.mood ? existing.mood : '';

                const pLabels = { blank: 'Kertas: Polos', dotted: 'Kertas: Titik', lined: 'Kertas: Bergaris' };
                const initialPaperClass = this.focusPaperStyle === 'dotted' ? 'paper-style-dotted' : (this.focusPaperStyle === 'lined' ? 'paper-style-lined' : '');

                this.openModal(`
                    <div id="journal-editor-shell" class="space-y-4 transition-all">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <h3 class="font-serif text-2xl font-medium text-charcoal">${existing ? 'Edit Daily Journal' : 'Tulis Daily Journal'}</h3>
                            <div class="flex flex-wrap items-center gap-1.5">
                                <button type="button" onclick="app.cycleEditorPaper('j-content', 'j-paper-btn')" id="j-paper-btn" class="px-3 py-1 rounded-full bg-cream border border-borderwarm text-xs font-medium text-charcoal">
                                    ${pLabels[this.focusPaperStyle]}
                                </button>
                                <button type="button" onclick="app.toggleJournalFocusMode()" id="j-focus-btn" class="px-3 py-1 rounded-full bg-blush/70 text-xs font-semibold text-charcoal flex items-center gap-1">
                                    <i class="ph ph-arrows-out-simple"></i> Fokus
                                </button>
                            </div>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Judul Jurnal *</label>
                            <input id="j-title" type="text" value="${existing ? this.escapeHtml(existing.title) : ''}" placeholder="Cerita hari ini..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm focus:outline-none focus:border-dusty">
                        </div>
                        <div id="j-meta-row" class="space-y-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1.5">Suasana Hati (Pilih Maskot Mood)</label>
                                <div class="grid grid-cols-3 sm:grid-cols-6 gap-2">
                                    ${MOOD_OPTIONS.map(m => {
                                        const active = initialMood === m.display;
                                        return `
                                        <button type="button" onclick="app.selectJournalMood(this, '${m.display}')" class="j-mood-card p-2 rounded-2xl border text-center flex flex-col items-center gap-1 transition-all ${active ? 'bg-blush/70 border-dusty scale-103 shadow-xs' : 'bg-cream border-borderwarm hover:bg-ivory'}">
                                            ${DEARLY_ILLUSTRATIONS.moodMascots[m.display] || ''}
                                            <span class="text-[10px] font-semibold text-charcoal">${m.display}</span>
                                        </button>`;
                                    }).join('')}
                                </div>
                                <input id="j-mood" type="hidden" value="${this.escapeHtml(initialMood)}">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Tag</label>
                                <input id="j-tag" type="text" value="${existing ? this.escapeHtml(existing.tag || '') : ''}" placeholder="refleksi, harian, syukur" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm focus:outline-none">
                            </div>
                        </div>
                        <div id="j-photo-row" class="space-y-2">
                            <label class="text-xs font-semibold text-muted block">Foto Jurnal (Galeri Perangkat)</label>
                            <div class="flex items-center gap-3">
                                <label class="px-4 py-2 rounded-full bg-cream hover:opacity-85 border border-borderwarm text-xs font-semibold text-charcoal cursor-pointer inline-flex items-center gap-1.5">
                                    <i class="ph ph-image text-dusty"></i> Pilih Foto
                                    <input type="file" accept="image/*" class="hidden" onchange="app.handlePhotoFileSelect(this, 'j-photo-preview', 'j-photo')">
                                </label>
                                <button type="button" onclick="document.getElementById('j-photo').value=''; document.getElementById('j-photo-preview').classList.add('hidden')" class="text-xs text-softgray hover:text-red-600">Hapus Foto</button>
                            </div>
                            <input id="j-photo" type="hidden" value="${existing ? this.escapeHtml(existing.photo || '') : ''}">
                            <img id="j-photo-preview" src="${existing && existing.photo ? this.escapeHtml(existing.photo) : ''}" class="${existing && existing.photo ? '' : 'hidden'} w-full max-h-40 object-cover rounded-2xl border border-borderwarm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Isi Tulisan *</label>
                            ${this.renderRichToolbar('j-content', initialFont)}
                            <div id="j-content" contenteditable="true" data-placeholder="Tuliskan apa saja yang ada di hatimu..." class="dearly-rich-editor ${this.getFontClass(initialFont)} w-full px-4 py-3 rounded-2xl bg-cream border border-borderwarm text-lg leading-[28px] focus:outline-none focus:border-dusty ${initialPaperClass}" style="${this.getDynamicFontStyleAttr(initialFont)}">${existing ? this.sanitizeRichHtml(existing.content) : ''}</div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveJournal('${id || ''}')" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Jurnal</button>
                        </div>
                    </div>
                `, 'max-w-2xl');
            }

            selectJournalMood(btnEl, moodDisplay) {
                const hidden = document.getElementById('j-mood');
                if (!hidden) return;
                const isSame = hidden.value === moodDisplay;
                document.querySelectorAll('.j-mood-card').forEach(c => {
                    c.className = 'j-mood-card p-2 rounded-2xl border text-center flex flex-col items-center gap-1 transition-all bg-cream border-borderwarm hover:bg-ivory';
                });
                if (isSame) {
                    hidden.value = '';
                } else {
                    hidden.value = moodDisplay;
                    btnEl.className = 'j-mood-card p-2 rounded-2xl border text-center flex flex-col items-center gap-1 transition-all bg-blush/70 border-dusty scale-103 shadow-xs';
                }
            }

            toggleJournalFocusMode() {
                const modal = document.getElementById('modal-content');
                const meta = document.getElementById('j-meta-row');
                const photo = document.getElementById('j-photo-row');
                const ta = document.getElementById('j-content');
                const btn = document.getElementById('j-focus-btn');
                if (!modal || !ta) return;

                this.isFocusMode = !this.isFocusMode;
                if (this.isFocusMode) {
                    modal.classList.remove('max-w-2xl');
                    modal.classList.add('max-w-4xl', 'min-h-[85vh]');
                    if (meta) meta.classList.add('hidden');
                    if (photo) photo.classList.add('hidden');
                    ta.style.minHeight = '360px';
                    if (btn) btn.innerHTML = '<i class="ph ph-arrows-in-simple"></i> Keluar Fokus';
                } else {
                    modal.classList.remove('max-w-4xl', 'min-h-[85vh]');
                    modal.classList.add('max-w-2xl');
                    if (meta) meta.classList.remove('hidden');
                    if (photo) photo.classList.remove('hidden');
                    ta.style.minHeight = '165px';
                    if (btn) btn.innerHTML = '<i class="ph ph-arrows-out-simple"></i> Fokus';
                }
            }

            saveJournal(id) {
                const title = document.getElementById('j-title').value.trim();
                const editorEl = document.getElementById('j-content');
                const rawHtml = editorEl ? editorEl.innerHTML : '';
                const plainText = this.stripHtml(rawHtml).trim();
                const content = this.sanitizeRichHtml(rawHtml);
                const mood = document.getElementById('j-mood').value;
                const tag = document.getElementById('j-tag').value.trim();
                const photo = document.getElementById('j-photo').value;
                const paperStyle = this.focusPaperStyle || 'blank';
                const fontStyle = this.activeEditorFonts['j-content'] || 'serif';

                if (!title || !plainText) {
                    this.toast('Judul dan isi jurnal wajib diisi.', 'error');
                    return;
                }

                if (id) {
                    const item = this.state.data.journal.find(x => x.id === id);
                    if (item) {
                        item.title = title;
                        item.content = content;
                        item.mood = mood;
                        item.tag = tag;
                        item.photo = photo;
                        item.paperStyle = paperStyle;
                        item.fontStyle = fontStyle;
                        this.logActivity('journal', 'Memperbarui jurnal', title);
                    }
                } else {
                    this.state.data.journal.unshift({
                        id: 'j_' + Date.now(),
                        title,
                        content,
                        mood,
                        tag,
                        photo,
                        paperStyle,
                        fontStyle,
                        date: new Date().toISOString()
                    });
                    this.logActivity('journal', 'Menulis jurnal baru', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.toast('Jurnal berhasil disimpan.');
            }

            deleteJournal(id) {
                this.confirmAction('Hapus lembar jurnal ini?', () => {
                    this.state.data.journal = this.state.data.journal.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Jurnal dihapus.');
                });
            }

            openJournalDetail(id) {
                const j = this.state.data.journal.find(x => x.id === id);
                if (!j) return;
                const pClass = j.paperStyle === 'dotted' ? 'paper-style-dotted' : (j.paperStyle === 'lined' ? 'paper-style-lined' : '');
                const fClass = this.getFontClass(j.fontStyle || 'serif');
                const fStyle = this.getDynamicFontStyleAttr(j.fontStyle);
                const moodMascot = j.mood && DEARLY_ILLUSTRATIONS.moodMascots[j.mood] ? DEARLY_ILLUSTRATIONS.moodMascots[j.mood] : '';
                this.openModal(`
                    <div class="space-y-4 ${pClass} rounded-2xl p-2 animate-page-turn">
                        <div class="flex items-center justify-between text-xs text-softgray">
                            <span>${this.formatDate(j.date)}</span>
                            <div class="flex items-center gap-2">
                                ${j.mood ? `<span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blush/85 text-charcoal font-semibold shadow-2xs">${moodMascot ? `<span class="w-8 h-8 -my-1 inline-flex items-center justify-center [&>svg]:w-8 [&>svg]:h-8">${moodMascot}</span>` : '✦'} <span>${this.escapeHtml(j.mood)}</span></span>` : ''}
                                ${j.tag ? `<span class="px-2.5 py-0.5 rounded-full bg-cream border border-borderwarm text-dusty font-medium">#${this.escapeHtml(j.tag)}</span>` : ''}
                            </div>
                        </div>
                        <h2 class="font-serif text-3xl font-medium text-charcoal">${this.escapeHtml(j.title)}</h2>
                        ${j.photo ? `<img src="${this.escapeHtml(j.photo)}" class="w-full max-h-72 object-cover rounded-2xl border border-borderwarm">` : ''}
                        <div class="dearly-rich-content ${fClass} text-lg leading-[28px] text-charcoal/90 pt-2" style="${fStyle}">${this.sanitizeRichHtml(j.content)}</div>
                        <div class="flex items-center justify-between pt-4 border-t border-borderwarm">
                            <button onclick="app.exportJournalPng('${j.id}')" class="px-4 py-2 rounded-full text-xs font-semibold bg-blush/80 hover:opacity-90 text-charcoal inline-flex items-center gap-1.5">
                                <i class="ph-bold ph-image text-dusty"></i> Simpan Gambar PNG ✦
                            </button>
                            <button onclick="app.closeModal()" class="px-5 py-2 rounded-full text-xs font-semibold bg-dusty text-white">Tutup</button>
                        </div>
                    </div>
                `, 'max-w-2xl');
            }

            renderMemoriesView() {
                const viewMode = this.routeParams.viewMode || 'gallery';
                const q = (this.routeParams.search || '').toLowerCase();
                const items = this.state.data.memories.filter(m =>
                    m.title.toLowerCase().includes(q) ||
                    this.stripHtml(m.story || '').toLowerCase().includes(q) ||
                    (m.category || '').toLowerCase().includes(q)
                );

                return `
                <div class="space-y-6 animate-enter">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-borderwarm pb-6">
                        <div class="flex items-center gap-3.5">
                            <div class="w-12 h-12 rounded-2xl bg-lavender flex items-center justify-center shrink-0">${SPACE_ICONS.memories}</div>
                            <div>
                                <h1 class="font-serif text-3xl sm:text-4xl font-medium text-charcoal">Memory Box</h1>
                                <p class="text-sm text-muted">Simpan potret momen berharga dan cerita hangat di baliknya.</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <div class="bg-cream p-1 rounded-full border border-borderwarm flex">
                                <button onclick="app.routeParams.viewMode='gallery'; app.render()" class="px-3 py-1.5 rounded-full text-xs font-medium ${viewMode === 'gallery' ? 'bg-dusty text-white' : 'text-charcoal'}">Polaroid</button>

                            </div>

                    <div class="dearly-card px-4 py-2.5 flex items-center gap-2.5">

                    ${items.length === 0 ? this.renderEmptyState('Belum ada kenangan tersimpan.', 'Mungkin hari ini adalah waktu yang tepat untuk menyimpan satu momen kecil.', 'Tambah Kenangan Pertama', 'app.openMemoryForm()') : (

                                    <div class="flex justify-end gap-1 pt-2 border-t border-borderwarm">

                                        <button onclick="event.stopPropagation(); app.openMemoryForm('${m.id}')" class="p-1.5 rounded-full hover:bg-cream text-muted"><i class="ph ph-pencil-simple"></i></button>
                                        <button onclick="event.stopPropagation(); app.deleteMemory('${m.id}')" class="p-1.5 rounded-full hover:bg-red-50 text-softgray hover:text-red-600"><i class="ph ph-trash"></i></button>
                                    </div>
                                </div>`;

                        <div class="relative pl-6 border-l-2 border-dusty/35 space-y-6 ml-2">

                                const fClass = this.getFontClass(m.fontStyle || 'hand');
                                const fStyle = this.getDynamicFontStyleAttr(m.fontStyle);
                                const pClass = m.paperStyle === 'dotted' ? 'paper-style-dotted' : (m.paperStyle === 'lined' ? 'paper-style-lined' : '');
                                return `
                                <div class="dearly-card ${pClass} p-5 relative">
                                    <span class="w-3.5 h-3.5 rounded-full bg-dusty border-2 border-ivory absolute -left-[31px] top-6"></span>
                                    <div class="flex flex-col sm:flex-row gap-4">
                                        ${m.photo ? `<img src="${this.escapeHtml(m.photo)}" onerror="this.style.display='none'" class="w-full sm:w-44 h-36 object-cover rounded-2xl shrink-0 border border-borderwarm">` : ''}

                                            <div class="flex items-center justify-between">
                                                <div class="font-hand text-lg font-semibold text-dusty">${this.formatDate(m.date)} ${m.category ? '• ' + this.escapeHtml(m.category) : ''}</div>
                                                <button onclick="app.exportMemoryPng('${m.id}')" title="Simpan Kartu Gambar PNG" class="p-1.5 rounded-full hover:bg-cream text-dusty"><i class="ph ph-image"></i></button>
                                            </div>
                                            <h3 class="font-serif text-2xl font-medium text-charcoal">${this.escapeHtml(m.title)}</h3>
                                            <div class="dearly-rich-content ${fClass} text-sm text-muted leading-relaxed" style="${fStyle}">${this.sanitizeRichHtml(m.story)}</div>
                                        </div>
                                    </div>
                                </div>`;
                            }).join('')}
                        </div>`
                    )}
                </div>`;
            }

            openMemoryForm(id = null) {
                const m = id ? this.state.data.memories.find(x => x.id === id) : null;
                const initialFont = m && m.fontStyle ? m.fontStyle : 'hand';
                const initialPaper = m && m.paperStyle ? m.paperStyle : 'lined';
                this.activeEditorPapers['m-story'] = initialPaper;
                const pLabels = { blank: 'Kertas: Polos', dotted: 'Kertas: Titik', lined: 'Kertas: Bergaris' };
                const initialPaperClass = initialPaper === 'dotted' ? 'paper-style-dotted' : (initialPaper === 'lined' ? 'paper-style-lined' : '');

                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <h3 class="font-serif text-2xl font-medium text-charcoal">${m ? 'Edit Kenangan' : 'Simpan Kenangan Baru'}</h3>
                            <button type="button" onclick="app.cycleEditorPaper('m-story', 'm-paper-btn')" id="m-paper-btn" class="px-3 py-1 rounded-full bg-cream border border-borderwarm text-xs font-medium text-charcoal">
                                ${pLabels[initialPaper]}
                            </button>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Judul Momen *</label>
                            <input id="m-title" type="text" value="${m ? this.escapeHtml(m.title) : ''}" placeholder="Sore hujan di kedai kopi..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Tanggal Kenangan</label>
                                <input id="m-date" type="date" value="${m ? m.date.slice(0, 10) : new Date().toISOString().slice(0, 10)}" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Kategori / Tag</label>
                                <input id="m-cat" type="text" value="${m ? this.escapeHtml(m.category || '') : ''}" placeholder="Perjalanan, Sahabat, Keluarga" class="w-full px-3.5 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                            </div>
                        </div>
                        <div class="space-y-2">
                            <label class="text-xs font-semibold text-muted block">Pilih Foto dari Galeri Perangkat</label>
                            <div class="flex items-center gap-3">
                                <label class="px-4 py-2 rounded-full bg-cream hover:opacity-85 border border-borderwarm text-xs font-semibold text-charcoal cursor-pointer inline-flex items-center gap-1.5">
                                    <i class="ph ph-camera text-dusty"></i> Unggah Foto
                                    <input type="file" accept="image/*" class="hidden" onchange="app.handlePhotoFileSelect(this, 'm-photo-preview', 'm-photo')">
                                </label>
                                <button type="button" onclick="document.getElementById('m-photo').value=''; document.getElementById('m-photo-preview').classList.add('hidden')" class="text-xs text-softgray hover:text-red-600">Hapus Foto</button>
                            </div>
                            <input id="m-photo" type="hidden" value="${m ? this.escapeHtml(m.photo || '') : ''}">
                            <img id="m-photo-preview" src="${m && m.photo ? this.escapeHtml(m.photo) : ''}" class="${m && m.photo ? '' : 'hidden'} w-full max-h-44 object-cover rounded-2xl border border-borderwarm">
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-muted block mb-1">Cerita di Balik Momen *</label>
                            ${this.renderRichToolbar('m-story', initialFont)}
                            <div id="m-story" contenteditable="true" data-placeholder="Apa yang membuat momen ini begitu berkesan?" class="dearly-rich-editor ${this.getFontClass(initialFont)} ${initialPaperClass} w-full px-4 py-3 rounded-2xl bg-cream border border-borderwarm text-lg leading-[28px] focus:outline-none focus:border-dusty" style="min-height:190px; ${this.getDynamicFontStyleAttr(initialFont)}">${m ? this.sanitizeRichHtml(m.story) : ''}</div>
                        </div>
                        <div class="flex justify-end gap-2 pt-2">
                            <button onclick="app.closeModal()" class="px-4 py-2 rounded-full text-xs font-medium bg-cream border border-borderwarm text-charcoal">Batal</button>
                            <button onclick="app.saveMemory('${id || ''}')" class="px-5 py-2.5 rounded-full text-xs font-semibold bg-dusty text-white">Simpan Kenangan</button>
                        </div>
                    </div>
                `, 'max-w-2xl');
            }

            saveMemory(id) {
                const title = document.getElementById('m-title').value.trim();
                const date = document.getElementById('m-date').value;
                const category = document.getElementById('m-cat').value.trim();
                const photo = document.getElementById('m-photo').value;
                const editorEl = document.getElementById('m-story');
                const rawHtml = editorEl ? editorEl.innerHTML : '';
                const plainText = this.stripHtml(rawHtml).trim();
                const story = this.sanitizeRichHtml(rawHtml);
                const fontStyle = this.activeEditorFonts['m-story'] || 'hand';
                const paperStyle = this.activeEditorPapers['m-story'] || 'lined';

                if (!title || !plainText) {
                    this.toast('Judul dan cerita kenangan wajib diisi.', 'error');
                    return;
                }

                if (id) {
                    const item = this.state.data.memories.find(x => x.id === id);
                    if (item) {
                        item.title = title;
                        item.date = date;
                        item.category = category;
                        item.photo = photo;
                        item.story = story;
                        item.fontStyle = fontStyle;
                        item.paperStyle = paperStyle;
                        this.logActivity('memories', 'Memperbarui kenangan', title);
                    }
                } else {
                    this.state.data.memories.unshift({
                        id: 'm_' + Date.now(),
                        title,
                        date,
                        category,
                        photo,
                        story,
                        fontStyle,
                        paperStyle
                    });
                    this.logActivity('memories', 'Menyimpan kenangan baru', title);
                }

                this.saveState();
                this.closeModal();
                this.render();
                this.triggerSparkleBurst();
                this.toast('Kenangan berhasil disimpan.');
            }

            deleteMemory(id) {
                this.confirmAction('Hapus kenangan ini?', () => {
                    this.state.data.memories = this.state.data.memories.filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Kenangan dihapus.');
                });
            }

            // =================================================================
            // 6C. FUTURE LETTER (SURAT UTAMA 3D ENVELOPE + SURAT-SURAT KECIL)
            // =================================================================
            unfoldFutureEnvelope() {
                const env = document.getElementById('future-envelope-box');
                if (env) env.classList.add('envelope-open');
                this.triggerSparkleBurst();
                setTimeout(() => {
                    if (this.state.data.letter) {
                        this.state.data.letter.isOpened = true;
                        this.saveState();
                        this.render();
                    }
                }, 850);
            }

            renderLetterView() {
                const letter = this.state.data.letter;
                const miniLetters = Array.isArray(this.state.data.miniLetters) ? this.state.data.miniLetters : [];
                const todayStr = new Date().toISOString().slice(0, 10);
                const minDate = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
                const canOpen = letter && letter.openDate && letter.openDate <= todayStr;
                const letterFontClass = letter ? this.getFontClass(letter.fontStyle || 'serif') : 'dearly-font-serif';
                const letterFontStyle = letter ? this.getDynamicFontStyleAttr(letter.fontStyle) : '';
                const letterPaperClass = letter && letter.paperStyle === 'dotted' ? 'paper-style-dotted' : (letter && letter.paperStyle === 'lined' ? 'paper-style-lined' : '');
                if (!this.activeEditorPapers['fl-content']) this.activeEditorPapers['fl-content'] = 'lined';

                return `
                <div class="space-y-8 animate-enter max-w-3xl mx-auto">
                    <!-- SURAT UTAMA (Kapsul Waktu Jangka Panjang - Amplop Besar) -->
                    <section class="space-y-3">
                        <div class="flex items-center justify-between px-1">
                            <span class="text-[11px] font-bold uppercase tracking-[0.18em] text-dusty flex items-center gap-1.5">
                                <i class="ph-fill ph-envelope-simple-open"></i> Surat Utama (Jangka Panjang)
                            </span>
                            <span class="text-xs text-softgray">Untuk dirimu 5–10 tahun lagi</span>
                        </div>

                        ${!letter || (!letter.content && !letter.subject) ? `
                        <div class="dearly-card p-7 sm:p-9 space-y-5">
                            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-borderwarm pb-5">
                                <div class="flex items-center gap-3.5">
                                    <div class="w-12 h-12 rounded-2xl bg-blush flex items-center justify-center shrink-0">${SPACE_ICONS.letter}</div>
                                    <div>
                                        <h1 class="font-serif text-3xl font-medium text-charcoal">Future Letter Utama</h1>
                                        <p class="text-xs sm:text-sm text-muted">Amplop kapsul waktu istimewa untuk dirimu di masa depan.</p>
                                    </div>
                                </div>
                                <button type="button" onclick="app.cycleEditorPaper('fl-content', 'fl-paper-btn')" id="fl-paper-btn" class="px-3.5 py-1.5 rounded-full bg-cream border border-borderwarm text-xs font-medium text-charcoal self-start sm:self-auto">
                                    Kertas: Bergaris
                                </button>
                            </div>
                            <div class="space-y-4 pt-1">
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                                    <div>
                                        <label class="text-xs font-semibold text-muted block mb-1">Judul Surat Utama</label>
                                        <input id="fl-subject" type="text" placeholder="Untuk diriku di 10 tahun lagi..." class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                                    </div>
                                    <div>
                                        <label class="text-xs font-semibold text-muted block mb-1">Tanggal Pembukaan Surat *</label>
                                        <input id="fl-date" type="date" min="${minDate}" value="${minDate}" class="w-full px-4 py-2.5 rounded-2xl bg-cream border border-borderwarm text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label class="text-xs font-semibold text-muted block mb-1">Isi Surat Utama *</label>
                                    ${this.renderRichToolbar('fl-content', 'hand')}
                                    <div id="fl-content" contenteditable="true" data-placeholder="Tuliskan pesan terbesarmu untuk dirimu di masa depan..." class="dearly-rich-editor dearly-font-hand paper-style-lined w-full px-4 py-3.5 rounded-2xl bg-cream border border-borderwarm text-lg leading-[28px] focus:outline-none focus:border-dusty" style="min-height:220px;"></div>
                                </div>
                                <div class="flex justify-end pt-2">
                                    <button onclick="app.saveFutureLetter()" class="px-6 py-2.5 rounded-full bg-dusty text-white text-xs sm:text-sm font-semibold shadow-md">Kunci Amplop Utama ✦</button>
                                </div>
                            </div>
                        </div>` : (
                            !letter.isOpened ? `
                            <div class="dearly-card p-10 sm:p-12 text-center space-y-6 envelope-stage">
                                <div id="future-envelope-box" class="relative w-56 h-36 mx-auto bg-blush/80 rounded-2xl border border-borderwarm shadow-md flex items-center justify-center overflow-visible">
                                    <div class="envelope-letter-sheet w-48 h-28 bg-ivory rounded-xl border border-borderwarm p-3 text-left shadow-xs">
                                        <div class="w-16 h-2 rounded-full bg-dusty/40 mb-2"></div>
                                        <div class="w-32 h-1.5 rounded-full bg-borderwarm mb-1.5"></div>
                                        <div class="w-28 h-1.5 rounded-full bg-borderwarm"></div>
                                    </div>
                                    <div class="envelope-flap absolute inset-x-0 top-0 h-20 bg-blush border-b border-dusty/30 rounded-t-2xl flex items-end justify-center pb-2 shadow-xs">
                                        <span class="w-7 h-7 rounded-full bg-dusty text-white text-xs flex items-center justify-center shadow-sm">✦</span>
                                    </div>
                                </div>
                                <div class="space-y-2">
                                    <span class="text-[11px] font-bold uppercase tracking-[0.2em] text-dusty">${canOpen ? 'WAKTUNYA TELAH TIBA' : 'AMPLOP UTAMA TERKUNCI'}</span>

                                    <p class="text-sm text-muted">${canOpen ? 'Amplop kapsul waktumu sudah siap dibuka!' : 'Surat utama ini sedang dijaga dengan tenang hingga waktunya tiba.'}</p>
                                </div>
                                ${canOpen ? `
                                <div>
                                    <button onclick="app.unfoldFutureEnvelope()" class="px-6 py-3 rounded-full bg-dusty text-white text-sm font-semibold shadow-md hover:opacity-95 transition-transform active:scale-95">

                                    <div class="text-xs text-softgray">Dapat dibuka pada:</div>
                                    <div class="font-serif text-xl font-semibold text-dusty">${this.formatDate(letter.openDate)}</div>
                                </div>`}
                                <div class="flex items-center justify-center gap-3 pt-2">
                                    <button onclick="app.resetFutureLetter()" class="text-xs text-softgray hover:text-red-600 underline">Batalkan & Tulis Ulang</button>
                                </div>
                            </div>` : `
                            <div class="dearly-card ${letterPaperClass} p-7 sm:p-9 space-y-6 animate-page-turn">
                                <div class="flex flex-wrap items-center justify-between gap-2 pb-4 border-b border-borderwarm">
                                    <div>
                                        <span class="text-[11px] font-bold text-dusty uppercase tracking-wider">SURAT UTAMA DIBUKA</span>
                                        <h1 class="font-serif text-3xl font-medium text-charcoal mt-1">${this.escapeHtml(letter.subject || 'Future Letter')}</h1>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <button onclick="app.exportFutureLetterPng('main')" class="px-3.5 py-2 rounded-full bg-blush/80 text-charcoal text-xs font-semibold hover:opacity-90 inline-flex items-center gap-1">

                                        </button>
                                        <button onclick="app.resetFutureLetter()" class="px-4 py-2 rounded-full bg-cream border border-borderwarm text-charcoal text-xs font-semibold hover:opacity-85">Arsipkan & Tulis Baru</button>
                                    </div>
                                </div>
                                <div class="dearly-rich-content ${letterFontClass} text-lg leading-[28px] text-charcoal/90" style="${letterFontStyle}">${this.sanitizeRichHtml(letter.content)}</div>
                            </div>`
                        )}
                    </section>

                    <!-- SURAT-SURAT KECIL (Mini Time Capsules 1–2 Tahun) -->
                    <section class="space-y-4 pt-3 border-t border-borderwarm">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                            <div>
                                <h2 class="font-serif text-2xl font-medium text-charcoal flex items-center gap-2">
                                    <span>Surat-Surat Kecil</span>
                                    <span class="text-xs font-sans font-semibold px-2.5 py-0.5 rounded-full bg-lavender text-charcoal">${miniLetters.length}</span>
                                </h2>
                                <p class="text-xs text-muted mt-0.5">Kapsul waktu mungil untuk 6 bulan, 1 tahun, atau 2 tahun ke depan.</p>
                            </div>
                            <button onclick="app.openMiniLetterForm()" class="px-4 py-2 rounded-full bg-blush/85 hover:opacity-90 text-charcoal text-xs font-semibold shadow-2xs inline-flex items-center gap-1.5 self-start sm:self-auto">
                                <i class="ph-bold ph-plus text-dusty"></i> Tulis Surat Kecil
                            </button>
                        </div>

                        ${miniLetters.length === 0 ? `
                        <div class="dearly-card p-6 text-center space-y-2 bg-cream/60">
                            <p class="font-serif text-lg text-charcoal">Belum ada surat-surat kecil.</p>
                            <p class="text-xs text-muted max-w-md mx-auto">Simpan catatan-catatan manis beramplop mini untuk dibaca ulang setahun atau dua tahun lagi.</p>
                        </div>` : `
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            ${miniLetters.map((ml, idx) => {
                                const mlCanOpen = ml.openDate && ml.openDate <= todayStr;
                                const ribbonColors = ['#F7DDE0', '#E9E3F5', '#E4EFD9', '#FFF0C7', '#E2EEF8'];
                                const flapColor = ribbonColors[idx % ribbonColors.length];
                                return `
                                <div class="dearly-card dearly-card-hover overflow-hidden flex flex-col justify-between">
                                    <!-- Mini Envelope Top Flap -->
                                    <div class="px-4 py-2.5 border-b border-borderwarm/70 flex items-center justify-between" style="background-color:${flapColor}">
                                        <span class="text-[10px] font-bold uppercase tracking-wider text-charcoal inline-flex items-center gap-1">
                                            <i class="ph-fill ${ml.isOpened ? 'ph-envelope-open' : (mlCanOpen ? 'ph-sparkle' : 'ph-lock-simple')}"></i>
                                            ${ml.isOpened ? 'Sudah Dibuka' : (mlCanOpen ? 'Siap Dibuka!' : 'Terkunci')}
                                        </span>
                                        <span class="text-[11px] font-semibold text-charcoal/80">${this.formatDate(ml.openDate)}</span>
                                    </div>
                                    <div class="p-4 space-y-2">
                                        <h3 class="font-serif text-lg font-medium text-charcoal truncate">${this.escapeHtml(ml.subject || 'Surat Kecil')}</h3>
                                        <p class="text-xs text-muted line-clamp-2">
                                            ${ml.isOpened
                                                ? this.escapeHtml(this.stripHtml(ml.content))
                                                : (mlCanOpen ? 'Amplop kecil ini sudah siap kamu buka sekarang ✦' : 'Tersimpan rapi dalam amplop kecil hingga tanggal pembukaan.')}
                                        </p>

            openMiniLetterForm() {
                const minDate = new Date(Date.now() + 86400000).toISOString().slice(0, 10);
                const oneYearLater = new Date(Date.now() + 365 * 86400000).toISOString().slice(0, 10);
                this.activeEditorPapers['ml-content'] = 'lined';
                this.openModal(`
                    <div class="space-y-4">
                        <div class="flex flex-wrap items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="w-8 h-8 rounded-xl bg-blush flex items-center justify-center text-dusty"><i class="ph-fill ph-envelope"></i></span>
                                <h3 class="font-serif text-2xl font-medium text-charcoal">Tulis Surat Kecil</h3>
                            </div>
                            <button type="button" onclick="app.cycleEditorPaper('ml-content', 'ml-paper-btn')" id="ml-paper-btn" class="px-3 py-1 rounded-full bg-cream border border-borderwarm text-xs font-medium text-charcoal">

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">

                            <div>
                                <label class="text-xs font-semibold text-muted block mb-1">Tanggal Dibuka *</label>

                        </div>
                        <div>

                        </div>
                    </div>
                `, 'max-w-xl');
            }

            saveMiniLetter() {
                const subject = document.getElementById('ml-subject').value.trim();
                const openDate = document.getElementById('ml-date').value;
                const editorEl = document.getElementById('ml-content');
                const rawHtml = editorEl ? editorEl.innerHTML : '';
                const plainText = this.stripHtml(rawHtml).trim();
                const content = this.sanitizeRichHtml(rawHtml);
                const fontStyle = this.activeEditorFonts['ml-content'] || 'hand';
                const paperStyle = this.activeEditorPapers['ml-content'] || 'lined';

                if (!plainText || !openDate) {
                    this.toast('Tanggal buka dan isi surat kecil wajib diisi.', 'error');
                    return;
                }

                if (!Array.isArray(this.state.data.miniLetters)) {
                    this.state.data.miniLetters = [];
                }

                this.state.data.miniLetters.unshift({
                    id: 'ml_' + Date.now(),
                    subject: subject || 'Surat Kecil',
                    openDate,
                    content,
                    fontStyle,
                    paperStyle,
                    isOpened: false
                });
                this.logActivity('letter', 'Mengunci surat kecil', subject || 'Surat Kecil');
                this.saveState();
                this.closeModal();
                this.render();
                this.triggerSparkleBurst();
                this.toast('Surat kecil berhasil dikunci dalam amplop mini ✦');
            }

            openMiniLetterDetail(id) {
                const ml = (this.state.data.miniLetters || []).find(x => x.id === id);
                if (!ml) return;
                const todayStr = new Date().toISOString().slice(0, 10);
                if (!ml.isOpened && ml.openDate > todayStr) {
                    this.toast('Surat kecil ini masih terkunci hingga ' + this.formatDate(ml.openDate));
                    return;
                }
                if (!ml.isOpened) {
                    ml.isOpened = true;
                    this.saveState();
                    this.triggerSparkleBurst();
                    this.render();
                }
                const fClass = this.getFontClass(ml.fontStyle || 'hand');
                const fStyle = this.getDynamicFontStyleAttr(ml.fontStyle);
                const pClass = ml.paperStyle === 'dotted' ? 'paper-style-dotted' : (ml.paperStyle === 'lined' ? 'paper-style-lined' : '');
                this.openModal(`
                    <div class="space-y-4 ${pClass} rounded-2xl p-2 animate-page-turn">
                        <div class="flex items-center justify-between text-xs text-softgray">
                            <span class="px-2.5 py-0.5 rounded-full bg-blush text-charcoal font-bold uppercase tracking-wider text-[10px]">Surat Kecil Dibuka</span>
                            <span>Dibuka: ${this.formatDate(ml.openDate)}</span>
                        </div>
                        <h2 class="font-serif text-3xl font-medium text-charcoal">${this.escapeHtml(ml.subject || 'Surat Kecil')}</h2>
                        <div class="dearly-rich-content ${fClass} text-lg leading-[28px] text-charcoal/90 pt-1" style="${fStyle}">${this.sanitizeRichHtml(ml.content)}</div>
                        <div class="flex items-center justify-between pt-4 border-t border-borderwarm">
                            <button onclick="app.exportFutureLetterPng('mini', '${ml.id}')" class="px-4 py-2 rounded-full text-xs font-semibold bg-blush/80 hover:opacity-90 text-charcoal inline-flex items-center gap-1.5">
                                <i class="ph-bold ph-image text-dusty"></i> Simpan Gambar PNG ✦
                            </button>
                            <button onclick="app.closeModal()" class="px-5 py-2 rounded-full text-xs font-semibold bg-dusty text-white">Tutup</button>
                        </div>
                    </div>
                `, 'max-w-xl');
            }

            deleteMiniLetter(id) {
                this.confirmAction('Hapus surat kecil ini?', () => {
                    this.state.data.miniLetters = (this.state.data.miniLetters || []).filter(x => x.id !== id);
                    this.saveState();
                    this.render();
                    this.toast('Surat kecil dihapus.');
                });
            }

            saveFutureLetter() {
                const subject = document.getElementById('fl-subject').value.trim();
                const openDate = document.getElementById('fl-date').value;
                const editorEl = document.getElementById('fl-content');
                const rawHtml = editorEl ? editorEl.innerHTML : '';
                const plainText = this.stripHtml(rawHtml).trim();
                const content = this.sanitizeRichHtml(rawHtml);
                const fontStyle = this.activeEditorFonts['fl-content'] || 'hand';
                const paperStyle = this.activeEditorPapers['fl-content'] || 'lined';

                if (!plainText || !openDate) {
                    this.toast('Tanggal pembukaan dan isi surat wajib diisi.', 'error');
                    return;
                }

                this.state.data.letter = {
                    subject: subject || 'Future Letter',
                    openDate,
                    content,
                    fontStyle,
                    paperStyle,
                    isOpened: false
                };
                this.logActivity('letter', 'Mengunci surat masa depan', subject || 'Future Letter');
                this.saveState();
                this.render();
                this.toast('Surat berhasil dikunci dalam kapsul waktu.');

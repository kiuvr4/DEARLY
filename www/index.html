<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFF7E6">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Dearly">
    <title>Dearly — Your Little Space</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ivory: 'var(--bg-primary)',
                        cream: 'var(--surface-subtle)',
                        dusty: 'var(--accent-primary)',
                        blush: 'var(--accent-blush)',
                        lavender: 'var(--accent-lavender)',
                        sage: 'var(--accent-sage)',
                        butter: 'var(--accent-butter)',
                        powder: 'var(--accent-powder)',
                        charcoal: 'var(--text-primary)',
                        muted: 'var(--text-secondary)',
                        softgray: 'var(--text-tertiary)',
                        borderwarm: 'var(--border-subtle)'
                    },
                    fontFamily: {
                        serif: ['"Fraunces"', '"Cormorant Garamond"', 'Georgia', 'serif'],
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        hand: ['"Caveat"', 'cursive']
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        :root {
            --bg-primary: #FFF7E6;
            --bg-secondary: #FDF1DC;
            --card-surface: rgba(255, 255, 255, 0.92);
            --surface-subtle: #FCF9F5;
            --pill-surface: rgba(255, 255, 255, 0.98);
            --border-subtle: #EFECE7;
            --card-ring: rgba(255, 255, 255, 0.96);
            --accent-primary: #C98288;
            --accent-soft: #F7C8D3;
            --accent-secondary: #A8B58A;
            --accent-sky: #A9B7C6;
            --accent-blush: #F7DDE0;
            --accent-lavender: #E9E3F5;
            --accent-sage: #E4EFD9;
            --accent-butter: #FFF0C7;
            --accent-powder: #E2EEF8;
            --text-primary: #23201E;
            --text-secondary: #6E6863;
            --text-tertiary: #9E9791;
            --paper-line: rgba(201, 130, 136, 0.16);
        }

        /* Cozy Candlelight Night Mode */
        html.candlelight-mode {
            --bg-primary: #14100E;
            --bg-secondary: #1C1614;
            --card-surface: rgba(34, 28, 25, 0.94);
            --surface-subtle: #241D1A;
            --pill-surface: rgba(38, 31, 28, 0.98);
            --border-subtle: #382E29;
            --card-ring: rgba(68, 56, 50, 0.75);
            --accent-primary: #DC969C;
            --accent-soft: #3B2227;
            --accent-secondary: #263121;
            --accent-sky: #212A36;
            --accent-blush: #462E32;
            --accent-lavender: #383147;
            --accent-sage: #313E2C;
            --accent-butter: #473C26;
            --accent-powder: #2A3846;
            --text-primary: #F5EFEA;
            --text-secondary: #C4B9B0;
            --text-tertiary: #94887E;
            --paper-line: rgba(220, 150, 156, 0.16);
        }

        html.candlelight-mode .dearly-dreamy-bg {
            background: 
                radial-gradient(circle at 12% 15%, #3B2227 0%, transparent 50%),
                radial-gradient(circle at 88% 20%, #1F2937 0%, transparent 48%),
                radial-gradient(circle at 75% 85%, #243020 0%, transparent 50%),
                radial-gradient(circle at 20% 80%, #241C18 0%, transparent 55%),
                #120E0D !important;
            opacity: 1;
        }

        html.candlelight-mode .dreamy-orb {
            opacity: 0.22;
        }

        /* Rich Text Editor & Formatted Content Styling */
        .dearly-rich-editor {
            min-height: 185px;
            outline: none;
            overflow-y: auto;
        }
        .dearly-rich-editor:empty:before {
            content: attr(data-placeholder);
            color: var(--text-tertiary);
            pointer-events: none;
            display: block;
        }
        .dearly-rich-content h2,
        .dearly-rich-editor h2 {
            font-family: 'Fraunces', serif;
            font-size: 1.45rem;
            font-weight: 600;
            line-height: 1.35;
            margin-top: 0.45rem;
            margin-bottom: 0.3rem;
            color: var(--text-primary);
        }
        .dearly-rich-content h3,
        .dearly-rich-editor h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.2rem;
            font-weight: 600;
            line-height: 1.4;
            margin-top: 0.35rem;
            margin-bottom: 0.2rem;
            color: var(--text-primary);
        }
        .dearly-rich-content ul,
        .dearly-rich-editor ul {
            list-style-type: disc;
            padding-left: 1.35rem;
            margin: 0.35rem 0;
        }
        .dearly-rich-content mark,
        .dearly-rich-editor mark {
            padding: 0.08rem 0.32rem;
            border-radius: 0.4rem;
            color: #23201E;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background 0.6s ease, color 0.4s ease;
        }

        /* Dreamy Ambient Mesh Background */
        .dearly-dreamy-bg {
            position: fixed;
            inset: 0;
            z-index: -4;
            background: 
                radial-gradient(circle at 12% 15%, var(--accent-soft) 0%, transparent 48%),
                radial-gradient(circle at 88% 20%, var(--accent-sky) 0%, transparent 45%),
                radial-gradient(circle at 75% 85%, var(--accent-secondary) 0%, transparent 48%),
                radial-gradient(circle at 20% 80%, var(--bg-secondary) 0%, transparent 52%),
                var(--bg-primary);
            opacity: 0.94;
            transition: all 0.6s ease;
        }

        /* Tactile Cotton Paper Grain Overlay */
        .paper-grain-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.032;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        .dreamy-orb {
            position: fixed;
            border-radius: 9999px;
            filter: blur(75px);
            z-index: -3;
            pointer-events: none;
            opacity: 0.45;
            animation: orbDrift 18s ease-in-out infinite alternate;
        }

        @keyframes orbDrift {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(28px, -22px) scale(1.08); }
            100% { transform: translate(-20px, 18px) scale(0.95); }
        }

        /* Tactile Elevated Cards */
        .dearly-card {
            background-color: var(--card-surface);
            backdrop-filter: blur(20px) saturate(145%);
            -webkit-backdrop-filter: blur(20px) saturate(145%);
            border: 1.5px solid var(--card-ring);
            box-shadow: 
                0 16px 38px -8px rgba(25, 20, 18, 0.16),
                0 6px 16px -3px rgba(201, 130, 136, 0.10),
                inset 0 1px 0 rgba(255, 255, 255, 0.25);
            border-radius: 1.5rem;
            transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.28s ease, background-color 0.3s ease;
        }

        .dearly-card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 
                0 24px 48px -8px rgba(25, 20, 18, 0.22),
                0 10px 22px -4px rgba(201, 130, 136, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.35);
        }

        /* Deep Floating Elevation for Navigation & Ambient Pill */
        .dearly-pill {
            background-color: var(--pill-surface);
            backdrop-filter: blur(24px) saturate(170%);
            -webkit-backdrop-filter: blur(24px) saturate(170%);
            border: 1.5px solid var(--card-ring);
            box-shadow: 
                0 28px 58px -8px rgba(25, 20, 18, 0.32),
                0 14px 28px -6px rgba(201, 130, 136, 0.26),
                0 4px 10px rgba(25, 20, 18, 0.12),
                inset 0 1.5px 0 rgba(255, 255, 255, 0.35);
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.25s ease;
        }

        .dearly-pill:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 34px 66px -8px rgba(25, 20, 18, 0.36),
                0 18px 34px -6px rgba(201, 130, 136, 0.30),
                0 6px 14px rgba(25, 20, 18, 0.14),
                inset 0 1.5px 0 rgba(255, 255, 255, 0.45);
        }

        /* Journal Paper Textures */
        .paper-style-dotted {
            background-image: radial-gradient(var(--paper-line) 1.25px, transparent 1.25px);
            background-size: 18px 18px;
        }
        .paper-style-lined {
            background-image: linear-gradient(to bottom, transparent 27px, var(--paper-line) 28px);
            background-size: 100% 28px;
        }

        /* Polaroid Frame & Washi Tape */
        .polaroid-card {
            background: var(--card-surface);
            padding: 0.85rem 0.85rem 1.25rem 0.85rem;
            border-radius: 1.15rem;
            border: 1.5px solid var(--card-ring);
            box-shadow: 0 16px 34px -8px rgba(25, 20, 18, 0.18), 0 4px 10px rgba(0,0,0,0.06);
            position: relative;
            transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.3s ease;
        }
        .polaroid-card:hover {
            transform: translateY(-5px) rotate(0deg) !important;
            box-shadow: 0 24px 44px -8px rgba(25, 20, 18, 0.24);
        }
        .washi-tape {
            position: absolute;
            top: -9px;
            left: 50%;
            transform: translateX(-50%) rotate(-2.5deg);
            width: 74px;
            height: 20px;
            background: linear-gradient(90deg, rgba(247, 200, 211, 0.78), rgba(233, 227, 245, 0.82));
            border-left: 1px dashed rgba(255,255,255,0.6);
            border-right: 1px dashed rgba(255,255,255,0.6);
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            z-index: 5;
            pointer-events: none;
        }

        /* Staggered Entrance & Sparkle Burst */
        @keyframes enter {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-enter {
            animation: enter 0.36s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .stagger-item {
            opacity: 0;
            animation: enter 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Soft Book Page Turn Animation */
        @keyframes pageTurnOpen {
            0% { opacity: 0; transform: perspective(1100px) rotateY(-38deg) translateX(-22px) scale(0.92); transform-origin: left center; }
            60% { opacity: 1; transform: perspective(1100px) rotateY(4deg) translateX(2px) scale(1.01); transform-origin: left center; }
            100% { opacity: 1; transform: perspective(1100px) rotateY(0deg) translateX(0) scale(1); transform-origin: left center; }
        }
        .animate-page-turn {
            animation: pageTurnOpen 0.72s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes gentleIdle {
            0%, 100% { transform: translateY(0px) rotate(-2deg) scale(1); }
            50% { transform: translateY(-9px) rotate(3deg) scale(1.03); }
        }
        .animate-companion {
            animation: gentleIdle 3.2s ease-in-out infinite;
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .animate-companion:hover {
            transform: scale(1.08) rotate(3deg);
        }
        @keyframes companionHop {
            0% { transform: translateY(0) scale(1, 1) rotate(0deg); }
            22% { transform: translateY(6px) scale(1.18, 0.82) rotate(-4deg); }
            52% { transform: translateY(-22px) scale(0.88, 1.15) rotate(6deg); }
            76% { transform: translateY(-4px) scale(1.06, 0.94) rotate(-2deg); }
            100% { transform: translateY(0) scale(1, 1) rotate(0deg); }
        }
        .companion-hop {
            animation: companionHop 0.68s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
        }

        /* Companion Speech Bubble */
        @keyframes bubblePopUp {
            0% { opacity: 0; transform: translate(-50%, 8px) scale(0.7); }
            18% { opacity: 1; transform: translate(-50%, -6px) scale(1.05); }
            82% { opacity: 1; transform: translate(-50%, -10px) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -18px) scale(0.9); }
        }
        .companion-speech-bubble {
            position: fixed;
            z-index: 9999;
            pointer-events: none;
            background: var(--pill-surface);
            color: var(--text-primary);
            border: 1.5px solid var(--accent-primary);
            padding: 6px 14px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 12px 26px rgba(201, 130, 136, 0.28);
            animation: bubblePopUp 2.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        /* Living Ambient Audio Visualizer Bars & Ripple */
        @keyframes eqDance1 { 0%, 100% { height: 4px; } 50% { height: 15px; } }
        @keyframes eqDance2 { 0%, 100% { height: 14px; } 50% { height: 4px; } }
        @keyframes eqDance3 { 0%, 100% { height: 6px; } 50% { height: 16px; } }
        .eq-bar-1 { animation: eqDance1 0.75s ease-in-out infinite; }
        .eq-bar-2 { animation: eqDance2 0.6s ease-in-out infinite; }
        .eq-bar-3 { animation: eqDance3 0.85s ease-in-out infinite; }

        @keyframes ambientRipple {
            0% { box-shadow: 0 0 0 0 rgba(201, 130, 136, 0.55), 0 28px 58px -8px rgba(25, 20, 18, 0.32); }
            70% { box-shadow: 0 0 0 16px rgba(201, 130, 136, 0), 0 28px 58px -8px rgba(25, 20, 18, 0.32); }
            100% { box-shadow: 0 0 0 0 rgba(201, 130, 136, 0), 0 28px 58px -8px rgba(25, 20, 18, 0.32); }
        }
        .ambient-playing-pulse {
            animation: ambientRipple 2s infinite;
        }

        /* Progress Bar Shimmer Wave */
        @keyframes progressShimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(220%); }
        }
        .progress-shimmer-bar {
            position: relative;
            overflow: hidden;
        }
        .progress-shimmer-bar::after {
            content: '';
            position: absolute;
            top: 0; left: 0; bottom: 0;
            width: 55%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75), transparent);
            animation: progressShimmer 2.1s ease-in-out infinite;
        }

        @keyframes sproutWiggle {
            0%, 100% { transform: rotate(-5deg); }
            50% { transform: rotate(8deg); }
        }
        .animate-sprout {
            transform-origin: 55px 28px;
            animation: sproutWiggle 2.6s ease-in-out infinite;
        }

        /* Jelly Button Tactile Press */
        .dearly-jelly-btn {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.25s ease;
        }
        .dearly-jelly-btn:hover {
            transform: translateY(-2px) scale(1.03);
        }
        .dearly-jelly-btn:active {
            transform: scale(0.93);
        }

        /* 3D Envelope Unfold Animation for Future Letter */
        .envelope-stage {
            perspective: 900px;
        }
        .envelope-flap {
            transform-origin: top center;
            transition: transform 0.75s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .envelope-open .envelope-flap {
            transform: rotateX(180deg);
        }
        .envelope-letter-sheet {
            transition: transform 0.85s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.6s ease;
        }
        .envelope-open .envelope-letter-sheet {
            transform: translateY(-28px);
        }

        @keyframes sparklePop {
            0% { opacity: 1; transform: translate(0, 0) scale(0.5); }
            100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.25); }
        }
        .sparkle-particle {
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            color: var(--accent-primary);
            font-size: 14px;
            animation: sparklePop 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* Dreamy Welcome Splash Screen */
        @keyframes splashFadeOut {
            0% { opacity: 1; transform: scale(1); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.03); filter: blur(6px); pointer-events: none; visibility: hidden; }
        }
        @keyframes splashContentRise {
            0% { opacity: 0; transform: translateY(16px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes splashShimmer {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        #dearly-splash {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 20% 25%, var(--accent-soft) 0%, transparent 52%),
                radial-gradient(circle at 80% 75%, var(--accent-sky) 0%, transparent 52%),
                var(--bg-primary);
            transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.7s ease;
        }
        #dearly-splash.splash-hidden {
            animation: splashFadeOut 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }
        .splash-card-inner {
            animation: splashContentRise 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .splash-progress-fill {
            animation: splashShimmer 1.65s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(201, 130, 136, 0.35);
            border-radius: 9999px;
        }
    </style>
</head>
<body class="antialiased selection:bg-blush selection:text-charcoal pb-28 md:pb-12">

    <!-- Dreamy Ambient Gradient + Tactile Cotton Paper Grain -->
    <div id="ambient-bg" class="dearly-dreamy-bg"></div>
    <div class="paper-grain-overlay"></div>
    <div class="dreamy-orb w-80 h-80 top-12 -left-16" style="background: var(--accent-soft);"></div>
    <div class="dreamy-orb w-96 h-96 bottom-16 -right-20" style="background: var(--accent-sky); animation-delay: -7s;"></div>

    <!-- Optional 4-Digit PIN Lock Screen Overlay -->
    <div id="dearly-pin-lock" class="fixed inset-0 z-[9995] hidden items-center justify-center p-4" style="background: radial-gradient(circle at 20% 25%, var(--accent-soft) 0%, transparent 52%), radial-gradient(circle at 80% 75%, var(--accent-sky) 0%, transparent 52%), var(--bg-primary);">
        <div class="dearly-card p-7 sm:p-8 w-full max-w-xs text-center space-y-5 animate-enter">
            <div class="w-16 h-16 mx-auto flex items-center justify-center">
                <svg viewBox="0 0 110 110" fill="none" class="w-16 h-16 animate-companion">
                    <circle cx="55" cy="54" r="32" fill="#F7DDE0"/>
                    <circle cx="46" cy="51" r="3" fill="#23201E"/>
                    <circle cx="64" cy="51" r="3" fill="#23201E"/>
                    <path d="M51 57 Q55 61 59 57" stroke="#23201E" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </div>
            <div class="space-y-1">
                <h2 class="font-serif text-2xl font-semibold text-charcoal">Ruang Terkunci ✦</h2>
                <p class="text-xs text-muted">Masukkan 4-digit PIN Dearly milikmu</p>
            </div>
            <div id="pin-dots-display" class="flex items-center justify-center gap-3 py-1">
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
                <span class="w-3.5 h-3.5 rounded-full border border-dusty bg-cream"></span>
            </div>
            <div class="grid grid-cols-3 gap-2.5 max-w-[220px] mx-auto pt-1">
                <button type="button" onclick="app.enterPinDigit('1')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">1</button>
                <button type="button" onclick="app.enterPinDigit('2')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">2</button>
                <button type="button" onclick="app.enterPinDigit('3')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">3</button>
                <button type="button" onclick="app.enterPinDigit('4')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">4</button>
                <button type="button" onclick="app.enterPinDigit('5')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">5</button>
                <button type="button" onclick="app.enterPinDigit('6')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">6</button>
                <button type="button" onclick="app.enterPinDigit('7')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">7</button>
                <button type="button" onclick="app.enterPinDigit('8')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">8</button>
                <button type="button" onclick="app.enterPinDigit('9')" class="h-11 rounded-2xl bg-cream hover:bg-blush/50 border border-borderwarm font-semibold text-base text-charcoal active:scale-95 transition-all">9</button>

        const DearlyIDB = {
            dbName: 'DearlyPersonalDB',
            storeName: 'workspace',
            open() {
                return new Promise((resolve, reject) => {
                    if (!window.indexedDB) return reject('No IDB');
                    const req = indexedDB.open(this.dbName, 1);
                    req.onupgradeneeded = (e) => {
                        const db = e.target.result;
                        if (!db.objectStoreNames.contains(this.storeName)) {
                            db.createObjectStore(this.storeName);
                        }
                    };
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            },
            async get(key) {
                try {
                    const db = await this.open();
                    return await new Promise((resolve, reject) => {
                        const tx = db.transaction(this.storeName, 'readonly');
                        const req = tx.objectStore(this.storeName).get(key);
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    return null;
                }
            },
            async set(key, val) {
                try {
                    const db = await this.open();
                    return await new Promise((resolve, reject) => {
                        const tx = db.transaction(this.storeName, 'readwrite');
                        const req = tx.objectStore(this.storeName).put(val, key);
                        req.onsuccess = () => resolve(true);
                        req.onerror = () => reject(req.error);
                    });
                } catch (e) {
                    return false;
                }
            }
        };

            checkPinLockOnStart() {
                if (this.state.security && this.state.security.pinEnabled && this.state.security.pinCode && this.state.security.pinCode.length === 4) {
                    const lockEl = document.getElementById('dearly-pin-lock');
                    if (lockEl) {
                        lockEl.classList.remove('hidden');
                        lockEl.classList.add('flex');
                    }
                }
            }

            enterPinDigit(digit) {
                if (this.pinBuffer.length >= 4) return;
                this.pinBuffer += digit;
                this.updatePinDots();
                if (this.pinBuffer.length === 4) {
                    const expected = this.state.security && this.state.security.pinCode;
                    if (this.pinBuffer === expected) {
                        const lockEl = document.getElementById('dearly-pin-lock');
                        if (lockEl) {
                            lockEl.classList.add('hidden');
                            lockEl.classList.remove('flex');
                        }
                        this.pinBuffer = '';
                        this.updatePinDots();
                        this.toast('Selamat datang kembali di Dearly ✦');
                    } else {
                        this.toast('PIN kurang tepat, coba lagi ya.', 'error');
                        setTimeout(() => {
                            this.pinBuffer = '';
                            this.updatePinDots();
                        }, 300);
                    }
                }
            }

            backspacePinDigit() {
                this.pinBuffer = this.pinBuffer.slice(0, -1);
                this.updatePinDots();
            }

            clearPinInput() {
                this.pinBuffer = '';
                this.updatePinDots();

            updatePinDots() {
                const container = document.getElementById('pin-dots-display');

            loadCloudConfig() {
                try {
                    const raw = localStorage.getItem('dearly_cloud_config_v1');
                    if (raw) return JSON.parse(raw);
                } catch (e) {}
                return { enabled: false, url: '', anonKey: '', syncId: '' };
            }

            saveCloudConfig(cfg) {
                this.cloudConfig = cfg;
                try {
                    localStorage.setItem('dearly_cloud_config_v1', JSON.stringify(cfg));
                } catch (e) {}
                this.updateCloudBadge('idle');
            }

            updateCloudBadge(status) {
                const dot = document.getElementById('cloud-status-dot');
                const txt = document.getElementById('cloud-status-text');
                if (!dot || !txt) return;
                if (!this.cloudConfig || !this.cloudConfig.enabled || !this.cloudConfig.url) {
                    dot.className = 'w-2 h-2 rounded-full bg-softgray/50';
                    txt.textContent = 'Lokal';
                    return;
                }
                if (status === 'syncing') {
                    dot.className = 'w-2 h-2 rounded-full bg-amber-400 animate-ping';
                    txt.textContent = 'Menyinkron...';
                } else if (status === 'error') {
                    dot.className = 'w-2 h-2 rounded-full bg-red-500';
                    txt.textContent = 'Cloud Gagal';
                } else {
                    dot.className = 'w-2 h-2 rounded-full bg-emerald-500';
                    txt.textContent = 'Cloud Aktif';
                }
            }

            mergeWithDefault(parsed) {
                const def = createDefaultState();
                return {
                    ...def,
                    ...parsed,
                    profile: { ...def.profile, ...(parsed.profile || {}) },
                    theme: parsed.theme || def.theme,
                    homeConfig: { ...def.homeConfig, ...(parsed.homeConfig || {}) },
                    data: { ...def.data, ...(parsed.data || {}) }
                };
            }

            loadStateSync() {
                try {
                    const raw = localStorage.getItem('dearly_workspace_state_v2');
                    if (raw) return this.mergeWithDefault(JSON.parse(raw));
                } catch (e) {}
                return createDefaultState();
            }

            async initStorageAndCloud() {
                if (navigator.storage && navigator.storage.persist) {
                    try { await navigator.storage.persist(); } catch (e) {}
                }

                const idbState = await DearlyIDB.get('dearly_state');
                if (idbState && idbState.data) {
                    const localTime = new Date(this.state.updatedAt || 0).getTime();
                    const idbTime = new Date(idbState.updatedAt || 0).getTime();
                    if (idbTime > localTime) {
                        this.state = this.mergeWithDefault(idbState);
                        this.applyThemeVariables();
                        this.render();
                    }
                }

                if (this.cloudConfig && this.cloudConfig.enabled && this.cloudConfig.url && this.cloudConfig.anonKey && this.cloudConfig.syncId) {
                    await this.pullFromCloud(true);
                } else {
                    this.updateCloudBadge('idle');
                }
            }

            saveState() {
                this.state.updatedAt = new Date().toISOString();
                DearlyIDB.set('dearly_state', this.state);
                try {
                    localStorage.setItem('dearly_workspace_state_v2', JSON.stringify(this.state));
                } catch (e) {}
                if (this.cloudConfig && this.cloudConfig.enabled && this.cloudConfig.url && this.cloudConfig.anonKey && this.cloudConfig.syncId) {
                    clearTimeout(this.syncTimeout);
                    this.updateCloudBadge('syncing');
                    this.syncTimeout = setTimeout(() => this.pushToCloud(true), 1200);
                }
            }

            async pushToCloud(silent = false) {
                const { url, anonKey, syncId } = this.cloudConfig;
                if (!url || !anonKey || !syncId) return;
                this.updateCloudBadge('syncing');
                try {
                    const cleanUrl = url.replace(/\/+$/, '');
                    const res = await fetch(`${cleanUrl}/rest/v1/dearly_spaces?on_conflict=sync_id`, {
                        method: 'POST',
                        headers: {
                            'apikey': anonKey,
                            'Authorization': `Bearer ${anonKey}`,
                            'Content-Type': 'application/json',
                            'Prefer': 'resolution=merge-duplicates,return=minimal'
                        },
                        body: JSON.stringify({
                            sync_id: syncId,
                            payload: this.state,
                            updated_at: new Date().toISOString()
                        })
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    this.updateCloudBadge('synced');
                    if (!silent) this.toast('Data berhasil tersinkron ke Cloud!');
                } catch (err) {
                    this.updateCloudBadge('error');
                    if (!silent) this.toast('Gagal menyinkron ke Supabase. Periksa URL/Key/Tabel.', 'error');
                }
            }

            async pullFromCloud(silent = false) {
                const { url, anonKey, syncId } = this.cloudConfig;
                if (!url || !anonKey || !syncId) return;
                this.updateCloudBadge('syncing');
                try {
                    const cleanUrl = url.replace(/\/+$/, '');
                    const res = await fetch(`${cleanUrl}/rest/v1/dearly_spaces?sync_id=eq.${encodeURIComponent(syncId)}&select=payload,updated_at`, {
                        method: 'GET',
                        headers: {
                            'apikey': anonKey,
                            'Authorization': `Bearer ${anonKey}`
                        }
                    });
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const rows = await res.json();
                    if (rows && rows.length > 0 && rows[0].payload) {
                        const cloudPayload = rows[0].payload;
                        const cloudTime = new Date(cloudPayload.updatedAt || rows[0].updated_at || 0).getTime();
                        const localTime = new Date(this.state.updatedAt || 0).getTime();
                        if (!silent || cloudTime > localTime) {
                            this.state = this.mergeWithDefault(cloudPayload);
                            DearlyIDB.set('dearly_state', this.state);
                            try { localStorage.setItem('dearly_workspace_state_v2', JSON.stringify(this.state)); } catch (e) {}
                            this.applyThemeVariables();
                            this.render();
                        }
                        this.updateCloudBadge('synced');
                        if (!silent) this.toast('Data berhasil dimuat dari Cloud!');
                    } else {
                        await this.pushToCloud(silent);
                    }
                } catch (err) {
                    this.updateCloudBadge('error');
                    if (!silent) this.toast('Gagal mengambil data dari Cloud.', 'error');
                }
            }

            escapeHtml(str) {
                if (!str) return '';
                return String(str)
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
            }

            stripHtml(html) {
                if (!html) return '';
                const tmp = document.createElement('div');
                tmp.innerHTML = html;
                return tmp.textContent || tmp.innerText || '';
            }

            sanitizeRichHtml(html) {
                if (!html) return '';
                const allowedTags = new Set(['B', 'STRONG', 'I', 'EM', 'U', 'H2', 'H3', 'MARK', 'SPAN', 'P', 'BR', 'DIV', 'UL', 'OL', 'LI']);
                const doc = new DOMParser().parseFromString(html, 'text/html');
                const cleanNode = (node) => {
                    Array.from(node.childNodes).forEach(child => {
                        if (child.nodeType === 1) {
                            if (!allowedTags.has(child.tagName)) {
                                const text = document.createTextNode(child.textContent || '');
                                node.replaceChild(text, child);
                            } else {
                                const bg = child.style && child.style.backgroundColor ? child.style.backgroundColor : '';
                                const fg = child.style && child.style.color ? child.style.color : '';
                                Array.from(child.attributes).forEach(attr => child.removeAttribute(attr.name));
                                if (bg && (child.tagName === 'MARK' || child.tagName === 'SPAN')) {
                                    child.style.backgroundColor = bg;
                                    child.style.color = '#23201E';
                                    child.style.padding = '1px 5px';
                                    child.style.borderRadius = '6px';
                                } else if (fg && child.tagName === 'SPAN') {
                                    child.style.color = fg;
                                }
                                cleanNode(child);
                            }
                        }
                    });
                };
                cleanNode(doc.body);
                return doc.body.innerHTML;
            }

            execRichFormat(editorId, cmd, value = null) {
                const el = document.getElementById(editorId);
                if (!el) return;
                el.focus();
                document.execCommand(cmd, false, value);
            }

            applyTextColor(editorId, hexColor) {
                const el = document.getElementById(editorId);
                if (!el) return;
                el.focus();
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
                    this.toast('Blok/pilih dulu teks yang ingin diubah warnanya.');
                    return;
                }
                if (hexColor === 'default') {
                    document.execCommand('removeFormat', false, null);
                    return;
                }
                const range = sel.getRangeAt(0);
                const span = document.createElement('span');
                span.style.color = hexColor;
                try {
                    const extracted = range.extractContents();
                    span.appendChild(extracted);
                    range.insertNode(span);
                    sel.removeAllRanges();
                } catch (e) {
                    document.execCommand('foreColor', false, hexColor);
                }
            }

            applyPastelHighlight(editorId, hexColor) {
                const el = document.getElementById(editorId);
                if (!el) return;
                el.focus();
                const sel = window.getSelection();
                if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
                    this.toast('Blok/pilih dulu teks yang ingin diberi warna highlight.');
                    return;
                }
                if (hexColor === 'transparent') {
                    document.execCommand('removeFormat', false, null);
                    return;
                }
                const range = sel.getRangeAt(0);
                const mark = document.createElement('mark');
                mark.style.backgroundColor = hexColor;
                mark.style.color = '#23201E';
                mark.style.padding = '1px 5px';
                mark.style.borderRadius = '6px';
                try {
                    const extracted = range.extractContents();
                    mark.appendChild(extracted);
                    range.insertNode(mark);
                    sel.removeAllRanges();
                } catch (e) {
                    document.execCommand('hiliteColor', false, hexColor);
                }
            }

            triggerSparkleBurst(event) {
                const x = event && event.clientX ? event.clientX : window.innerWidth / 2;
                const y = event && event.clientY ? event.clientY : window.innerHeight / 2;
                const symbols = ['✦', '✧', '♡', '✿', '★'];
                const colors = ['#C98288', '#8A78B8', '#6E8F5B', '#D4A037', '#5A82A6'];
                for (let i = 0; i < 14; i++) {
                    const el = document.createElement('span');
                    el.className = 'sparkle-particle';
                    el.textContent = symbols[i % symbols.length];
                    el.style.color = colors[i % colors.length];
                    const angle = (Math.PI * 2 * i) / 14 + (Math.random() * 0.3);
                    const dist = 48 + Math.random() * 52;
                    el.style.left = x + 'px';
                    el.style.top = y + 'px';
                    el.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
                    el.style.setProperty('--ty', Math.sin(angle) * dist - 14 + 'px');
                    document.body.appendChild(el);
                    setTimeout(() => el.remove(), 980);
                }
            }

            handlePhotoFileSelect(inputEl, previewImgId, hiddenInputId) {
                const file = inputEl.files && inputEl.files[0];
                if (!file) return;
                if (!file.type.startsWith('image/')) {
                    this.toast('Pilih berkas gambar yang valid.', 'error');
                    return;
                }
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_DIM = 900;
                        let w = img.width;
                        let h = img.height;
                        if (w > MAX_DIM || h > MAX_DIM) {
                            if (w > h) {
                                h = Math.round((h * MAX_DIM) / w);
                                w = MAX_DIM;
                            } else {
                                w = Math.round((w * MAX_DIM) / h);
                                h = MAX_DIM;
                            }
                        }
                        canvas.width = w;
                        canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.8);
                        const hiddenEl = document.getElementById(hiddenInputId);
                        const prevEl = document.getElementById(previewImgId);
                        if (hiddenEl) hiddenEl.value = compressedDataUrl;
                        if (prevEl) {
                            prevEl.src = compressedDataUrl;
                            prevEl.classList.remove('hidden');
                        }
                        this.toast('Foto berhasil dimuat dari galeri.');
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // =================================================================
            // EXPRESSIVE WEB AUDIO ENGINE ("SUASANA")
            // =================================================================
            toggleAmbientMenu() {
                const menu = document.getElementById('ambient-menu');
                if (menu) menu.classList.toggle('hidden');
            }

            stopAmbientEngine() {
                if (this.ambientEngine) {
                    if (this.ambientEngine.intervals) {
                        this.ambientEngine.intervals.forEach(id => clearInterval(id));
                    }
                    if (this.ambientEngine.nodes) {
                        this.ambientEngine.nodes.forEach(n => {
                            try { n.stop(); } catch (e) {}
                            try { n.disconnect(); } catch (e) {}
                        });
                    }
                    if (this.ambientEngine.ctx) {
                        try { this.ambientEngine.ctx.close(); } catch (e) {}
                    }
                    this.ambientEngine = null;
                }
            }

            createStereoSpace(ctx, masterGain) {
                const delayL = ctx.createDelay(1.0);
                const delayR = ctx.createDelay(1.0);
                delayL.delayTime.value = 0.34;
                delayR.delayTime.value = 0.48;

                const fbL = ctx.createGain();
                const fbR = ctx.createGain();
                fbL.gain.value = 0.32;
                fbR.gain.value = 0.32;

                const dampL = ctx.createBiquadFilter();
                const dampR = ctx.createBiquadFilter();
                dampL.type = 'lowpass';
                dampR.type = 'lowpass';
                dampL.frequency.value = 1750;
                dampR.frequency.value = 1550;

                const merger = ctx.createChannelMerger(2);

                delayL.connect(dampL);
                dampL.connect(fbL);
                fbL.connect(delayR);
                dampL.connect(merger, 0, 0);

                delayR.connect(dampR);
                dampR.connect(fbR);
                fbR.connect(delayL);
                dampR.connect(merger, 0, 1);

                const wetGain = ctx.createGain();
                wetGain.gain.value = 0.36;
                merger.connect(wetGain);
                wetGain.connect(masterGain);

                const sendBus = ctx.createGain();
                sendBus.connect(delayL);
                sendBus.connect(delayR);
                return sendBus;
            }

            selectAmbientTrack(track) {
                this.stopAmbientEngine();
                this.currentTrack = track;

                const btnPill = document.getElementById('ambient-sound-btn');
                const dot = document.getElementById('ambient-sound-dot');
                const eqBars = document.getElementById('ambient-eq-bars');
                const waveIcon = document.getElementById('ambient-wave-icon');
                const label = document.getElementById('ambient-sound-label');
                const menu = document.getElementById('ambient-menu');
                if (menu) menu.classList.add('hidden');

                ['off', 'rain', 'piano', 'cafe', 'nature'].forEach(t => {
                    const btn = document.getElementById('track-btn-' + t);
                    if (btn) {
                        btn.className = t === track
                            ? 'w-full text-left px-3 py-2 rounded-xl text-xs font-bold bg-blush/60 flex items-center justify-between text-charcoal'
                            : 'w-full text-left px-3 py-2 rounded-xl text-xs font-medium hover:bg-cream flex items-center justify-between text-charcoal';
                    }
                });

                const labels = {
                    off: 'Suasana',
                    rain: 'Hujan Lembut',
                    piano: 'Felt Piano',
                    cafe: 'Kafe Pagi',
                    nature: 'Alam Pagi'
                };
                if (label) label.textContent = labels[track] || 'Suasana';

                if (track === 'off') {
                    if (dot) dot.className = 'w-2 h-2 rounded-full bg-softgray/40';
                    if (eqBars) { eqBars.classList.add('hidden'); eqBars.classList.remove('flex'); }
                    if (waveIcon) waveIcon.classList.remove('hidden');
                    if (btnPill) btnPill.classList.remove('ambient-playing-pulse');
                    return;
                }

                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const ctx = new AudioContext();
                    const masterGain = ctx.createGain();
                    masterGain.gain.setValueAtTime(0.001, ctx.currentTime);
                    masterGain.gain.exponentialRampToValueAtTime(0.75, ctx.currentTime + 1.1);
                    masterGain.connect(ctx.destination);

                    const spaceSend = this.createStereoSpace(ctx, masterGain);
                    const engine = { ctx, nodes: [masterGain], intervals: [] };

                    if (track === 'rain' || track === 'cafe' || track === 'nature') {
                        const bufferSize = 3 * ctx.sampleRate;
                        const noiseBuffer = ctx.createBuffer(2, bufferSize, ctx.sampleRate);
                        for (let ch = 0; ch < 2; ch++) {
                            const out = noiseBuffer.getChannelData(ch);
                            let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0;
                            for (let i = 0; i < bufferSize; i++) {
                                const white = Math.random() * 2 - 1;
                                b0 = 0.99886 * b0 + white * 0.0555179;
                                b1 = 0.99332 * b1 + white * 0.0750759;
                                b2 = 0.96900 * b2 + white * 0.1538520;
                                b3 = 0.86650 * b3 + white * 0.3104856;
                                b4 = 0.55000 * b4 + white * 0.5329522;
                                b5 = -0.7616 * b5 - white * 0.0168980;
                                const scale = track === 'rain' ? 0.024 : (track === 'cafe' ? 0.015 : 0.018);
                                out[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + white * 0.5362) * scale;
                                b6 = white * 0.115926;
                            }
                        }
                        const src = ctx.createBufferSource();
                        src.buffer = noiseBuffer;
                        src.loop = true;

                        const filter = ctx.createBiquadFilter();
                        filter.type = track === 'cafe' ? 'bandpass' : 'lowpass';
                        filter.frequency.value = track === 'rain' ? 840 : (track === 'cafe' ? 420 : 620);

                        const lfo = ctx.createOscillator();
                        lfo.frequency.value = track === 'nature' ? 0.18 : 0.11;
                        const lfoGain = ctx.createGain();
                        lfoGain.gain.value = 240;
                        lfo.connect(lfoGain);
                        lfoGain.connect(filter.frequency);

                        src.connect(filter);
                        filter.connect(masterGain);
                        src.start(0);
                        lfo.start(0);
                        engine.nodes.push(src, filter, lfo);

                        if (track === 'cafe') {
                            const cafeChords = [[261.63, 329.63, 392.00, 493.88], [220.00, 261.63, 329.63, 392.00]];
                            let cIdx = 0;
                            const playCafeChord = () => {
                                if (!this.ambientEngine) return;
                                const chord = cafeChords[cIdx % cafeChords.length];
                                const t = ctx.currentTime;
                                chord.forEach(f => {
                                    const osc = ctx.createOscillator();
                                    osc.type = 'sine';
                                    osc.frequency.setValueAtTime(f, t);
                                    const env = ctx.createGain();
                                    env.gain.setValueAtTime(0.0001, t);
                                    env.gain.linearRampToValueAtTime(0.022, t + 0.4);
                                    env.gain.exponentialRampToValueAtTime(0.0001, t + 3.8);
                                    osc.connect(env);
                                    env.connect(masterGain);
                                    env.connect(spaceSend);
                                    osc.start(t);
                                    osc.stop(t + 4.0);
                                });
                                cIdx++;
                            };
                            playCafeChord();
                            engine.intervals.push(setInterval(playCafeChord, 4200));
                        }
                    } else if (track === 'piano') {
                        const chords = [
                            { bass: 87.31, arp: [174.61, 220.00, 261.63, 329.63], mel: [523.25, 493.88, 440.00, 392.00] },
                            { bass: 82.41, arp: [164.81, 196.00, 246.94, 293.66], mel: [493.88, 440.00, 392.00, 329.63] },
                            { bass: 73.42, arp: [146.83, 174.61, 220.00, 261.63], mel: [440.00, 392.00, 349.23, 329.63] },
                            { bass: 65.41, arp: [130.81, 196.00, 246.94, 293.66], mel: [392.00, 440.00, 493.88, 523.25] }
                        ];

                        const triggerFeltNote = (freq, vel, dur, isMelody = false) => {
                            if (!this.ambientEngine) return;
                            const t = ctx.currentTime;
                            const osc1 = ctx.createOscillator();
                            const osc2 = ctx.createOscillator();
                            osc1.type = 'triangle';
                            osc2.type = 'sine';
                            osc1.frequency.setValueAtTime(freq, t);
                            osc2.frequency.setValueAtTime(freq * 1.0015, t);

                            const lp = ctx.createBiquadFilter();
                            lp.type = 'lowpass';
                            lp.frequency.setValueAtTime(isMelody ? 1400 : 760, t);
                            lp.frequency.exponentialRampToValueAtTime(260, t + dur);

                            const env = ctx.createGain();
                            env.gain.setValueAtTime(0.0001, t);
                            env.gain.linearRampToValueAtTime(vel, t + 0.035);
                            env.gain.exponentialRampToValueAtTime(0.0001, t + dur);

                            osc1.connect(lp);
                            osc2.connect(lp);
                            lp.connect(env);
                            env.connect(masterGain);
                            env.connect(spaceSend);

                            osc1.start(t);
                            osc2.start(t);
                            osc1.stop(t + dur + 0.05);
                            osc2.stop(t + dur + 0.05);
                        };

                        let step = 0;
                        const playStep = () => {
                            const bar = Math.floor(step / 8) % chords.length;
                            const beatInBar = step % 8;
                            const c = chords[bar];
                            if (beatInBar === 0) triggerFeltNote(c.bass, 0.08, 4.4, false);
                            triggerFeltNote(c.arp[beatInBar % c.arp.length], 0.04, 2.4, false);
                            if (beatInBar === 1 || beatInBar === 4 || beatInBar === 6) {
                                triggerFeltNote(c.mel[Math.floor(Math.random() * c.mel.length)], 0.06, 3.2, true);
                            }
                            step++;
                        };

                        playStep();
                        engine.intervals.push(setInterval(playStep, 560));
                    }

                    this.ambientEngine = engine;
                    if (dot) dot.className = 'w-2 h-2 rounded-full bg-dusty animate-ping';
                    if (eqBars) { eqBars.classList.remove('hidden'); eqBars.classList.add('flex'); }
                    if (waveIcon) waveIcon.classList.add('hidden');
                    if (btnPill) btnPill.classList.add('ambient-playing-pulse');
                } catch (e) {
                    this.toast('Perangkat tidak mendukung pemutaran audio.', 'error');
                }
            }

            // =================================================================
            // BACKUP & RESTORE JSON
            // =================================================================
            exportBackupData() {
                try {
                    const payload = JSON.stringify(this.state, null, 2);
                    const blob = new Blob([payload], { type: 'application/json' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    const dateStr = new Date().toISOString().slice(0, 10);
                    a.href = url;
                    a.download = `dearly-backup-${dateStr}.json`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    URL.revokeObjectURL(url);
                    this.toast('Cadangan data Dearly (.json) berhasil diunduh.');
                } catch (e) {
                    this.toast('Gagal mengunduh cadangan data.', 'error');
                }
            }

            importBackupData(inputEl) {
                const file = inputEl.files && inputEl.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const parsed = JSON.parse(e.target.result);
                        if (!parsed || !parsed.data) {
                            this.toast('Format berkas cadangan Dearly tidak valid.', 'error');
                            return;
                        }
                        this.state = this.mergeWithDefault(parsed);
                        this.applyThemeVariables();
                        this.saveState();
                        this.closeModal();
                        this.render();
                        this.toast('Data Dearly berhasil dipulihkan!');
                    } catch (err) {
                        this.toast('Berkas cadangan rusak.', 'error');
                    }
                };
                reader.readAsText(file);
            }

            render() {
                document.querySelectorAll('[data-nav]').forEach(btn => {
                    const r = btn.getAttribute('data-nav');
                    const isActive = r === this.currentRoute || (r === 'all' && ['journal','memories','letter','habits','goals','finance','watchlist','wishlist','recipes','notes'].includes(this.currentRoute));
                    btn.className = isActive
                        ? 'nav-btn px-4 py-1.5 rounded-full bg-ivory text-charcoal shadow-sm font-semibold transition-all border border-borderwarm/60'
                        : 'nav-btn px-4 py-1.5 rounded-full text-muted hover:text-charcoal transition-all';
                });

                document.querySelectorAll('[data-nav-mobile]').forEach(btn => {
                    const r = btn.getAttribute('data-nav-mobile');
                    const isActive = r === this.currentRoute;
                    btn.className = isActive
                        ? 'mobile-nav-btn flex flex-col items-center gap-0.5 px-3.5 py-1.5 rounded-full bg-blush/60 text-dusty text-[11px] font-semibold transition-all'
                        : 'mobile-nav-btn flex flex-col items-center gap-0.5 px-3.5 py-1.5 rounded-full text-muted text-[11px] font-medium transition-all';
                });

                const root = document.getElementById('app-root');
                if (!root) return;

                switch (this.currentRoute) {
                    case 'home': root.innerHTML = this.renderHomeView(); break;
                    case 'all': root.innerHTML = this.renderAllFeaturesView(); break;
                    case 'templates': root.innerHTML = this.renderTemplateGalleryView(); break;
                    case 'journal': root.innerHTML = this.renderJournalView(); break;
                    case 'memories': root.innerHTML = this.renderMemoriesView(); break;
                    case 'letter': root.innerHTML = this.renderLetterView(); break;
                    case 'habits': root.innerHTML = this.renderHabitsView(); break;
                    case 'goals': root.innerHTML = this.renderGoalsView(); break;
                    case 'finance': root.innerHTML = this.renderFinanceView(); break;
                    case 'watchlist': root.innerHTML = this.renderWatchlistView(); break;
                    case 'wishlist': root.innerHTML = this.renderWishlistView(); break;
                    case 'recipes': root.innerHTML = this.renderRecipesView(); break;
                    case 'activities': root.innerHTML = this.renderActivitiesView(); break;
                    case 'notes': root.innerHTML = this.renderNotesView(); break;
                    default: root.innerHTML = this.renderHomeView(); break;
                }
            }

                                    <span class="text-xs font-semibold text-muted">Dreams & Savings</span>

                                    <div class="flex items-baseline justify-between gap-2">
                                        <span class="font-serif text-2xl font-semibold text-charcoal">${savingPct}%</span>

            renderLatestMemoryCard() {
                const mem = this.state.data.memories[0];
                if (!mem) {
                    return `
                    <div class="p-5 rounded-2xl bg-cream border border-borderwarm flex items-center justify-between gap-4">
                        <div class="space-y-1.5">
                            <div class="font-serif text-lg font-medium text-charcoal">No memories yet.</div>
                            <p class="text-xs text-muted leading-relaxed">Maybe today is a good day to save one little moment.</p>
                            <button onclick="app.openMemoryForm()" class="mt-2 px-4 py-1.5 rounded-full bg-dusty text-white text-xs font-semibold">+ Simpan Kenangan</button>
                        </div>
                        <div class="shrink-0">${DEARLY_ILLUSTRATIONS.companionPuff}</div>
                    </div>`;
                }
                return `
                <div onclick="app.navigate('memories')" class="cursor-pointer rounded-2xl bg-cream hover:opacity-90 border border-borderwarm p-4 flex items-center gap-4 transition-all">
                    ${mem.photo
                        ? `<img src="${this.escapeHtml(mem.photo)}" class="w-20 h-20 rounded-2xl object-cover shrink-0 border border-borderwarm">`

                    <div class="min-w-0 space-y-1">
                        <span class="font-hand text-base text-dusty">${this.formatDate(mem.date)}</span>
                        <h4 class="font-serif text-lg font-semibold text-charcoal truncate">${this.escapeHtml(mem.title)}</h4>
                        <p class="text-xs text-muted line-clamp-2 leading-relaxed">${this.escapeHtml(mem.story)}</p>

                </div>`;
